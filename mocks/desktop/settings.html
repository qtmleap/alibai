<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>AlibAI デスクトップ — 設定</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Roboto+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./_desk.css" />
    <link rel="stylesheet" href="../_motion.css" />
    <link rel="stylesheet" href="../_mock.css" />
    <style>
      /* 数は打ち替えられる。枠と高さは _desk.css の .num のまま借りる。 */
      .set .num { background: none; width: 100%; }
      .set .back { text-decoration: none; }
    </style>
  </head>
  <body>
    <!-- 物語の外にある唯一の画面。机には載せず、表も引かない。ラベルと操作を左右で組む。 -->
    <div class="set screen-enter" data-mock-id="ALI_SET_01">
      <div class="inner">
        <a class="back" href="./scenario-select.html" data-mock-id="ALI_SET_02">←　事件を選ぶ</a>
        <div data-mock-id="ALI_SET_03">
          <h2>設定</h2>
          <p class="lead">この端末にだけ保存されます。サーバには残らず、あなたのプレイにだけ効きます。</p>
        </div>

        <div class="grp" data-mock-id="ALI_SET_04">
          <span class="label">使うモデル</span>
          <div id="roles"></div>
          <p class="fine" data-mock-id="ALI_SET_08">Google は APIキーが未設定のため選べません。</p>
        </div>

        <div class="grp" data-mock-id="ALI_SET_09">
          <span class="label">進行</span>
          <p class="fine">新しく始める事件から効きます。進行中のものは変わりません。</p>
          <div class="trio">
            <div class="fld" data-mock-id="ALI_SET_10">
              <span class="label">ターン数</span><input class="num" id="turns" type="number" min="1" max="20" value="5" />
            </div>
            <div class="fld" data-mock-id="ALI_SET_10">
              <span class="label">1ターンの質問</span><input class="num" id="perTurn" type="number" min="1" max="4" value="1" />
            </div>
            <div class="fld" data-mock-id="ALI_SET_10">
              <span class="label">1話題の往復</span><input class="num" id="rounds" type="number" min="1" max="6" value="3" />
            </div>
          </div>
          <p class="sum" id="sum" data-mock-id="ALI_SET_11"></p>
        </div>

        <!--
          事件の記録の見せ方。
          演出の好みなので、記録の画面に切り替えを置くと毎回そこで一拍止まる。
          物語の外にあるこの画面へ寄せて、始める前に一度だけ決めてもらう。
        -->
        <div class="grp" data-mock-id="ALI_SET_12">
          <span class="label">事件の記録</span>
          <div class="role">
            <div>
              <div class="nm">見せ方</div>
              <div class="ps">読み上げの運び</div>
            </div>
            <div class="modes" id="brief" data-mock-id="ALI_SET_13"></div>
          </div>
          <div class="role">
            <div>
              <div class="nm">打鍵音</div>
              <div class="ps">一段落ずつのときだけ鳴ります</div>
            </div>
            <div class="modes" id="sound" data-mock-id="ALI_SET_14"></div>
          </div>
          <p class="fine" id="brieffine"></p>
        </div>
      </div>
    </div>

    <script src="../_case.js"></script>
    <script src="../_mock.js"></script>
    <script>
      ;(function () {
        // 設定は物語の外の値なので、事件データではなくここに素で置く。
        var unset = Mock.str('unset', '0') === '1'
        var roles = [
          {
            name: '会話',
            note: 'NPCの受け答えと、探偵が組み立てる質問',
            provider: unset ? null : 'Anthropic',
            model: unset ? null : 'Claude Sonnet 5',
          },
          { name: '判定', note: '証拠の開示と、推理の採点', provider: null, model: null },
        ]

        // 提供元が決まるまでモデルは触れない。枠を地に沈めて、押せないことを枠で言う。
        var cell = function (value, locked, id) {
          var cls = value ? 'sel2' : locked ? 'sel2 locked' : 'sel2 unset'
          return (
            '<span class="' +
            cls +
            '" data-mock-id="' +
            id +
            '"><span>' +
            Mock.esc(value || '既定のまま') +
            '</span><span class="ar">▼</span></span>'
          )
        }

        document.getElementById('roles').innerHTML = roles
          .map(function (r) {
            return (
              '<div class="role" data-mock-id="ALI_SET_05">' +
              '<div><div class="nm">' +
              Mock.esc(r.name) +
              '</div><div class="ps">' +
              Mock.esc(r.note) +
              '</div></div>' +
              '<div class="pair">' +
              '<div class="fld"><span class="label">提供元</span>' +
              cell(r.provider, false, 'ALI_SET_06') +
              '</div>' +
              '<div class="fld"><span class="label">モデル</span>' +
              cell(r.model, !r.provider, 'ALI_SET_07') +
              '</div>' +
              '</div></div>'
            )
          })
          .join('')

        var CAP = 20
        var sum = function () {
          var turns = Number(document.getElementById('turns').value)
          var perTurn = Number(document.getElementById('perTurn').value)
          var rounds = Number(document.getElementById('rounds').value)
          // 1話題ぶんの呼び出し。往復のたびに二度、締めに一度。
          var calls = rounds * 2 + 1
          document.getElementById('sum').innerHTML =
            turns +
            'ターン × ' +
            perTurn +
            '問 ＝ <b>全部で' +
            turns * perTurn +
            '問</b>（上限' +
            CAP +
            '問）。<br>1話題ごとに、モデルを<b>' +
            calls +
            '回</b>呼びます。'
          Mock.refresh()
        }
        ;['turns', 'perTurn', 'rounds'].forEach(function (id) {
          document.getElementById(id).addEventListener('input', sum)
        })
        sum()

        /*
         * 見せ方は二択、打鍵音は入切。
         * 音は打鍵のときしか鳴らないので、せり上がるを選んでいるあいだは
         * モデルの欄と同じ扱いで沈める——押せないことを枠と色で言う。
         */
        var brief = Mock.str('brief', 'typewriter')
        var sound = Mock.str('sound', 'on')
        var pickable = brief === 'typewriter'

        var choices = function (el, items, current, live) {
          document.getElementById(el).innerHTML = items
            .map(function (i) {
              return (
                '<span class="' +
                (live && i.key === current ? 'on' : '') +
                '" style="' +
                (live ? '' : 'color:var(--nezumi-dim); border-bottom-color:var(--sumi-3)') +
                '" data-set="' +
                el +
                '=' +
                i.key +
                '">' +
                i.name +
                '</span>'
              )
            })
            .join('')
        }
        choices('brief', [{ key: 'typewriter', name: '一段落ずつ' }, { key: 'crawl', name: 'せり上がる' }], brief, true)
        choices('sound', [{ key: 'on', name: '鳴らす' }, { key: 'off', name: '鳴らさない' }], sound, pickable)

        document.getElementById('brieffine').textContent = pickable
          ? '一段落ずつは、読む速さをあなたが握ります。'
          : 'せり上がるは速さが決まっているぶん、音は鳴りません。'

        Array.prototype.forEach.call(document.querySelectorAll('[data-set]'), function (el) {
          el.addEventListener('click', function () {
            var kv = el.dataset.set.split('=')
            location.hash =
              'brief=' + (kv[0] === 'brief' ? kv[1] : brief) + '&sound=' + (kv[0] === 'sound' ? kv[1] : sound)
            location.reload()
          })
        })

        Mock.ready()
      })()
    </script>
  </body>
</html>
