<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>AlibAI デスクトップ — 探偵を決める</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Roboto+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./_desk.css" />
    <link rel="stylesheet" href="../_mock.css" />
    <style>
      /*
        誰として調べるか。

        表が立つのは支度の画面からで、ここはその手前。だから左に置くのはアリバイ表では
        なく探偵の名簿だが、割り方は机と同じにする——区切りの位置も右の行長も
        （--work-w から採る）。支度へ進んだ瞬間に縦罫が横へ飛ぶと、
        同じ机に座り直した感じが切れる。

        一列にしないのは、この画面に材質の違うものが二つあるから——選ぶための名簿と、
        一人ぶんの人物像。左右に割れば、直しているあいだも名簿が視界から消えない。
        端末では割れないので入れ替えるが、机では両方を出しておける。
      */

      .det {
        height: 100%;
        display: grid;
        grid-template-columns: 1fr var(--work-w);
        min-height: 0;
      }
      /* リンクの既定の青と下線は持ち込ませない。枠と字の明るさだけで格を分ける。 */
      .det a { text-decoration: none; }
      .back { font-size: 12.5px; color: var(--nezumi); flex: none; }
      /* 戻るリンクと見出しのあいだ。机では上部バーがこの間合いを持っている。 */
      .det .wh { margin-top: 22px; }
      /* 区切りは左列が持つ。机では .board の border-right がこれにあたる。 */
      .det > .lt {
        border-right: 1px solid var(--keisen);
        padding: 34px 34px 26px 22px;
      }
      .det > .rt { padding: 34px 34px 26px; }
      .det > .lt, .det > .rt {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow-y: auto;
      }
      /*
        姿見は一人ぶんしかないので、上に詰めると下に机半分ぶんの空白が残る。
        天地の真ん中に置けば、空きが「足りなかった」ではなく「そう置いた」に見える。
        フォームは上から書いていくものなので、こちらは詰めたまま。
      */
      .det .rt.mid { justify-content: center; }

      /* ---- 左：名簿 ---- */
      /*
        選択は塗らずに左端の一本で示す。行の頭は全行そろえたいので、枠ではなく
        内側の影で引く——枠だと選ばれた行だけ字が右へずれる。
      */
      .roster .r { align-items: flex-start; padding-left: 14px; }
      .roster .r.on { box-shadow: inset 2px 0 0 var(--kinari); }
      .roster .pick {
        display: flex; flex-direction: column; min-width: 0;
        background: none; border: 0; padding: 0; text-align: left;
        color: inherit; font: inherit;
      }
      .roster .nm { font-size: 13.5px; line-height: 1.5; color: var(--nezumi); }
      .roster .r.on .nm { color: var(--kinari); }
      .roster .ps { font-size: 11.5px; color: var(--nezumi-dim); line-height: 1.6; }
      /* 消すほうは一段沈める。並べて置くと押し間違える。 */
      .roster .acts { margin-left: auto; flex: none; display: flex; gap: 14px; padding-top: 2px; }
      .roster .acts span { font-size: 11.5px; color: var(--nezumi); }
      .roster .acts span + span { color: var(--nezumi-dim); }

      .add {
        align-self: flex-start; margin-top: 14px;
        background: none; border: 0; padding: 0;
        font-size: 12.5px; letter-spacing: 0.08em; color: var(--nezumi);
      }

      /* 押せない一手は枠ごと沈める。字だけ薄くすると、枠が押せると言い続ける。 */
      .go.off { color: var(--nezumi-dim); border-color: var(--keisen); }

      /* ---- 右：姿見 ---- */
      .mirror .who {
        font-family: var(--mincho); font-weight: 700;
        font-size: 24px; letter-spacing: 0.06em; line-height: 1.5;
        margin-top: 10px;
      }
      .mirror .attr { font-size: 12.5px; color: var(--nezumi); margin-top: 4px; }
      .mirror .look {
        margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--keisen);
        font-size: 13px; line-height: 2; color: var(--nezumi); max-width: 34em;
      }
      .mirror .look.none { color: var(--nezumi-dim); }
      .mirror .edit {
        align-self: flex-start; margin-top: 20px;
        background: none; border: 0; padding: 0;
        font-size: 12.5px; color: var(--nezumi);
      }

      /* ---- 右：つくる／編集する ---- */
      .form h3 {
        font-family: var(--mincho); font-weight: 700;
        font-size: 20px; letter-spacing: 0.08em; margin: 0;
      }
      .form input[type="text"] {
        width: 100%; background: none;
        border: 0; border-bottom: 1px solid var(--keisen);
        padding: 7px 0; font-size: 13.5px;
      }
      .form textarea {
        width: 100%; resize: none; background: none;
        border: 1px solid var(--keisen); padding: 11px 13px;
        font-size: 13px; line-height: 1.95; height: 88px;
      }
      .form input::placeholder, .form textarea::placeholder { color: var(--nezumi-dim); }
      /*
        年ごろは七つあり、注記まで抱えている。等分に割ると「見た目からは測れない」が
        入らないので、ここだけ中身なりの幅で折り返す。性別は四つなので .modes のまま。
      */
      .ages { display: flex; flex-wrap: wrap; column-gap: 24px; row-gap: 10px; }
      .ages span {
        padding: 8px 0; font-size: 12.5px; color: var(--nezumi-dim);
        border-bottom: 1px solid var(--keisen);
      }
      .ages span .n { margin-left: 8px; font-size: 10px; }
      .ages .on { color: var(--kinari); border-bottom-color: var(--kinari); }
    </style>
  </head>
  <body>
    <div class="det" data-mock-id="ALI_DET_01">
      <div class="lt">
        <a class="back" href="./scenario-select.html" data-mock-id="ALI_DET_02">←　シナリオを選び直す</a>

        <div class="wh" data-mock-id="ALI_DET_03">
          <h2 id="ttl"></h2>
          <p class="lead">
            誰として、この事件を調べますか。<br />
            選んだ人物像は聞き込みの相手にも伝わり、呼びかけ方や態度が変わります。
          </p>
        </div>

        <div class="grp">
          <span class="label">探偵</span>
          <div class="cast roster" id="roster" data-mock-id="ALI_DET_04"></div>
          <p class="fine" id="none" data-mock-id="ALI_DET_17" hidden>
            まだ探偵がいません。作るか、名乗らずに始めることもできます。
          </p>
          <button class="add" type="button" data-go="form=new" data-mock-id="ALI_DET_07">
            ＋ 新しい探偵をつくる
          </button>
        </div>

        <div class="foot">
          <a class="go" id="cta" href="./briefing.html" data-mock-id="ALI_DET_08"></a>
          <a class="again" href="./briefing.html" data-mock-id="ALI_DET_09">名乗らずに始める</a>
        </div>
      </div>

      <div class="rt" id="rt"></div>
    </div>

    <script src="../_case.js"></script>
    <script src="../_mock.js"></script>
    <script>
      ;(function () {
        // 探偵は事件のデータではない——遊ぶ人の持ち物なので、_case.js には置かずここに素で持つ。
        var PEOPLE = [
          {
            key: 'akari',
            name: '日下部 灯',
            attr: '壮年 ・ 女性',
            look: '背の低い痩身。読みかけの文庫をいつも外套の右に入れている。',
          },
          {
            key: 'tohru',
            name: '甲斐 透',
            attr: '老齢 ・ 男性',
            look: '白髪を短く刈った長身。杖はつくが足取りは速い。',
          },
          // 容姿を書かないまま保存できる。行が一段短くなる見え方をここで確かめる。
          { key: 'ash', name: '灰かぶり', attr: '年齢不詳 ・ 明かさない', look: '' },
        ]

        var AGES = [
          { name: '子供', note: '12歳ごろまで' },
          { name: '十代', note: '13〜19歳ごろ' },
          { name: '若者', note: '20代' },
          { name: '壮年', note: '30〜40代' },
          { name: '初老', note: '50〜60代' },
          { name: '老齢', note: '70代以上' },
          { name: '年齢不詳', note: '見た目からは測れない' },
        ]
        var GENDERS = ['男性', '女性', 'どちらでもない', '明かさない']

        var empty = Mock.str('empty', '0') === '1'
        var form = Mock.str('form', '')
        var people = empty ? [] : PEOPLE
        var picked = people[0]

        document.getElementById('ttl').textContent = Mock.case.title

        /* ---- 左：名簿 ---- */
        document.getElementById('roster').innerHTML = people
          .map(function (p) {
            var look = p.look ? '<span class="ps">' + Mock.esc(p.look) + '</span>' : ''
            return (
              '<div class="r' +
              (p === picked ? ' on' : '') +
              '" data-mock-id="ALI_DET_05"><button class="pick" type="button">' +
              '<span class="nm">' +
              Mock.esc(p.name) +
              '</span><span class="ps">' +
              Mock.esc(p.attr) +
              '</span>' +
              look +
              '</button><span class="acts" data-mock-id="ALI_DET_06">' +
              '<span data-go="form=edit">編集</span><span>削除</span></span></div>'
            )
          })
          .join('')
        document.getElementById('none').hidden = !empty

        var cta = document.getElementById('cta')
        cta.textContent = picked ? picked.name + ' で事件に向かう' : '探偵を選んでください'
        cta.className = picked ? 'go' : 'go off'
        if (!picked) {
          cta.removeAttribute('href')
        }

        /* ---- 右：姿見、またはフォーム ---- */
        var mirror = function (p) {
          return (
            '<div class="mirror" data-mock-id="ALI_DET_10">' +
            '<span class="label">この人として調べます</span>' +
            '<div class="who">' +
            Mock.esc(p.name) +
            '</div><div class="attr">' +
            Mock.esc(p.attr) +
            '</div><p class="look' +
            (p.look ? '' : ' none') +
            '">' +
            Mock.esc(p.look || '容姿は書かれていません。') +
            '</p><button class="edit" type="button" data-go="form=edit">この探偵を編集する</button></div>'
          )
        }

        var choices = function (items, on) {
          return items
            .map(function (i, n) {
              return (
                '<span class="' +
                (n === on ? 'on' : '') +
                '">' +
                Mock.esc(i.name || i) +
                (i.note ? '<span class="n">' + Mock.esc(i.note) + '</span>' : '') +
                '</span>'
              )
            })
            .join('')
        }

        var sheet = function (editing) {
          // 新規は「年齢不詳・明かさない」から始まる。決めていないなら決めないまま遊べる。
          var age = editing ? 3 : 6
          var gender = editing ? 1 : 3
          return (
            '<div class="form" data-mock-id="ALI_DET_11">' +
            '<h3>' +
            (editing ? '探偵を編集する' : '探偵をつくる') +
            '</h3>' +
            '<div class="grp"><span class="label">名前</span>' +
            '<input type="text" placeholder="例：日下部 灯" data-mock-id="ALI_DET_12" value="' +
            (editing ? Mock.esc(PEOPLE[0].name) : '') +
            '" /></div>' +
            '<div class="grp"><span class="label">年ごろ</span>' +
            '<div class="ages" data-mock-id="ALI_DET_13">' +
            choices(AGES, age) +
            '</div></div>' +
            '<div class="grp"><span class="label">性別</span>' +
            '<div class="modes" data-mock-id="ALI_DET_14">' +
            choices(GENDERS, gender) +
            '</div></div>' +
            '<div class="grp"><span class="label">容姿</span>' +
            '<textarea placeholder="例：くたびれたコートを着た長身。目つきが鋭く、口数は少ない。" data-mock-id="ALI_DET_15">' +
            (editing ? Mock.esc(PEOPLE[0].look) : '') +
            '</textarea></div>' +
            // 名前が空のあいだは保存できない。全部を必須にすると遊び始めるまでが遠い。
            // やめるは枠を持たせない——保存が沈んでいるあいだ、枠つきの取り消しが主役に見えてしまう。
            '<div class="foot" data-mock-id="ALI_DET_16">' +
            '<span class="go' +
            (editing ? '' : ' off') +
            '">保存する</span>' +
            (editing
              ? ''
              : '<p class="fine" style="text-align:center">名前が決まると保存できます。</p>') +
            '<button class="again" type="button" data-go="">やめる</button>' +
            '</div></div>'
          )
        }

        var rt = document.getElementById('rt')
        rt.className = form ? 'rt' : 'rt mid'
        rt.innerHTML = form
          ? sheet(form === 'edit')
          : picked
            ? mirror(picked)
            : '<p class="fine">探偵を作ると、ここにその人の姿が出ます。</p>'

        // 押下の模擬はハッシュを書いて読み直す。このモック群の型どおり。
        Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function (el) {
          el.addEventListener('click', function () {
            location.hash = el.dataset.go + (empty ? '&empty=1' : '')
            location.reload()
          })
        })

        Mock.ready()
      })()
    </script>
  </body>
</html>
