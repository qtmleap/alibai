<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>AlibAI デスクトップ — 支度</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Roboto+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./_desk.css" />
    <link rel="stylesheet" href="../_motion.css" />
    <link rel="stylesheet" href="../_mock.css" />
    <style>
      /*
        支度。
        モバイルでは「事件の記録」が独立した画面で、支度からは
        「もう一度読む」で戻る作りだった。机の上ではその往復が要らない——
        記録を左に開いたまま、右で誰から聞くかを決められる。
        だからこの画面から「もう一度読む」は消えている。
      */

      /*
        右半分は一列に積む。
        以前は記録と名簿を左右に割っていたが、左の表を実寸で広げた分ここが狭まり、
        二列にすると記録が一行十四字まで痩せて読めなくなった。
        割るのをやめ、読む物（記録）を柱に、決める物（名簿・CTA）を床側へ重ねる。
      */

      /* 記録は読み物。行長を締め、段落の間だけを空ける。ここだけが縦に伸び縮みする。 */
      .record { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 26px 4px 0; }
      .record p { margin: 0 0 15px; font-size: 13.5px; line-height: 2.05; color: var(--nezumi); max-width: 34em; }
      .record p:first-child { color: var(--nezumi-dim); font-size: 12.5px; letter-spacing: 0.06em; }
      .record p:last-child { margin-bottom: 0; }
      /* 記録のなかの時刻だけは等幅にせず地の文のまま。読みがそこで切れるため。 */
      .record em { font-style: normal; color: var(--kinari); }

      /*
        決める側は縮ませない。記録が長くても、押す物が痩せて消えることはない。
        名簿の上だけ罫を引いて、読む面と決める面の境をひとつ作る。
      */
      .work > .grp, .work > .foot { flex: none; }
      .work > .grp { border-top: 1px solid var(--keisen); padding-top: 18px; position: relative; }
      /*
        記録は入りきらず、罫のところで断ち切れる。切れ口に霞をかけて、
        途切れではなく「まだ下に続いている」ことを示す——聞き込みの記録欄と同じ手。
      */
      .work > .grp::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        /* 基準はパディングボックスなので、100% だけだと罫の上に乗って線を消してしまう。 */
        bottom: calc(100% + 1px);
        height: 46px;
        background: linear-gradient(to top, var(--sumi), transparent);
        pointer-events: none;
      }
      /*
        名簿を一列に積むと四人で三百px を占め、記録が二行しか残らなかった。
        横は余っているので二列に畳む——空いているほうへ逃がして、縦は読み物に返す。
      */
      .work > .grp .cast { display: grid; grid-template-columns: 1fr 1fr; column-gap: 30px; }
      /* 上端の罫は一行目の二枡ぶん。既定の :first-child だけだと右が欠ける。 */
      .work > .grp .cast .r:nth-child(-n + 2) { border-top: 1px solid var(--keisen); }
      /*
        場所の束は名簿のすぐ下に続ける。霞は「記録が断ち切れている」ことを示す印なので、
        二つ目の束には掛けない——掛けると名簿の下端に霧が下りて、行が消えかけて見える。
      */
      .work > .grp.more { padding-top: 14px; }
      .work > .grp.more::before { content: none; }
      /* 名簿を選んだ直後に押すものなので、間を空けずすぐ下に置く。 */
      .work > .foot { margin-top: 0; padding-top: 18px; }

      /* 名簿の行は押せる。押せるものを div のままにしない。 */
      button.r { background: none; border: 0; font: inherit; color: inherit; text-align: left; width: 100%; }
      button.r[disabled] { opacity: 1; }
      .back, .go { text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="desk screen-enter" data-mock-id="ALI_OVW_01">
      <div class="top">
        <a class="back" href="./scenario-select.html" data-mock-id="ALI_OVW_02">←　事件を選ぶ</a>
        <div class="rgt">
          <span id="turns"></span>
          <span id="est"></span>
        </div>
      </div>

      <div class="panes">
        <!--
          左の板は聞き込みが始まる前から据え置く。まだ何も置かれていない表を
          先に見せておくと、これから何を埋めていく遊びなのかが分かる。
        -->
        <div class="board" data-mock-id="ALI_OVW_04">
          <div class="bh">
            <span class="nm">アリバイ表</span>
            <span class="label t" id="bspan"></span>
          </div>
          <div class="cols chart-head" id="head"></div>
          <div class="chart cols" id="chart"></div>
          <div class="legend">
            <span class="k"><b>実線</b></span><span>裏付けあり</span>
            <span class="k cl"><b>破線</b></span><span>本人の申告のみ</span>
          </div>
        </div>

        <div class="work">
          <div class="wh" data-mock-id="ALI_OVW_03">
            <h2 id="ttl"></h2>
            <p class="lead" id="lead"></p>
          </div>

          <div class="record" data-mock-id="ALI_OVW_05">
            <span class="label" style="display: block; padding-bottom: 12px">事件の記録</span>
            <div id="record"></div>
          </div>

          <div class="grp">
            <span class="label">まず誰から話を聞くか</span>
            <div class="cast" id="cast" data-mock-id="ALI_OVW_06"></div>
          </div>

          <!--
            調べられる場所。人の名簿とは見出しで分ける——同じ一手を使うとはいえ、
            「誰から聞くか」と「どこを見るか」は迷い方が違う。
          -->
          <div class="grp more" id="placeGrp" data-mock-id="ALI_OVW_11" hidden>
            <span class="label">どこを調べるか</span>
            <div class="cast" id="places"></div>
          </div>

          <div class="foot">
            <a class="go" id="go" href="./interrogation.html#turn=1" data-mock-id="ALI_OVW_09"></a>
          </div>
        </div>
      </div>
    </div>

    <script src="../_case.js"></script>
    <script src="../_mock.js"></script>
    <script>
      ;(function () {
        var C = Mock.case
        var pick = Mock.str('who', C.cast[0].key)

        document.getElementById('ttl').textContent = C.title
        document.getElementById('lead').textContent = C.lead
        document.getElementById('bspan').textContent = C.span.from + ' − ' + C.span.to
        document.getElementById('turns').textContent = '全' + C.turns + 'ターン'
        document.getElementById('est').textContent = '約10分'

        document.getElementById('record').innerHTML = C.briefLong
          .map(function (p) {
            return '<p>' + p + '</p>'
          })
          .join('')

        // 表はまだ白紙。線を引くのはこれから始まる聞き込みの仕事。
        document.getElementById('head').innerHTML = Mock.chartHead({})
        document.getElementById('chart').innerHTML = Mock.chart({ segments: [] })

        /*
         * 名簿には亡くなった人も並べる。別枠にすると、その夜そこに居たのは誰かという
         * 一覧が二つに割れる。喋らない相手には右端の札を「調べる」に替える——
         * 押せる相手なのか名簿の上で分かるように。
         */
        var row = function (p, kind) {
          // 所見も死因も無い事件では、遺体の行は押せないまま。押せるのに何も出ない行は作らない。
          var canPick = kind !== 'victim' || C.victim.investigable
          var tag = kind === 'cast' ? '' : canPick ? '調べる' : '被害者'
          return (
            '<button class="r" type="button" style="color:var(--' +
            p.hue +
            Mock.lit +
            ')" data-mock-id="' +
            (kind === 'place' ? 'ALI_OVW_12' : 'ALI_OVW_07') +
            '" data-who="' +
            p.key +
            '"' +
            (canPick ? '' : ' disabled') +
            '>' +
            '<span class="face' +
            (kind === 'place' ? ' pl' : '') +
            (pick === p.key ? ' on' : '') +
            '">' +
            p.face +
            '</span>' +
            '<span class="col2"><span class="nm">' +
            Mock.esc(p.name) +
            '</span><span class="ps">' +
            Mock.esc(p.blurb) +
            '</span></span>' +
            (tag === '' ? '' : '<span class="role">' + tag + '</span>') +
            '</button>'
          )
        }

        document.getElementById('cast').innerHTML = C.cast
          .map(function (p) {
            return row(p, 'cast')
          })
          .concat([row(C.victim, 'victim')])
          .join('')

        // 場所の無い事件では見出しごと出さない。空の見出しは「何か足りない」に見える。
        if (Mock.places.length > 0) {
          document.getElementById('placeGrp').hidden = false
          document.getElementById('places').innerHTML = Mock.places
            .map(function (p) {
              return row(p, 'place')
            })
            .join('')
        }

        var who = Mock.cast[pick]
        var go = document.getElementById('go')
        // 遺体も場所も訊く相手ではないので、開始の文言が「調べる」に替わる。
        go.textContent = who.name + (Mock.examines(pick) ? 'を調べる' : 'に聞き込みをする')
        go.href = './interrogation.html#turn=1&who=' + pick

        Array.prototype.forEach.call(document.querySelectorAll('[data-who]'), function (el) {
          el.addEventListener('click', function () {
            location.hash = 'who=' + el.dataset.who
            location.reload()
          })
        })

        Mock.ready()
      })()
    </script>
  </body>
</html>
