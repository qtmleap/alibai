<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>AlibAI デスクトップ — 事件を選ぶ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Roboto+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./_desk.css" />
    <link rel="stylesheet" href="../_mock.css" />
    <style>
      /*
        事件を選ぶ。

        モバイルはページ送りだが、机の上では送らない。三列に並べれば全43件が
        三画面弱に収まり、スクロールのほうが速い。番号で送ると、探している事件が
        どのページにあったかを覚えていないと戻れない。

        分類は各セルに持たせ、見出しでまとめない。分類ごとに見出しを立てると、
        一件しかない分類が六つ続く末尾で、そのたびに幅の三分の二が空く。
        それに格子は上から順に読むとは限らないので、どのセルも単独で
        何の事件か分かる必要がある——一件目にだけ分類を書く作りは列では成立しない。
      */

      .page { max-width: 1240px; margin: 0 auto; padding: 0 40px 90px; }

      .masthead {
        display: flex; align-items: baseline; justify-content: space-between;
        padding: 72px 0 30px;
      }
      .masthead h1 { margin: 0; font-family: var(--mincho); font-weight: 700; font-size: 42px; letter-spacing: 0.18em; }
      .masthead .sub { display: block; margin-top: 10px; font-size: 11px; color: var(--nezumi-dim); letter-spacing: 0.3em; }
      .masthead .rgt { display: flex; align-items: baseline; gap: 26px; }
      .masthead .rgt .total { font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em; color: var(--nezumi-dim); }
      .masthead .rgt .set { font-size: 12.5px; color: var(--nezumi); background: none; border: 0; padding: 0; text-decoration: none; }

      /* 三列。行の高さは中身に任せ、罫線だけで分ける。 */
      .grid {
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
        column-gap: 44px; border-top: 1px solid var(--keisen);
      }
      .case {
        display: flex; flex-direction: column; gap: 2px; align-items: flex-start;
        padding: 13px 0; text-align: left;
        background: none; border: 0; border-bottom: 1px solid var(--keisen);
        color: inherit; font: inherit; text-decoration: none;
      }
      .case .cat { font-size: 10px; color: var(--nezumi-dim); letter-spacing: 0.16em; line-height: 1.5; }
      .case .ttl { font-family: var(--mincho); font-weight: 500; font-size: 15px; line-height: 1.5; letter-spacing: 0.03em; }
      .case .meta { font-size: 11px; color: var(--nezumi-dim); line-height: 1.5; }

      /* モックだけの断り書き。実装には持ち込まない。 */
      .note-line { padding-bottom: 12px; }
    </style>
  </head>
  <body>
    <div class="page" data-mock-id="ALI_SEL_01">
      <header class="masthead" data-mock-id="ALI_SEL_02">
        <h1>AlibAI<span class="sub">聞き込みで、犯人を指し示す</span></h1>
        <div class="rgt">
          <span class="total" id="total" data-mock-id="ALI_SEL_03"></span>
          <a class="set" href="./settings.html" data-mock-id="ALI_SEL_04">設定</a>
        </div>
      </header>

      <p class="note-line mock-note" id="note"></p>

      <div class="grid" id="grid" data-mock-id="ALI_SEL_05"></div>
    </div>

    <script src="../_case.js"></script>
    <script src="../_mock.js"></script>
    <script>
      ;(function () {
        var list = window.CASES
        document.getElementById('total').textContent = list.length + '件'

        var playable = list.filter(function (c) {
          return c.playable
        })[0]
        document.getElementById('note').textContent =
          'モックで通しで動くのは「' + playable.title + '」の一件です。どの行を押しても、その一件が始まります。'

        document.getElementById('grid').innerHTML = list
          .map(function (c) {
            return (
              '<a class="case" href="./detective.html" data-mock-id="ALI_SEL_06">' +
              '<span class="cat">' +
              Mock.esc(c.cat) +
              '</span><span class="ttl">' +
              Mock.esc(c.title) +
              '</span><span class="meta">' +
              Mock.esc(c.meta) +
              '</span></a>'
            )
          })
          .join('')

        Mock.ready()
      })()
    </script>
  </body>
</html>
