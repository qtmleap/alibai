<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>AlibAI — 七　記録のせり上げ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./_effects.css" />
</head>
<body>
<div class="sheet one">
  <div class="motions">
  <div class="motion">
    <div class="mhead"><span class="mnm">七　記録のせり上げ</span><button class="replay" type="button">もう一度</button></div>
    <div class="stage">
      <div class="d-crawl">
        <div class="inner">
          <p>——事件の記録を読み上げます。</p>
          <p>午後七時十五分、商店街の古書店「青雨堂」で、店主の水野英治が店の奥で死亡しているのが見つかりました。外は夕方から激しい雨。</p>
        </div>
        <span class="veil"></span>
      </div>
    </div>
    <p class="mwhy">記録を下から流します。既存の <span class="t">briefing-crawl</span> と同じ作りで、移動距離は本文の高さから決まるので、長い記録ほど自然に長く流れます。下端は地に溶かして、切れ目を作らない。</p>
  </div>
  </div>
</div>
<script src="./_effects.js"></script>
</body>
