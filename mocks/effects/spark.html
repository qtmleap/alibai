    <p class="mwhy">離れた二つの証言が噛み合わないと分かった瞬間。二本の柱のあいだに線が引かれ、引き終わってから両端の目盛りが一度だけ伸びます。光らせず、繋ぐ。アリバイ表は縦に時が流れるので目盛りは横棒——伸ばすのは <code>pin-lift-x</code>、横のレールで使う <code>pin-lift</code> の向きだけ直交した片割れです。</p>
