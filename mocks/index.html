<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlibAI モック</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Roboto+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
        モックを見るための道具であって、モックそのものではない。
        だから凝らない——ただし地の色が違うと、暗い画面のモックの明度が
        正しく見えなくなるので、色だけはアプリと同じものを使う。
      */
      :root {
        --sumi: #141317;
        --sumi-2: #1a1820;
        --keisen: #302c39;
        --kinari: #e9e4d9;
        --nezumi: #8e8896;
        --nezumi-dim: #625d6c;
        --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
        --gothic: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
        --mono: "Roboto Mono", ui-monospace, monospace;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--sumi); color: var(--kinari);
        font-family: var(--gothic); font-size: 13px;
        display: grid; grid-template-columns: 236px 1fr;
        -webkit-font-smoothing: antialiased;
      }

      /* ---- 左の棚 ---- */
      .rail { border-right: 1px solid var(--keisen); overflow-y: auto; padding: 26px 0 30px; }
      .rail h1 {
        margin: 0 20px; font-family: var(--mincho); font-weight: 700;
        font-size: 17px; letter-spacing: 0.14em;
      }
      .rail .sub { margin: 6px 20px 0; font-size: 10px; color: var(--nezumi-dim); letter-spacing: 0.2em; }
      .rail .grp { margin: 26px 0 0; }
      .rail .grp > .label {
        display: block; margin: 0 20px; padding-bottom: 7px;
        border-bottom: 1px solid var(--keisen);
        font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.22em; color: var(--nezumi-dim);
      }
      .rail button {
        display: block; width: 100%; padding: 9px 20px; text-align: left;
        background: none; border: 0; border-bottom: 1px solid var(--keisen);
        color: var(--nezumi); font: inherit; font-size: 12.5px;
      }
      .rail button:hover { color: var(--kinari); }
      /* 選択は塗らずに、左端の一本で示す。 */
      .rail button.on { color: var(--kinari); box-shadow: inset 2px 0 0 var(--kinari); background: var(--sumi-2); }

      /* ---- 右の見台 ---- */
      .stage { display: grid; grid-template-rows: 46px 1fr; min-width: 0; }
      .bar {
        display: flex; align-items: center; justify-content: space-between; gap: 20px;
        padding: 0 22px; border-bottom: 1px solid var(--keisen);
      }
      .bar .path { font-family: var(--mono); font-size: 11px; color: var(--nezumi); }
      .bar .rgt { display: flex; align-items: center; gap: 18px; font-size: 11px; color: var(--nezumi-dim); }
      .bar .size { font-family: var(--mono); font-variant-numeric: tabular-nums; }
      .bar a { color: var(--nezumi); text-decoration: none; border-bottom: 1px solid var(--keisen); padding-bottom: 1px; }
      .bar a:hover { color: var(--kinari); }

      /* 実寸で描いてから縮める。幅を変えて描くと、モックが応答的に組み替わって
         「その幅での見え方」が分からなくなる。 */
      .view { position: relative; overflow: auto; padding: 24px; display: grid; place-items: start center; }
      /*
        外側は縮尺後の寸法を持つ。transform は見た目を変えるだけで場所は取らないので、
        これが無いと実寸ぶんの幅で並んで、縮めたはずの画面が右へはみ出す。
      */
      .paper { overflow: hidden; border: 1px solid var(--keisen); background: var(--sumi); }
      .paper iframe { display: block; border: 0; transform-origin: top left; }

      .empty { place-self: center; color: var(--nezumi-dim); font-size: 12px; letter-spacing: 0.1em; }
    </style>
  </head>
  <body>
    <nav class="rail">
      <h1>AlibAI</h1>
      <p class="sub">モック</p>
      <div id="list"></div>
    </nav>

    <main class="stage">
      <div class="bar">
        <span class="path" id="path">—</span>
        <span class="rgt">
          <span class="size" id="size"></span>
          <a id="raw" href="#" target="_blank" rel="noreferrer">原寸で開く</a>
        </span>
      </div>
      <div class="view" id="view">
        <p class="empty">左から画面を選んでください</p>
      </div>
    </main>

    <script type="module">
      // 端末ごとの実寸。モックはこの幅で組んであるので、見る側が勝手に変えない。
      const VIEWPORTS = {
        mobile: { w: 390, h: 844 },
        desktop: { w: 1440, h: 900 },
      }
      const fallback = { w: 1280, h: 800 }

      const list = document.getElementById('list')
      const view = document.getElementById('view')
      const pathLabel = document.getElementById('path')
      const sizeLabel = document.getElementById('size')
      const raw = document.getElementById('raw')

      const viewportFor = (path) => VIEWPORTS[path.split('/')[0]] ?? fallback

      const show = (path) => {
        const { w, h } = viewportFor(path)
        // 見台に収まるところまで縮める。拡大はしない——原寸より大きく見せると、
        // 字の大きさの判断が狂う。
        const scale = Math.min(1, (view.clientWidth - 48) / w, (view.clientHeight - 48) / h)

        view.innerHTML = ''
        const paper = document.createElement('div')
        paper.className = 'paper'
        paper.style.width = `${Math.round(w * scale)}px`
        paper.style.height = `${Math.round(h * scale)}px`

        // 中身は実寸のまま描かせ、左上を起点に縮める。
        const frame = document.createElement('iframe')
        frame.src = `/mocks/${path}`
        frame.width = w
        frame.height = h
        frame.style.transform = `scale(${scale})`
        paper.append(frame)
        view.append(paper)

        pathLabel.textContent = `mocks/${path}`
        sizeLabel.textContent = `${w}×${h}　${Math.round(scale * 100)}%`
        raw.href = `/mocks/${path}`
        location.hash = path
      }

      const select = (path) => {
        for (const button of list.querySelectorAll('button')) {
          button.classList.toggle('on', button.dataset.path === path)
        }
        show(path)
      }

      const paths = await fetch('/mocks/index.json').then((r) => r.json())

      // ディレクトリごとに束ねる。直下に置かれたものは「そのほか」に落とす。
      const groups = new Map()
      for (const path of paths) {
        const parts = path.split('/')
        const key = parts.length > 1 ? parts[0] : 'そのほか'
        groups.set(key, [...(groups.get(key) ?? []), path])
      }

      for (const [name, entries] of groups) {
        const box = document.createElement('div')
        box.className = 'grp'
        const label = document.createElement('span')
        label.className = 'label'
        label.textContent = name
        box.append(label)

        for (const path of entries) {
          const button = document.createElement('button')
          button.type = 'button'
          button.dataset.path = path
          button.textContent = path.split('/').pop().replace('.html', '')
          button.addEventListener('click', () => select(path))
          box.append(button)
        }
        list.append(box)
      }

      const initial = location.hash.slice(1)
      select(paths.includes(initial) ? initial : paths[0])

      // 窓の大きさが変わったら縮尺を取り直す。
      addEventListener('resize', () => {
        const current = location.hash.slice(1)
        if (current) {
          show(current)
        }
      })
    </script>
  </body>
</html>
