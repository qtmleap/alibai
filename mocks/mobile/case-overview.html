<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlibAI モバイル — 支度</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Roboto+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./_phone.css" />
    <link rel="stylesheet" href="../_motion.css" />
    <link rel="stylesheet" href="../_mock.css" />
    <style>
      .p-ov a { text-decoration: none; color: inherit; display: block; }
      /* 名簿の行は押せる。押せるものを div のままにしない。 */
      .cast button.r { background: none; border: 0; font: inherit; color: inherit; text-align: left; width: 100%; }

      /*
        押す物は端末の下端へ落とす。名簿の直後に置くと、人数や肩書きの行数で
        ボタンの高さが毎回変わり、親指の行き先が定まらない。
        .p-ov はもともと縦の flex なので、高さを持たせて余りを .foot の上へ送るだけでいい。
      */
      .p-ov { flex: 1; min-height: 0; }
      .foot { margin-top: auto; padding-bottom: 24px; display: flex; flex-direction: column; gap: 11px; }
    </style>
  </head>
  <body>
    <div class="phone screen-enter" data-mock-id="ALI_OVW_01">
      <div class="pad p-ov">
        <a class="label" href="./scenario-select.html" data-mock-id="ALI_OVW_02">← 事件を選ぶ</a>

        <h3 id="ttl" data-mock-id="ALI_OVW_03"></h3>

        <div data-mock-id="ALI_OVW_04">
          <div class="rail-empty">
            <span class="lb label t" id="from" style="left: 0"></span>
            <span class="lb label t" id="to" style="right: 0"></span>
            <span class="line"></span>
            <span class="end" style="left: 0"></span>
            <span class="end" style="right: 0"></span>
          </div>
          <div class="dim" id="railLead" style="font-size: 11px"></div>
        </div>

        <div>
          <div class="label">まず誰から話を聞くか</div>
          <div class="cast" id="cast" style="margin-top: 8px" data-mock-id="ALI_OVW_06"></div>
        </div>

        <!--
          調べられる場所。人の名簿とは見出しで分ける——同じ一手を使うとはいえ、
          「誰から聞くか」と「どこを見るか」は迷い方が違う。
        -->
        <div id="placeGrp" data-mock-id="ALI_OVW_11" hidden>
          <div class="label">どこを調べるか</div>
          <div class="cast" id="places" style="margin-top: 8px"></div>
        </div>

        <div class="foot">
          <a class="go" id="go" data-mock-id="ALI_OVW_09"></a>
          <a class="again" href="./briefing.html" data-mock-id="ALI_OVW_10">事件の記録をもう一度読む</a>
        </div>
      </div>
    </div>

    <script src="../_case.js"></script>
    <script src="../_mock.js"></script>
    <script>
      ;(function () {
        var C = Mock.case
        var pick = Mock.str('who', C.cast[0].key)

        document.getElementById('ttl').innerHTML = C.titleBreak
        document.getElementById('from').textContent = C.span.from
        document.getElementById('to').textContent = C.span.to
        document.getElementById('railLead').textContent = C.railLead

        /*
          名簿の一行。人物・遺体・場所を同じ組みで並べる。選ぶという一手は同じで、
          押した先ですることだけが違う。
        */
        var row = function (p, kind) {
          /*
            所見も死因も無い事件では、遺体の行は押せないまま。
            押せるのに何も出ない行を名簿に作らない。
          */
          var canPick = kind !== 'victim' || C.victim.investigable
          var on = pick === p.key
          var hue = 'var(--' + p.hue + Mock.lit + ')'
          // 右端の札。喋らない相手にだけ出して、聞き込みではないことを名簿の上で示す。
          var tag = kind === 'cast' ? '' : canPick ? '調べる' : '被害者'
          return (
            '<button class="r" type="button" data-mock-id="' +
            (kind === 'place' ? 'ALI_OVW_12' : 'ALI_OVW_07') +
            '" data-who="' +
            p.key +
            '"' +
            (canPick ? '' : ' disabled') +
            '><span class="face' +
            (kind === 'place' ? ' pl' : '') +
            (on ? ' on' : '') +
            '" style="color:' +
            hue +
            '; background:' +
            p.faceBg +
            '">' +
            p.face +
            '</span><span class="col"><span class="nm"' +
            (on ? ' style="color:' + hue + '"' : '') +
            '>' +
            Mock.esc(p.name) +
            '</span><span class="ps">' +
            Mock.esc(kind === 'cast' ? p.role + '。' + p.persona : p.blurb) +
            '</span></span>' +
            (tag === '' ? '' : '<span class="role">' + tag + '</span>') +
            '</button>'
          )
        }

        document.getElementById('cast').innerHTML = C.cast
          .map(function (p) {
            return row(p, 'cast')
          })
          .concat([row(C.victim, 'victim')])
          .join('')

        // 場所の無い事件では見出しごと出さない。空の見出しは「何か足りない」に見える。
        if (Mock.places.length > 0) {
          document.getElementById('placeGrp').hidden = false
          document.getElementById('places').innerHTML = Mock.places
            .map(function (p) {
              return row(p, 'place')
            })
            .join('')
        }

        var who = Mock.cast[pick]
        var go = document.getElementById('go')
        // 喋らない相手には「聞き込み」をしない。同じ一手でも、することが違う。
        go.textContent = who.name + (Mock.examines(pick) ? 'を調べる' : 'に聞き込みをする')
        go.href = './interrogation.html#turn=1&who=' + pick

        Array.prototype.forEach.call(document.querySelectorAll('[data-who]'), function (el) {
          el.addEventListener('click', function () {
            location.hash = 'who=' + el.dataset.who
            location.reload()
          })
        })

        Mock.ready()
      })()
    </script>
  </body>
</html>
