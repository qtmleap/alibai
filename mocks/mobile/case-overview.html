<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlibAI モバイル — 支度</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Roboto+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./_phone.css" />
  </head>
  <body>
  <div class="phone">
    <div class="pad p-ov">
      <h3>雨の古書店、<br>十九時八分のレシート</h3>

      <div>
        <div class="rail-empty">
          <span class="lb label t" style="left:0">18:20</span>
          <span class="lb label t" style="right:0">19:20</span>
          <span class="line"></span>
          <span class="end" style="left:0"></span>
          <span class="end" style="right:0"></span>
        </div>
        <div class="dim" style="font-size:11px">この一時間を、説明しきる</div>
      </div>

      <div>
        <div class="label">まず誰から話を聞くか</div>
        <div class="cast" style="margin-top:8px">
          <div class="r">
            <span class="face on" style="color:var(--asagi-t); background:#1f2a2a">牧</span>
            <span class="col"><span class="nm" style="color:var(--asagi-t)">牧野千尋</span><span class="ps">店員。生真面目で、話しはじめると止まらない</span></span>
          </div>
          <div class="r">
            <span class="face" style="color:var(--fuji-t); background:#221f2b">黒</span>
            <span class="col"><span class="nm">黒田征司</span><span class="ps">常連の収集家。初版本の商談に来ていた</span></span>
          </div>
          <div class="r">
            <span class="face" style="color:var(--suou-t); background:#271d22">瀬</span>
            <span class="col"><span class="nm">瀬名真琴</span><span class="ps">向かいの喫茶店主。雨脚を見ていた</span></span>
          </div>
          <div class="r">
            <span class="face" style="color:var(--karashi-t); background:#2a2418">水</span>
            <span class="col"><span class="nm">水野英治</span><span class="ps">青雨堂店主</span></span>
            <span class="role">被害者</span>
          </div>
        </div>
      </div>

      <div>
        <div class="label">手がかりの見え方</div>
        <div class="modes" style="margin-top:8px">
          <span>Easy</span><span class="on">Normal</span><span>Hard</span><span>No Hope</span>
        </div>
        <div class="dim" style="font-size:10.5px; margin-top:7px">場所と人物、それぞれの合計だけが見える</div>
      </div>

      <div class="go">牧野千尋に聞き込みをする</div>
      <div class="again">事件の記録をもう一度読む</div>
    </div>
  </div>
  </body>
</html>
