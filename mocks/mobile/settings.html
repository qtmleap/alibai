<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlibAI モバイル — 設定</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Roboto+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./_phone.css" />
    <link rel="stylesheet" href="../_motion.css" />
    <link rel="stylesheet" href="../_mock.css" />
    <style>
      .p-set a.label { text-decoration: none; display: block; }
      /* 役割は .grp の直の子と同じ間合いで積む。包む箱を挟むと二つが詰まる。 */
      #roles { display: flex; flex-direction: column; gap: 13px; }
    </style>
  </head>
  <body>
    <div class="phone screen-enter" data-mock-id="ALI_SET_01">
      <div class="pad p-set">
        <div data-mock-id="ALI_SET_03">
          <a class="label" href="./scenario-select.html" data-mock-id="ALI_SET_02">← 事件を選ぶ</a>
          <h3 style="margin-top: 16px">設定</h3>
          <p class="lead">この端末にだけ保存されます。サーバには残らず、あなたのプレイにだけ効きます。</p>
        </div>

        <div class="grp" data-mock-id="ALI_SET_04">
          <div class="label">使うモデル</div>
          <div id="roles"></div>
          <p class="fine" style="margin: 0" id="nomodels" data-mock-id="ALI_SET_08"></p>
        </div>

        <div class="grp" data-mock-id="ALI_SET_09">
          <div class="label">進行</div>
          <p class="fine" style="margin: 0">新しく始める事件から効きます。進行中のものは変わりません。</p>

          <div class="trio" data-mock-id="ALI_SET_10">
            <div class="fld">
              <span class="label">ターン数</span>
              <span class="num" id="n-turns"></span>
            </div>
            <div class="fld">
              <span class="label">1ターンの質問</span>
              <span class="num" id="n-asks">1</span>
            </div>
            <div class="fld">
              <span class="label">1話題の往復</span>
              <span class="num" id="n-depth">3</span>
            </div>
          </div>

          <p class="sum" style="margin: 0" id="sum" data-mock-id="ALI_SET_11"></p>
        </div>

        <!--
          判定役の振る舞いを一つずつ試すための区画。どれが効くかは遊んでみないと分からないので、
          入れた回と切った回を混ぜて遊べるようにここへ置く。決着がついたら区画ごと消える。
        -->
        <div class="grp" data-mock-id="ALI_SET_17">
          <div class="label">判定の調整</div>
          <p class="fine" style="margin: 0">判定役の振る舞いを一つずつ試せます。既定はすべてオフで、入れたものだけ判定の出方が変わります。</p>
          <div id="judge"></div>
        </div>

        <!-- 演出の好み。記録の画面に切り替えを置くと毎回そこで一拍止まるので、こちらへ寄せる。 -->
        <div class="grp" data-mock-id="ALI_SET_12">
          <div class="label">事件の記録</div>
          <div class="role">
            <div class="nm">見せ方</div>
            <div class="modes" id="brief" data-mock-id="ALI_SET_13"></div>
          </div>
          <div class="role">
            <div class="nm">打鍵音</div>
            <div class="ps" style="margin: 0">一段落ずつのときだけ鳴ります</div>
            <div class="modes" id="sound" data-mock-id="ALI_SET_14"></div>
          </div>
          <p class="fine" style="margin: 0" id="brieffine"></p>
        </div>

        <!-- 聞き込みの声。読み上げているあいだ次の行は出ないので、速さを決める値でもある。 -->
        <div class="grp" data-mock-id="ALI_SET_15">
          <div class="label">聞き込み</div>
          <div class="role">
            <div class="nm">読み上げ</div>
            <div class="ps" style="margin: 0">読み終わるまで次の行を待ちます</div>
            <div class="modes" id="voice" data-mock-id="ALI_SET_16"></div>
          </div>
          <p class="fine" style="margin: 0">読み上げないときは、これまで通り一定の間で流れます。</p>
        </div>
      </div>
    </div>

    <script src="../_case.js"></script>
    <script src="../_mock.js"></script>
    <script>
      ;(function () {
        // #unset=1 で「まだ何も選んでいない」状態。既定と、たまたま既定と同じものを
        // 選んだ状態とを、見た目でも分けられるかを確かめるための切り替え。
        var unset = Mock.str('unset', '0') === '1'

        /*
          互換サーバが返すモデルIDは「提供元,モデル」のカンマ区切り。欄を二つに割るのは、
          一覧が全提供元ぶん一列に並ぶと二十行を超えるため。並べる値はここで割ったもので、
          保存されるのは連結し直した一つの文字列。
        */
        var nomodels = Mock.str('nomodels', '0') === '1'
        var chosen = unset || nomodels ? null : 'claude-code,claude-opus-5'
        var roles = [
          {
            nm: '会話',
            ps: 'NPCの受け答えと、探偵が組み立てる質問',
            vendor: chosen && chosen.split(',')[0],
            model: chosen && chosen.split(',')[1],
          },
          { nm: '判定', ps: '証拠の開示と、推理の採点', vendor: null, model: null },
        ]

        document.getElementById('nomodels').textContent = nomodels
          ? 'モデルの一覧が空です。APIキーが未設定か、モデルサーバに繋がっていません。'
          : ''

        document.getElementById('roles').innerHTML = roles
          .map(function (r) {
            var vendor = r.vendor
              ? '<span class="sel" data-mock-id="ALI_SET_06"><span class="v">' + Mock.esc(r.vendor) + '</span><span class="ar">▼</span></span>'
              : '<span class="sel unset" data-mock-id="ALI_SET_06"><span class="v">既定のまま</span><span class="ar">▼</span></span>'
            // 提供元が決まるまでモデルは触れない。枠を地に沈めて、押せないことを枠で言う。
            var model = r.model
              ? '<span class="sel" data-mock-id="ALI_SET_07"><span class="v">' + Mock.esc(r.model) + '</span><span class="ar">▼</span></span>'
              : '<span class="sel locked" data-mock-id="ALI_SET_07"><span class="v">既定のまま</span><span class="ar">▼</span></span>'
            return (
              '<div class="role" data-mock-id="ALI_SET_05"><div><div class="nm">' +
              Mock.esc(r.nm) +
              '</div><div class="ps">' +
              Mock.esc(r.ps) +
              '</div></div><div class="pair"><div class="fld"><span class="label">提供元</span>' +
              vendor +
              '</div><div class="fld"><span class="label">モデル</span>' +
              model +
              '</div></div></div>'
            )
          })
          .join('')

        var turns = 5
        var asks = 1
        var depth = 3
        document.getElementById('n-turns').textContent = turns
        document.getElementById('sum').innerHTML =
          turns +
          'ターン × ' +
          asks +
          '問 ＝ <b>全部で' +
          turns * asks +
          '問</b>（上限20問）。<br>1話題ごとに、モデルを<b>' +
          (depth * 2 + 1) +
          '回</b>呼びます。'

        /*
         * 見せ方は二択、打鍵音は入切。音は打鍵のときしか鳴らないので、
         * せり上がるを選んでいるあいだはモデルの欄と同じ扱いで沈める。
         */
        var brief = Mock.str('brief', 'typewriter')
        var sound = Mock.str('sound', 'on')
        var pickable = brief === 'typewriter'

        var choices = function (el, items, current, live) {
          document.getElementById(el).innerHTML = items
            .map(function (i) {
              return (
                '<span class="' +
                (live && i.key === current ? 'on' : '') +
                '" style="' +
                (live ? '' : 'color:var(--nezumi-dim); border-bottom-color:var(--sumi-3)') +
                '" data-set="' +
                el +
                '=' +
                i.key +
                '">' +
                i.name +
                '</span>'
              )
            })
            .join('')
        }
        choices(
          'brief',
          [
            { key: 'typewriter', name: '一段落ずつ' },
            { key: 'crawl', name: 'せり上がる' },
          ],
          brief,
          true,
        )
        choices(
          'sound',
          [
            { key: 'on', name: '鳴らす' },
            { key: 'off', name: '鳴らさない' },
          ],
          sound,
          pickable,
        )
        choices(
          'voice',
          [
            { key: 'on', name: '読み上げる' },
            { key: 'off', name: '読み上げない' },
          ],
          Mock.str('voice', 'on'),
          true,
        )

        document.getElementById('brieffine').textContent = pickable
          ? '一段落ずつは、読む速さをあなたが握ります。'
          : 'せり上がるは速さが決まっているぶん、音は鳴りません。'

        /*
          判定の直しは四つとも入切だけ。名前と説明の出どころは db/judge-tuning.ts で、
          ここはその写し——増減したときは向こうを直してからここへ写す。

          狭い画面では名前・説明・入切を縦に積む。打鍵音の行と同じ組みで、
          説明が操作の直前に来るぶん、名前に貼り付けると一かたまりに見える。
        */
        var JUDGE = [
          { key: 'checkEvidenceIds', name: '証拠のIDを確かめる', note: '実在しない証拠や、すでに見つけた証拠を弾く' },
          {
            key: 'contradictionNeedsHistory',
            name: '矛盾の判定に前のやり取りを渡す',
            note: '前の発言と食い違っているかを、実際に読み比べて決める',
          },
          { key: 'fixedTemperature', name: '判定の揺れを抑える', note: '同じやり取りなら毎回同じ判定になるようにする' },
          { key: 'retryOnce', name: '判定が落ちたらやり直す', note: '一度だけやり直す。落ちた回は発見が丸ごと消えるため' },
        ]

        document.getElementById('judge').innerHTML = JUDGE.map(function (t) {
          return (
            '<div class="role" data-mock-id="ALI_SET_18">' +
            '<div class="nm">' +
            Mock.esc(t.name) +
            '</div><div class="ps" style="margin: 0">' +
            Mock.esc(t.note) +
            '</div><div class="modes" id="judge-' +
            t.key +
            '" data-mock-id="ALI_SET_19"></div></div>'
          )
        }).join('')

        JUDGE.forEach(function (t) {
          choices(
            'judge-' + t.key,
            [
              { key: 'on', name: '入れる' },
              { key: 'off', name: '入れない' },
            ],
            Mock.str(t.key, 'off'),
            true,
          )
        })

        Array.prototype.forEach.call(document.querySelectorAll('[data-set]'), function (el) {
          el.addEventListener('click', function () {
            var kv = el.dataset.set.split('=')
            // 判定の欄は id が judge- 付き。ハッシュへ書くときは接頭辞を外す。
            var name = kv[0].indexOf('judge-') === 0 ? kv[0].slice(6) : kv[0]
            var state = { brief: brief, sound: sound }
            JUDGE.forEach(function (t) {
              state[t.key] = Mock.str(t.key, 'off')
            })
            state[name] = kv[1]
            location.hash = Object.keys(state)
              .map(function (k) {
                return k + '=' + state[k]
              })
              .join('&')
            location.reload()
          })
        })

        Mock.ready()
      })()
    </script>
  </body>
</html>
