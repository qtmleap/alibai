<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlibAI モバイル — 設定</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Roboto+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./_phone.css" />
  </head>
  <body>
  <div class="phone">
    <div class="pad p-set">
      <div>
        <div class="label">← 事件を選ぶ</div>
        <h3 style="margin-top:16px">設定</h3>
        <p class="lead">この端末にだけ保存されます。サーバには残らず、あなたのプレイにだけ効きます。</p>
      </div>

      <div class="grp">
        <div class="label">使うモデル</div>

        <div class="role">
          <div>
            <div class="nm">会話</div>
            <div class="ps">NPCの受け答えと、探偵が組み立てる質問</div>
          </div>
          <div class="pair">
            <div class="fld">
              <span class="label">提供元</span>
              <span class="sel"><span class="v">Anthropic</span><span class="ar">▼</span></span>
            </div>
            <div class="fld">
              <span class="label">モデル</span>
              <span class="sel"><span class="v">Claude Sonnet 5</span><span class="ar">▼</span></span>
            </div>
          </div>
        </div>

        <div class="role">
          <div>
            <div class="nm">判定</div>
            <div class="ps">証拠の開示と、推理の採点</div>
          </div>
          <div class="pair">
            <div class="fld">
              <span class="label">提供元</span>
              <span class="sel unset"><span class="v">既定のまま</span><span class="ar">▼</span></span>
            </div>
            <div class="fld">
              <span class="label">モデル</span>
              <span class="sel locked"><span class="v">既定のまま</span><span class="ar">▼</span></span>
            </div>
          </div>
        </div>

        <p class="fine" style="margin:0">Google は APIキーが未設定のため選べません。</p>
      </div>

      <div class="grp">
        <div class="label">進行</div>
        <p class="fine" style="margin:0">新しく始める事件から効きます。進行中のものは変わりません。</p>

        <div class="trio">
          <div class="fld">
            <span class="label">ターン数</span>
            <span class="num">5</span>
          </div>
          <div class="fld">
            <span class="label">1ターンの質問</span>
            <span class="num">1</span>
          </div>
          <div class="fld">
            <span class="label">1話題の往復</span>
            <span class="num">3</span>
          </div>
        </div>

        <p class="sum" style="margin:0">
          5ターン × 1問 ＝ <b>全部で5問</b>（上限20問）。<br>
          1話題ごとに、モデルを<b>7回</b>呼びます。
        </p>
      </div>
    </div>
  </div>
  </body>
</html>
