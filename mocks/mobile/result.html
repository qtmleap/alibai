<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlibAI モバイル — 結果</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Roboto+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./_phone.css" />
  </head>
  <body>
  <div class="phone">
    <div class="pad p-res">
      <div class="verdict">事件解決</div>

      <div class="label" style="margin-top:26px">判定</div>
      <div class="rows" style="margin-top:6px">
        <div class="r"><span class="muted">犯人</span><span>牧野千尋　<span style="color:var(--byakuroku)">正解</span></span></div>
        <div class="r"><span class="muted">殺害方法</span><span style="color:var(--byakuroku)">正解</span></div>
        <div class="r"><span class="muted">動機</span><span class="muted">惜しい</span></div>
      </div>

      <div class="label" style="margin-top:22px">記録</div>
      <div class="rows" style="margin-top:6px">
        <div class="r"><span class="muted">解決タイム</span><span class="v">08:41</span></div>
        <div class="r"><span class="muted">質問回数</span><span>9回</span></div>
        <div class="r"><span class="muted">発見した証拠</span><span>6個</span></div>
      </div>

      <div class="label" style="margin-top:22px">真相</div>
      <div class="tl" style="margin-top:6px">
        <div class="r"><span class="at">18:28</span><span class="muted">黒田が水野に、記録に残さない現金取引を持ちかける</span></div>
        <div class="r"><span class="at">18:37</span><span class="muted">水野がすり替えに気づき、牧野を問い詰める</span></div>
        <div class="r"><span class="at">18:50</span><span>牧野が店の奥で水野を襲う</span></div>
        <div class="r"><span class="at">19:08</span><span class="muted">牧野が郵便窓口で小包を発送する</span></div>
      </div>
    </div>
  </div>
  </body>
</html>
