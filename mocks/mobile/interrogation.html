<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlibAI モバイル — 聞き込み</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Roboto+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./_phone.css" />
  </head>
  <body>
  <div class="phone">
      <div class="int-head hair">
        <div class="row1">
          <span class="ttl">←　概要に戻る</span>
          <span style="flex:none">4/12　<span class="t">08:41</span></span>
        </div>
        <div class="nm" style="color:var(--asagi-t)">牧野千尋</div>
        <div class="pers">生真面目で、話しはじめると止まらない</div>
      </div>

      <div class="rail hair">
        <span class="cap label t">18:20</span><span class="cap2 label t">19:20</span>
        <span class="line"></span>
        <span class="pin hollow" style="left:14%; background:var(--fuji)"></span>
        <span class="pin" style="left:34%; background:var(--fuji)"></span>
        <span class="pin" style="left:41%; background:var(--asagi)"></span>
        <span class="pin hollow" style="left:56%; background:var(--suou)"></span>
        <span class="pin" style="left:76%; background:var(--asagi)"></span>
        <span class="now" style="left:76%"></span>
      </div>

      <div class="log">
        <div class="turn me">
          <span class="who">探偵</span>
          <p class="txt">郵便局に行った時刻を、もう一度</p>
        </div>
        <div class="turn" style="border-left-color:var(--asagi)">
          <span class="who" style="color:var(--asagi-t)">牧野千尋</span>
          <p class="txt">午後六時三十五分には店を出ています。発送があったので。</p>
          <p class="txt">窓口の受付は<span style="color:var(--asagi-t)">午後七時八分</span>でした。レシートも残っています。</p>
          <p class="txt">……三十分以上かかる道のりでしたけど。</p>
          <p class="txt">雨でしたから。<span class="beat">▼</span></p>
        </div>

        <div class="hint">
          <span class="head">訊けそうなこと<span>▲</span></span>
          <span class="q">レシートを見せてもらえますか</span>
          <span class="q">黒田さんとは話しましたか</span>
        </div>
      </div>

      <div class="int-foot" style="border-top:1px solid var(--keisen)">
        <div class="askbar">
          <span class="box">何について訊く？</span>
          <span class="btn">訊く</span>
        </div>
      </div>
  </div>
  </body>
</html>
