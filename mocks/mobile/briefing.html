<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlibAI モバイル — 事件の記録</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Roboto+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./_phone.css" />
    <link rel="stylesheet" href="../_motion.css" />
    <link rel="stylesheet" href="../_mock.css" />
    <style>
      /* 読み飛ばしは端末の下端へ落とす。本文に重ねると、最後の一行の上に字が乗る。 */
      .skip {
        margin-top: auto;
        padding-bottom: 26px;
        text-align: center;
        font-size: 11.5px;
        color: var(--nezumi-dim);
        text-decoration: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="phone screen-enter" data-mock-id="ALI_BRF_01">
      <div class="pad p-brief">
        <div class="label" id="no" data-mock-id="ALI_BRF_02"></div>
        <div class="crawl" id="crawl" style="margin-top: 26px" data-mock-id="ALI_BRF_03"></div>
      </div>
      <div class="fade"></div>
      <a class="skip" href="./case-overview.html" data-mock-id="ALI_BRF_04">タップで読み飛ばす</a>
    </div>

    <script src="../_case.js"></script>
    <script src="../_mock.js"></script>
    <script>
      ;(function () {
        var C = Mock.case
        document.getElementById('no').textContent = '記録　' + C.no

        var crawl = document.getElementById('crawl')
        var body = C.brief
          .map(function (p) {
            return '<p>' + p + '</p>'
          })
          .join('')

        /*
          記録の見せ方は二通り。既定は 六 タイプ送りで、読む速さをプレイヤーが握る。
          #brief=crawl にすると 七 記録のせり上げ——全文が下から流れる、映画の導入。
          実装も同じ二択を設定で切り替える（src/client/lib/briefing-mode.ts）。
        */
        if (Mock.params.brief === 'crawl') {
          crawl.innerHTML = body
          crawl.classList.add('briefing-crawl')
          /*
            尺は実装だと本文の長さから決まる。ここは静止画としても見る枚なので、
            流れ切って空の画面が残らないよう、長めに取って途中で写るようにしてある。
          */
          crawl.style.animationDuration = '60s'
        } else {
          Mock.readOut(crawl, body, { scroller: document.querySelector('.p-brief') })
        }

        Mock.ready()
      })()
    </script>
  </body>
</html>
