      <div class="crawl" style="margin-top:26px">
        <p>——事件の記録を読み上げます。</p>
        <p>午後七時十五分、商店街の古書店「青雨堂」で、店主の水野英治が店の奥で死亡しているのが見つかりました。外は夕方から激しい雨。閉店時刻は午後六時半でしたが、店内には高価な初版本の商談があり、何人かが遅くまで出入りしていました。</p>
        <p>事件に関わるのは三人です。店員の牧野千尋、常連の収集家・黒田征司、向かいの喫茶店主・瀬名真琴。</p>
      </div>
    </div>
    <div class="fade"></div>
