<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlibAI モバイル — 告発</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Roboto+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./_phone.css" />
  </head>
  <body>
  <div class="phone">
    <div class="pad p-acc">
      <div class="label">← 概要に戻る</div>
      <h3>犯人を指し示す</h3>
      <p class="lead">誰が、どうやって、なぜ。</p>

      <div class="rail-big">
        <div class="lane" style="top:12px">
          <span class="who" style="color:var(--asagi-t)">牧野</span>
          <span class="seg" style="left:0; width:62%; background:var(--asagi)"></span>
          <span class="seg gap" style="left:62%; width:38%; background:var(--asagi)"></span>
        </div>
        <div class="lane" style="top:44px">
          <span class="who" style="color:var(--fuji-t)">黒田</span>
          <span class="seg" style="left:0; width:28%; background:var(--fuji)"></span>
          <span class="seg gap" style="left:28%; width:22%; background:var(--fuji)"></span>
        </div>
        <div class="lane" style="top:76px">
          <span class="who" style="color:var(--suou-t)">瀬名</span>
          <span class="seg gap" style="left:0; width:72%; background:var(--suou)"></span>
          <span class="seg" style="left:88%; width:12%; background:var(--suou)"></span>
        </div>
        <div class="axis">
          <span class="t label">18:20</span><span class="t label">18:50</span><span class="t label">19:20</span>
        </div>
      </div>

      <div class="label">犯人</div>
      <div class="pick" style="margin-top:6px">
        <div class="r on"><span class="dot" style="background:var(--shu)"></span>牧野千尋</div>
        <div class="r muted"><span class="dot" style="background:var(--fuji)"></span>黒田征司</div>
        <div class="r muted"><span class="dot" style="background:var(--suou)"></span>瀬名真琴</div>
      </div>

      <div class="field">
        <span class="label">殺害方法</span>
        <div class="box">どうやって殺したのか</div>
      </div>

      <div class="field">
        <span class="label">動機</span>
        <div class="box">なぜ殺したのか</div>
      </div>

      <div class="seal">この推理を提出する</div>
    </div>
  </div>
  </body>
</html>
