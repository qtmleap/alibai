---
extends:
  - "@commitlint/config-conventional"
rules:
  header-max-length:
    - 2
    - always
    - 128
  # ヘッダーを128にした以上、本文と footer だけ既定の100で止める理由が無い。
  body-max-line-length:
    - 2
    - always
    - 128
  footer-max-line-length:
    - 2
    - always
    - 128
  type-enum:
    - 2
    - always
    - - build
      - ui
      - ci
      - docs
      - feat
      - fix
      - perf
      - refactor
      - revert
      - format
      - test
      - chore
