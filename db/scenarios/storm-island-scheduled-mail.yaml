meta:
  title: 船の来ない青凪荘
  synopsis: "午後十時二分、沖合の研修施設「青凪荘」の執務室で、奨学財団理事の榊原宗一が死亡しているのが見つかりました。午後八時から暴風で船便が全て欠航し、島に残ったのは榊原を含め五人だけです。"
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 18
  tags: [離島, 嵐, 予定送信, 死亡時刻]
victim:
  name: 榊原宗一
  introduction: 奨学財団理事
  foundAt: 22:02
  foundIn: 執務室
  causeOfDeath: 事件性のある外傷による死亡
  findings:
    - id: victim-state
      statement: 榊原宗一は執務室で倒れており、その場で死亡が確認されている。
    - id: victim-motive-material
      statement: 遺体のそばには「相沢の小口支出重複一覧」に関わる資料が残されている。
briefing: |-
  ——事件の記録を読み上げます。

  沖合の小島に建つ研修施設「青凪荘」は、財団が主催する合宿や講習会に使われています。普段は本土から船で職員や参加者が渡り、数日間を島で過ごします。その日は研修日程の最終盤で、参加者の多くはすでに帰り、翌朝の撤収を担当する関係者だけが残っていました。

  奨学財団理事の榊原宗一は、研修事業を長く担当してきた人物です。講師の選定から予算の承認まで幅広く関わり、その夜も執務室で書類の確認を続けていました。

  榊原宗一は若者の学びを支えることに熱心な財団理事で、奨学生から感謝されることの多い人物でした。審査や会計には厳格で近寄りがたい面もありましたが、財団内では人望のある古参として知られていました。

  午後八時から暴風が強まり、島と本土を結ぶ船便はすべて欠航しました。桟橋も使用できず、新たに島へ渡ることも、島から出ることもできません。残った者たちは朝まで青凪荘で過ごすことになります。

  午後十時二分、執務室で榊原宗一が死亡しているのが見つかりました。その夜に島に残っていた関係者は、秘書の相沢奈緒、会計担当の御影崇、外部講師の羽鳥栞、施設管理の堀江充です。

  暴風に閉ざされた研修島で、日程終了後に何が起きたのか。四人から榊原とのやり取りと、その夜の出来事を聞いてください。
