solution:
  culprit: yabuki
  summary: 犯人は矢吹梓。保存記録室のアクセス履歴は「誰が扉を通ったか」ではなく「職員証で解錠した操作」だけを記録する。19時50分から20時22分まで扉は設備点検のため開放されており、矢吹は20時ごろ三田村からそのことを直接聞いていた。矢吹は20時09分ごろ職員証を使わず記録室へ入り、20時12分ごろ磯崎を襲った。20時16分には木瀬が記録室側の廊下から戻る矢吹を目撃している。磯崎は矢吹による不適切な裁判記録修正を発見し、翌朝監督部署へ報告する予定だった。解錠履歴の欠如を入室不可能の証明にすり替えたことがアリバイ工作の核心である。
  method: 点検中で扉が開放されている時間に職員証を使わず保存記録室へ入り、解錠履歴が残らないことを利用して不在を装った
  motive: 不適切な裁判記録修正を磯崎が翌朝監督部署へ報告する予定で、処分を受けることを恐れたため
  requiredFacts: [access-log-unlock-only, door-remained-open-2022, mitamura-told-yabuki-open, yabuki-entered-unlogged, kise-saw-yabuki-return-2016, report-next-morning, yabuki-killed-isozaki]
  secretKeywords:
    - 犯人は矢吹
    - 矢吹が犯人
    - 矢吹が磯崎を襲
    - 私が磯崎を襲
    - 解錠履歴をアリバイに
quality:
  expectedQuestionCount:
    min: 12
    max: 24
  requiredEvidence:
    min: 3
  redHerrings: [mitamura-skipped-check, kise-read-private-file]
  notes: 「ログがない＝通過していない」という前提を崩す密室型。仕様を知るだけでなく、矢吹本人が扉の開放を事前に知っていたことと廊下目撃を合わせて意図性を確定する。
