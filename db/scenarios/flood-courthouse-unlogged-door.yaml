schemaVersion: 1
id: flood-courthouse-unlogged-door
meta:
  title: 水没寸前の裁判所、資料棟の夜
  synopsis: "午後八時三十五分、河川氾濫により周辺道路が閉鎖された旧南央裁判所の資料棟で、主任記録官の磯崎章が死亡しているのが見つかりました。資料棟に残っていたのは書記官の矢吹梓、設備担当の三田村悟、警備員の木瀬亮の三人だけです。"
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 15
  tags: [裁判所, 洪水, 電子錠, 密室]
victim:
  name: 磯崎章
  introduction: 旧南央裁判所主任記録官
briefing: |-
  ——事件の記録を読み上げます。

  旧南央裁判所の資料棟には、長年にわたる裁判記録や行政文書が保管されています。新庁舎への移転後も、整理が終わっていない資料を扱うため一部の職員が出入りしており、その夜も閉庁後の確認作業が続いていました。

  主任記録官の磯崎章は、古い記録の移管と保存を取りまとめる責任者です。資料の所在や閲覧手続きに厳しく、移転作業の最終確認にも自ら立ち会っていました。

  磯崎章は几帳面で、記録の抜けを何より嫌う主任記録官として評判でした。融通が利かないと感じる職員もいましたが、仕事の責任を部下だけに負わせない実直さがあり、資料棟では頼られる上司でもありました。

  夕方から降り続いた大雨で近くの河川が増水し、周辺道路は相次いで閉鎖されました。やがて資料棟は外部から近づけない状態となり、中に残った職員たちは天候の回復を待つことになります。

  午後八時三十五分、資料棟の保存記録室で磯崎章が死亡しているのが見つかりました。館内にいた関係者は、書記官の矢吹梓、設備担当の三田村悟、警備員の木瀬亮の三人です。

  水に囲まれ始めた古い裁判所で、閉庁後に何が起きていたのか。三人から磯崎と最後に接した時間や、その夜の作業について話を聞いてください。
