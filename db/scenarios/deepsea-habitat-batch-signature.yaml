schemaVersion: 1
id: deepsea-habitat-batch-signature
meta:
  title: 深海居住区、十二分間の署名
  synopsis: 荒天で支援船との接続が切れた海底居住実験区で主任研究者が死亡した。生命維持担当は「二分おきの点検記録に自分の署名がある」と主張する。しかし、その署名は各時刻に入力されたものなのか。記録の時刻と操作の時刻を分けて考えろ。
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 18
  tags: [海底基地, 荒天, 点検記録, 時刻]
briefing: |-
  ——事件の記録を読み上げます。

  午前零時二十二分、海底居住実験区「アビス3」の資料室で、主任研究者の篠宮亮が死亡しているのが見つかりました。海上は暴風で、午後十一時四十分に支援船との昇降カプセル接続が解除されて以降、外部との往来はありません。

  区画内にいたのは、生命維持担当の鷺沢怜、海洋地質学者の鳴海俊、通信担当の小日向茜、機械整備担当の土岐誠の四人です。鷺沢は「零時から零時十二分まで制御室で生命維持系を二分おきに点検していた」と話し、点検画面には00時00分から12分まで二分おきの各行に鷺沢の署名が残っています。

  区画の外は海底です。点検記録の一行一行が、本当にその瞬間の在席を意味するのか確かめてください。
floorPlan: null
facts:
  - id: sagisawa-life-support
    statement: 鷺沢怜はアビス3の生命維持系を担当する技術者である
    kind: other
  - id: narumi-geologist
    statement: 鳴海俊は海底地層の解析を担当する研究者である
    kind: other
  - id: kohinata-comms
    statement: 小日向茜は支援船との通信と記録保全を担当している
    kind: other
  - id: toki-mechanic
    statement: 土岐誠は昇降カプセルと区画設備の機械整備を担当している
    kind: other
  - id: sagisawa-falsified-tests
    statement: 鷺沢怜は交換を先送りした生命維持部品を正常として点検記録に記載していた
    kind: motive
    secret: true
  - id: shinomiya-found-falsification
    statement: 篠宮亮は事件当日、鷺沢怜の点検記録と実際の部品状態が一致しないことに気づいた
    kind: motive
    secret: true
  - id: shinomiya-planned-report
    statement: 篠宮亮は帰還後に鷺沢怜を当直から外し、点検記録の改ざんを調査委員会へ提出する予定だった
    kind: motive
    secret: true
  - id: readings-automatic
    statement: 生命維持点検画面の00時00分から00時12分の数値はセンサーから二分おきに自動記録された
    kind: physical
  - id: signatures-batchable
    statement: 点検画面では過去の複数行を選択し、一度の確認操作でまとめて担当者署名を付けることができる
    kind: physical
  - id: sagisawa-left-control
    statement: 00時01分ごろ、鷺沢怜は制御室を離れた
    kind: truth
    secret: true
  - id: kohinata-saw-sagisawa
    statement: 00時05分ごろ、小日向茜は資料室へ続く中央通路で鷺沢怜とすれ違った
    kind: observation
  - id: sagisawa-killed-shinomiya
    statement: 00時08分ごろ、鷺沢怜は資料室で篠宮亮を襲い死亡させた
    kind: truth
    secret: true
  - id: sagisawa-returned-control
    statement: 00時14分ごろ、鷺沢怜は制御室へ戻った
    kind: truth
    secret: true
  - id: sagisawa-batch-signed
    statement: 00時16分、鷺沢怜は00時00分から00時12分までの七行を一度に選択して担当者署名を付けた
    kind: physical
    secret: true
  - id: one-signature-transaction
    statement: 00時00分から00時12分までの七つの署名は、同じ確認処理番号で00時16分に一括登録された
    kind: physical
  - id: narumi-hid-sample
    statement: 鳴海俊は共同研究規約に反して希少な地質試料を個人研究用に取り置いていた
    kind: other
    secret: true
  - id: kohinata-deleted-message
    statement: 小日向茜は自分の通信手順ミスを隠すため、支援船との一件のやり取りを端末上から削除していた
    kind: other
    secret: true
  - id: toki-bypassed-maintenance
    statement: 土岐誠は点検期限を過ぎた昇降機構を手順外の応急処置で使い続けていた
    kind: other
    secret: true
  - id: body-found
    statement: 00時22分、鳴海俊が資料室で篠宮亮の死を発見した
    kind: observation

timeline:
  - id: readings-start
    at: "00:00"
    participants: [sagisawa]
    facts: [readings-automatic, signatures-batchable]
    description: 生命維持点検画面が二分間隔のセンサー値を自動記録し始める。
  - id: sagisawa-leaves
    at: "00:01"
    participants: [sagisawa]
    facts: [sagisawa-left-control]
    description: 鷺沢が制御室を離れる。
  - id: passage-sighting
    at: "00:05"
    participants: [sagisawa, kohinata]
    facts: [kohinata-saw-sagisawa]
    description: 小日向が中央通路で鷺沢とすれ違う。
  - id: shinomiya-death
    at: "00:08"
    participants: [sagisawa]
    facts: [sagisawa-killed-shinomiya]
    description: 鷺沢が資料室で篠宮を襲い、篠宮は死亡する。
  - id: sagisawa-return
    at: "00:14"
    participants: [sagisawa]
    facts: [sagisawa-returned-control]
    description: 鷺沢が制御室へ戻る。
  - id: batch-sign
    at: "00:16"
    participants: [sagisawa]
    facts: [sagisawa-batch-signed, one-signature-transaction]
    description: 鷺沢が00時00分から00時12分までの点検行をまとめて確認し、一括で署名を付ける。
  - id: discovery
    at: "00:22"
    participants: [narumi, sagisawa, kohinata, toki]
    facts: [body-found]
    description: 鳴海が資料室で篠宮の死を発見する。
characters:
  - id: sagisawa
    name: 鷺沢怜
    role: suspect
    personality: 数字と手順を盾にする生命維持技術者。異常時でも声を荒らげないが、自分の整備判断を否定されると頑なになる。点検画面に署名が並んでいることを強調する。
    goals:
      - 点検記録の改ざんを隠したい
      - 七行の署名を、二分おきに制御室で操作した証拠として通したい
    knowledge: [sagisawa-life-support, readings-automatic, signatures-batchable, one-signature-transaction, body-found]
    secrets:
      - fact: sagisawa-falsified-tests
        disclosure: pressured
      - fact: shinomiya-found-falsification
        disclosure: pressured
      - fact: shinomiya-planned-report
        disclosure: pressured
      - fact: sagisawa-left-control
        disclosure: never
      - fact: sagisawa-killed-shinomiya
        disclosure: never
      - fact: sagisawa-returned-control
        disclosure: never
      - fact: sagisawa-batch-signed
        disclosure: pressured
    lies:
      - id: sagisawa-control-alibi
        about: sagisawa-left-control
        claim: 00時から00時12分まで制御室を離れていません。二分おきの七行すべてに私の署名があるでしょう
        strategy: maintain-until-contradicted
      - id: sagisawa-each-signature
        about: sagisawa-batch-signed
        claim: 各行の署名は、その時刻に一件ずつ確認して付けたものです。後からまとめて付けたものではありません
        strategy: maintain-until-contradicted
    memories:
      - id: committee-threat
        about: shinomiya-planned-report
        detail: 篠宮から帰還したら当直を外し、記録を委員会に出すと言われたことが頭から離れない。
    relationships:
      - character: toki
        relation: 設備担当の同僚
        attitude: 現場の応急処置に頼りすぎる点は信用していない
  - id: narumi
    name: 鳴海俊
    role: suspect
    personality: 好奇心旺盛で研究成果への執着が強い地質学者。規約違反の試料取り置きを知られたくないため試料庫の話を避ける。
    goals:
      - 個人研究用に試料を取り置いたことを隠したい
      - 篠宮との研究配分の対立を殺意と誤解されたくない
    knowledge: [narumi-geologist, body-found]
    secrets:
      - fact: narumi-hid-sample
        disclosure: pressured
    lies:
      - id: narumi-no-private-sample
        about: narumi-hid-sample
        claim: 共同試料を個人的に取り置いたことはありません
        strategy: maintain-until-contradicted
    memories:
      - id: batch-screen
        about: sagisawa-batch-signed
        detail: 発見前に制御室の前を通ったとき、鷺沢が点検画面で何行もまとめて選択しているように見えた。
    relationships: []
  - id: kohinata
    name: 小日向茜
    role: witness
    personality: 時刻と通信記録に几帳面な担当者。自分の手順ミスを消したことには後ろめたさがあるが、中央通路で見た人物と時計表示は正確に覚えている。
    goals:
      - 支援船との通信一件を削除したことを隠したい
      - 00時05分の鷺沢の目撃を正確に伝えたい
    knowledge: [kohinata-comms, kohinata-saw-sagisawa, signatures-batchable, body-found]
    secrets:
      - fact: kohinata-deleted-message
        disclosure: pressured
    lies:
      - id: kohinata-no-deletion
        about: kohinata-deleted-message
        claim: 通信記録は一件も消していません
        strategy: maintain-until-contradicted
    memories:
      - id: saw-sagisawa
        about: kohinata-saw-sagisawa
        detail: 00時05分を示す通信卓の時計を確認した直後、資料室側から来た鷺沢と中央通路ですれ違った。
    relationships: []
  - id: toki
    name: 土岐誠
    role: suspect
    personality: 経験則を重んじる機械整備担当。期限切れ設備への応急処置を隠すが、点検システムの画面仕様は保守教育で知っている。
    goals:
      - 昇降機構を手順外で使い続けていたことを隠したい
      - 点検画面が後から一括署名できる仕様は正確に説明する
    knowledge: [toki-mechanic, signatures-batchable, body-found]
    secrets:
      - fact: toki-bypassed-maintenance
        disclosure: pressured
    lies:
      - id: toki-maintenance-current
        about: toki-bypassed-maintenance
        claim: 昇降機構の点検期限は守っており、手順外の応急処置はしていません
        strategy: maintain-until-contradicted
    memories:
      - id: batch-training
        about: signatures-batchable
        detail: 忙しい当直向けに複数行をまとめて確認署名できる機能を、以前の保守講習で実演したことがある。
    relationships: []
revelations:
  - id: signatures-not-contemporaneous
    title: 七つの署名は七回の操作ではない
    text: 点検数値は自動記録され、担当者署名は後から複数行へ一括で付けられる。七行に同じ名前があっても、七回その時刻に操作した証明にはならない。
    category: alibi
    subject: { type: character, id: sagisawa }
    sources:
      - type: character
        id: toki
        revealCondition: 土岐に点検画面の署名機能を尋ね、過去の複数行へ一括署名できることを確認した。
        requires:
          revelations: []
          evidences: [signature-transaction]
      - type: character
        id: kohinata
        revealCondition: 小日向に点検数値の記録と人の確認操作が同じ時刻に行われるのか尋ね、二つを切り分けた。
        requires:
          revelations: []
          evidences: [signature-transaction]
    relatedFacts: [readings-automatic, signatures-batchable, sagisawa-batch-signed, one-signature-transaction]
  - id: sagisawa-motive
    title: 帰還後に外される当直
    text: 篠宮は鷺沢の点検記録改ざんを突き止め、帰還後に鷺沢を当直から外して調査委員会へ記録を提出する予定だった。
    category: motive
    subject: { type: character, id: sagisawa }
    sources:
      - type: character
        id: toki
        revealCondition: 土岐に篠宮が確認していた部品交換記録を尋ね、鷺沢の点検記録との不一致へ話をつなげた。
        requires:
          revelations: []
          evidences: [maintenance-difference]
      - type: character
        id: sagisawa
        revealCondition: 鷺沢に交換を先送りした部品と篠宮の帰還後の対応を追及し、当直から外される恐れを明確にした。
        requires:
          revelations: [signatures-not-contemporaneous]
          evidences: [maintenance-difference]
    relatedFacts: [sagisawa-falsified-tests, shinomiya-found-falsification, shinomiya-planned-report]
evidences:
  - id: signature-transaction
    label: 点検画面の確認処理番号
    description: 00時00分から00時12分までの七つの署名は同じ処理番号を持ち、00時16分に一度の操作で登録されている。
    reveal:
      mode: conversation
      condition: 鷺沢、土岐、小日向のいずれかに点検署名が各時刻に個別入力されたのか尋ねたら開示する。
    sources:
      - { type: character, id: sagisawa }
      - { type: character, id: toki }
      - { type: character, id: kohinata }
    supports: [readings-automatic, signatures-batchable, sagisawa-batch-signed, one-signature-transaction]
    contradicts: ["lie:sagisawa-control-alibi", "lie:sagisawa-each-signature"]
  - id: passage-sighting
    label: 零時五分の中央通路目撃
    description: 小日向は00時05分ごろ、中央通路で鷺沢とすれ違っている。
    reveal:
      mode: conversation
      condition: 小日向に00時ごろの通路で誰と会ったか、時刻の根拠も含めて尋ねたら開示する。
    sources:
      - { type: character, id: kohinata }
    supports: [kohinata-saw-sagisawa]
    contradicts: ["lie:sagisawa-control-alibi"]
  - id: maintenance-difference
    label: 部品交換記録と実機番号の不一致
    description: 鷺沢の点検表では交換済みの部品が、実際には古い個体番号のまま残っている。篠宮の調査メモには帰還後の報告予定がある。
    reveal:
      mode: conversation
      condition: 鷺沢か土岐に篠宮が事件直前に照合していた部品番号と点検表について尋ねたら開示する。
    sources:
      - { type: character, id: sagisawa }
      - { type: character, id: toki }
    supports: [sagisawa-falsified-tests, shinomiya-found-falsification, shinomiya-planned-report]
    contradicts: []
  - id: narumi-sample
    label: 鳴海が隠した地質試料
    description: 共同保管対象の試料が鳴海の個人ケースから見つかるが、資料室の事件とは独立した規約違反である。
    reveal:
      mode: conversation
      condition: 鳴海に共同試料を個人用に取り置いていないか尋ね、否定を検証したら開示する。
    sources:
      - { type: character, id: narumi }
    supports: [narumi-hid-sample]
    contradicts: ["lie:narumi-no-private-sample"]
  - id: comms-deletion
    label: 小日向の通信記録削除履歴
    description: 小日向の端末から一件の通信記録が削除されているが、事件とは無関係の手順ミスに関するものだった。
    reveal:
      mode: conversation
      condition: 小日向に通信記録を消していないか確認し、保存履歴を検証したら開示する。
    sources:
      - { type: character, id: kohinata }
    supports: [kohinata-deleted-message]
    contradicts: ["lie:kohinata-no-deletion"]
  - id: lift-maintenance
    label: 土岐の期限切れ整備票
    description: 土岐が期限切れの昇降機構を応急処置で使っていたことが分かるが、支援船との接続は事件前に解除されている。
    reveal:
      mode: conversation
      condition: 土岐に昇降機構の点検期限と応急処置について尋ね、説明を検証したら開示する。
    sources:
      - { type: character, id: toki }
    supports: [toki-bypassed-maintenance]
    contradicts: ["lie:toki-maintenance-current"]
solution:
  culprit: sagisawa
  summary: 鷺沢は交換を先送りした生命維持部品を正常として記録していたことを篠宮に見抜かれ、帰還後に当直を外され調査委員会へ提出される予定だった。鷺沢は00時01分ごろ制御室を離れ、00時05分には小日向が中央通路で鷺沢を目撃している。資料室で篠宮を襲い、00時14分ごろ制御室へ戻った後、00時16分に00時00分から12分までの七行へ一括で署名した。各行の数値はセンサーが自動記録したもので、署名も同じ確認処理番号で後からまとめて付けられていた。
  method: 自動記録された点検行へ後から一括署名し、それを二分おきに制御室で操作していた証拠に見せかけた
  motive: 点検記録の改ざんが発覚し、帰還後に当直を外されて調査委員会へ報告されることを恐れたため
  requiredFacts: [sagisawa-falsified-tests, shinomiya-planned-report, readings-automatic, signatures-batchable, sagisawa-left-control, kohinata-saw-sagisawa, sagisawa-killed-shinomiya, sagisawa-batch-signed, one-signature-transaction]
  secretKeywords:
    - 犯人は鷺沢
    - 鷺沢が犯人
    - 鷺沢が篠宮を襲
    - 私が篠宮を襲
    - 一括署名でアリバイを偽装
quality:
  expectedQuestionCount:
    min: 13
    max: 26
  requiredEvidence:
    min: 3
  redHerrings: [narumi-hid-sample, kohinata-deleted-message, toki-bypassed-maintenance]
  notes: 点検表の記録時刻と署名操作時刻を分けることが核心。七行の署名を同一処理番号と一括署名仕様で崩し、小日向の独立した時刻付き目撃を重ねる。
