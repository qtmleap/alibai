solution:
  culprit: natsume
  summary: 犯人は夏目悠。夏目は三年前の改装案内を担当しており、二一四号室が存在しないことを知っていた。それにもかかわらず、二一四号室の設備苦情という伝言を用意し、小田と藤野の前でわざと場所を尋ねて、自分が客室棟を探し回っている印象を作った。実際には21時27分ごろ小田が支配人室側の管理廊下から出てくる夏目を目撃しており、21時30分ごろ夏目は支配人室で早瀬を襲った。翌朝には夏目が隠していた夜勤売上の不足について監査が予定されていた。電話記録に二一四号室からの着信がなく、伝言紙も夏目の夜勤メモと一致するため、存在しない部屋を探す行動自体が見せるためのアリバイ工作だったと分かる。
  method: 存在しない客室からの苦情を装って館内を探し回る姿を複数人に見せた後、支配人室へ戻って早瀬を襲い、再び人前に出てアリバイを補強した
  motive: 翌朝の会計監査で、夜勤売上の不足を隠していたことが発覚するのを恐れたため
  secretKeywords:
    - 犯人は夏目
    - 夏目が犯人
    - 夏目が早瀬を襲
    - 私が早瀬を襲
    - 二一四号室を使ってアリバイ
