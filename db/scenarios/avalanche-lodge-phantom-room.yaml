briefing: |-
  ——事件の記録を読み上げます。

  冬の山腹に建つ白樺峰ホテルは、登山客や研修旅行を受け入れてきた小さな宿です。冬季は雪深く、天候が荒れれば麓との行き来が途絶えることも珍しくありません。その夜も宿泊客の多くは早めに部屋へ戻り、館内は静かな夜勤の時間に入っていました。

  支配人の早瀬隆司は、長くこのホテルの運営を任されてきた人物です。客室の手配から従業員の勤務まで幅広く目を配り、繁忙期には自ら館内を歩いて仕事を片づけることもありました。事件の夜も、翌朝に備えた事務作業のため支配人室に残っていました。

  早瀬隆司は仕事には厳格で、繁忙期ほど自分から現場へ出る支配人として知られていました。若い従業員の失敗を客前で責めないところもあり、口うるささを苦手にする者がいる一方、いざという時には頼られる人物でした。

  夜が深まるにつれて雪は急激に強まり、やがて山道で雪崩が発生します。道路は通行不能となり、電話回線も不安定になりました。救助や除雪が入るまで、ホテルは山の中に取り残された状態です。

  午後九時四十五分、支配人室で早瀬隆司が死亡しているのが見つかりました。その時間帯に館内で勤務していた従業員は、夜勤責任者の夏目悠、客室係の小田真紀、料理人の藤野修平の三人です。

  外から誰かが来た形跡はありません。雪に閉ざされたホテルで、支配人が死亡するまでに何があったのか。三人からその夜の出来事を聞いてください。
