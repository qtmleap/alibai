schemaVersion: 1
id: landslide-hotel-frosted-silhouette
meta:
  title: 崖上ホテル、孤立の夜
  synopsis: "午後十時、山腹の小さなホテルで支配人・長峰宗一が執務室内で死亡しているのが見つかりました。夕方からの豪雨で道路は土砂崩れに塞がれ、ホテルには外部から出入りできません。"
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 15
  tags: [ホテル, 土砂崩れ, 目撃, 死亡時刻]
victim:
  name: 長峰宗一
  introduction: 山腹のホテル支配人
briefing: |-
  ——事件の記録を読み上げます。

  山腹に建つそのホテルは、客室数の少ない静かな宿として知られていました。大きな観光地から少し離れているぶん、長期滞在の客や制作のためにこもる客も多く、館内では従業員と宿泊客の距離も自然と近くなります。その日も数組の客が滞在していました。

  支配人の長峰宗一は、予約から館内管理まで幅広く目を配る人物でした。人手の少ないホテルでは支配人自身が現場へ出ることも多く、夜になってからも執務室で翌日の手配を続けていたといいます。

  長峰宗一は客前では穏やかで、常連客の名前や好みをよく覚える支配人として親しまれていました。館内の仕事には厳格で従業員を困らせることもありましたが、ホテルを守る責任感の強さは誰もが認めていました。

  夕方から降り出した雨は次第に強まり、山道の一部で土砂崩れが発生しました。ホテルへ通じる道路は塞がれ、宿泊客も従業員も朝まで館内に留まることになります。外部との往来は止まり、窓の外では雨と風の音だけが続いていました。

  午後十時、執務室で長峰宗一が死亡しているのが発見されます。館内にいた主な関係者は、フロント主任の綾瀬環、宿泊客の作家・神田理一、写真家の星野結です。

  孤立したホテルで、夕食後から発見までに何があったのか。三人から長峰とのやり取りと、その夜の館内の様子を聞いてください。
floorPlan: null
