solution:
  culprit: ayase
  summary: 犯人は綾瀬環。改装費の水増しを長峰に見抜かれ、説明を求められた直後に執務室で長峰を襲った。犯行を21時半以後に見せるため、長峰の長い上着を衣紋掛けに掛け、机上灯で磨りガラスへ人の輪郭を映した。神田はその輪郭を長峰本人だと思い込んだが、顔も声も確認していない。上着が21時18分にはフロント裏から消えていたこと、発見時には執務室の衣紋掛けに掛かっていたこと、衣紋掛けを磨りガラス付近へ移動した跡が残ることを合わせると、目撃は生存証明ではなく偽装だったと分かる。
  method: 長峰を襲った後、本人の長い上着と衣紋掛け、室内灯で磨りガラス越しの人影を作り、死亡時刻を遅く見せた
  motive: 改装費の水増しと私的流用を長峰に発見され、責任追及を恐れたため
  requiredFacts: [ayase-falsified-invoices, nagamine-called-ayase, ayase-killed-nagamine, ayase-staged-silhouette, kanda-did-not-hear-voice, hoshino-saw-empty-coat-hook, stand-feet-dust-mark]
  secretKeywords:
    - 犯人は綾瀬
    - 綾瀬が長峰を襲
    - 上着で人影を作
    - 人影で死亡時刻を偽装
quality:
  expectedQuestionCount:
    min: 10
    max: 22
  requiredEvidence:
    min: 3
  redHerrings: [kanda-secret-manuscript, hoshino-secret-photo]
  notes: 目撃証言を「見た事実」と「証人の解釈」に分けるのが中心。人影の正体だけでは犯人確定にせず、上着の移動と請求書の動機を合わせる。
