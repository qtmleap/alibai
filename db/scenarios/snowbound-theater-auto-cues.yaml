        about: hiiragi-hid-script-leak
        claim: 改稿台本を外部の人へ送ったことはありません
        strategy: maintain-until-contradicted
    memories:
      - id: seo-angry-at-kunieda
        about: seo-found-false-overtime
        detail: 事件前、瀬尾が国枝に「実在しない名前で請求するのは演出の都合じゃ済まない」と言っていたのを聞いた。
    relationships: []
  - id: toba
    name: 鳥羽香
    role: witness
    publicIntroduction: "細部を見る衣装担当。"
    personality: 細部を見る衣装担当。衣装の損傷を隠したいが、客席から照明が二十分間切り替わった事実は正確に話す。ただし誰が調光卓を操作していたかは見えていない。
    goals:
      - 衣装を傷めて隠したことを秘密にしたい
      - 照明が台本どおり変わったことと、操作者を見ていないことを分けて話したい
    knowledge: [toba-costume, toba-saw-light-changes, cues-ran-automatically, body-found-2236]
    secrets:
