solution:
  culprit: kunieda
  summary: 犯人は国枝美冬。実在しない外部スタッフ名義で残業費を架空請求していたことを瀬尾に見抜かれ、翌朝に運営会社へ報告され公演進行から外される予定だった。国枝は21時57分に二十分間の照明キューを自動進行へ設定した。22時から舞台照明は台本どおり切り替わり続け、鳥羽も客席からそれを見ていたが、調光卓には手動入力がなかった。国枝本人は22時03分ごろ卓を離れ、22時10分には笹井が演出控室側の舞台袖で目撃している。22時14分ごろ瀬尾を襲い、22時19分ごろ調光卓へ戻った。照明の変化は舞台監督の在席ではなく、自動進行機能の動作を示していた。
  method: 通し稽古用の照明キューを自動進行させ、客席から見える連続した照明変化を在席証明に見せかけて演出控室へ移動した
  motive: 架空スタッフ名義の残業費請求が発覚し、翌朝の報告で公演進行の担当と信用を失うことを恐れたため
  requiredFacts: [kunieda-falsified-overtime, seo-planned-report, cue-console-auto-mode, kunieda-set-auto-cues, cues-ran-automatically, kunieda-left-console, sasai-saw-kunieda-2210, kunieda-killed-seo]
  secretKeywords:
    - 犯人は国枝
    - 国枝が犯人
    - 国枝が瀬尾を襲
    - 私が瀬尾を襲
    - 自動キューでアリバイを偽装
quality:
  expectedQuestionCount:
    min: 11
    max: 23
  requiredEvidence:
    min: 3
  redHerrings: [hiiragi-hid-script-leak, toba-hid-costume-damage, sasai-bypassed-inspection]
  notes: 観客から見える照明変化を人の手動操作と誤認させる。鳥羽の『照明は見たが操作者は見ていない』という観察範囲と、笹井の舞台袖目撃を重ねてアリバイを崩す。
