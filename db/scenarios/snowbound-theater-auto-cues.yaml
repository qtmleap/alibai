        about: toba-saw-light-changes
        detail: 客席から照明の変化は全部見えたが、調光卓は後方の壁際で人影までは見えなかった。
    relationships: []
  - id: sasai
    name: 笹井徹
    role: witness
    publicIntroduction: "舞台機構の挙動に詳しい技術者。"
    personality: 舞台機構の挙動に詳しい技術者。点検省略を隠したいが、22時10分の国枝の目撃と調光卓の自動進行機能は正確に説明できる。
    goals:
      - 舞台機構の定期点検を一項目省略したことを隠したい
      - 22時10分の国枝の目撃と自動進行機能は正確に話したい
    knowledge: [sasai-rigging, sasai-saw-kunieda-2210, cue-console-auto-mode, body-found-2236]
    secrets:
      - fact: sasai-bypassed-inspection
        disclosure: pressured
    lies:
      - id: sasai-no-skipped-check
        about: sasai-bypassed-inspection
        claim: 定期点検を省略して実施済みと記録した項目はありません
        strategy: maintain-until-contradicted
    memories:
      - id: wing-kunieda
        about: sasai-saw-kunieda-2210
        detail: 22時10分ごろ、調光卓にいるはずの国枝が演出控室側の舞台袖通路を急いで歩いていた。
    relationships: []

