    personality: 段取りに厳しく、舞台上の出来事を秒単位で管理する舞台監督。照明が予定どおり進んだ事実を自分の操作記録のように語り、自動進行機能について尋ねられると話をそらす。
    goals:
      - 架空スタッフ名義の残業費請求を隠したい
      - 二十分続いた照明変化を、自分が調光卓に居続けた証拠として通したい
    knowledge: [kunieda-stage-manager, cue-console-auto-mode, cues-ran-automatically, toba-saw-light-changes, body-found-2236]
    secrets:
      - fact: kunieda-falsified-overtime
        disclosure: pressured
      - fact: seo-found-false-overtime
        disclosure: pressured
      - fact: seo-planned-report
        disclosure: pressured
      - fact: kunieda-set-auto-cues
        disclosure: pressured
      - fact: kunieda-left-console
        disclosure: never
      - fact: kunieda-killed-seo
        disclosure: never
      - fact: kunieda-returned-console
        disclosure: never
    lies:
      - id: kunieda-console-alibi
        about: kunieda-left-console
        claim: 22時から20分まで調光卓を離れていません。照明が台本どおり進んだのは私が一つずつキューを出していたからです
        strategy: maintain-until-contradicted
      - id: kunieda-no-auto-cues
        about: kunieda-set-auto-cues
        claim: 今夜の通し確認では自動進行を使っていません。全部手動でした
        strategy: maintain-until-contradicted
    memories:
      - id: removal-threat
        about: seo-planned-report
        detail: 瀬尾から「明朝、運営会社へ出す。次の公演から進行は外れてもらう」と言われ、劇場での立場が終わると思った。
    relationships:
      - character: sasai
        relation: 舞台技術の同僚
        attitude: 舞台袖の人の動きをよく見ているので警戒している
      - character: toba
        relation: 通し確認の同僚
        attitude: 客席から照明変化を見ていたので、自分のアリバイを補強してくれると思っている
  - id: hiiragi
    name: 柊真琴
    role: suspect
    publicIntroduction: "感情表現の大きい主演俳優。"
    personality: 感情表現の大きい主演俳優。改稿台本を知人へ送ったことを隠したいが、舞台機器の仕組みには詳しくない。瀬尾と配役を巡って口論していた。
    goals:
      - 公開前の台本を外部へ送ったことを隠したい
      - 瀬尾との口論だけで疑われたくない
    knowledge: [hiiragi-actor, body-found-2236]
    secrets:
