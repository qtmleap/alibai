  - id: cues-end
    at: "22:20"
    participants: [kunieda, toba]
    facts: [cues-ran-automatically]
    description: 自動進行の照明キューが最後まで終了する。
  - id: discovery
    at: "22:36"
    participants: [hiiragi, kunieda, toba, sasai]
    facts: [body-found-2236]
    description: 柊が演出控室で瀬尾の死を発見する。

characters:
