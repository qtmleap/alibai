schemaVersion: 1
id: snowbound-theater-auto-cues
meta:
  title: 雪封じの劇場、無人のキューランプ
  synopsis: 大雪で閉ざされた小劇場で演出家が死亡した。舞台監督は「事件時刻は調光卓で通し稽古のキューを出していた」といい、客席からも照明が台本どおり次々に切り替わるのが見えていた。だがキューが進んだことは、誰かが一つずつ押した証拠なのか。
  category: クローズドサークル
  difficulty: 4
  estimatedMinutes: 15
  tags: [劇場, 大雪, 照明キュー, 自動進行]
victim:
  name: 瀬尾雅人
  introduction: 小劇場「白燕座」演出家
briefing: |-
  ——事件の記録を読み上げます。

  午後十時三十六分、市外れの小劇場「白燕座」の演出控室で、演出家の瀬尾雅人が死亡しているのが見つかりました。午後九時半から大雪で道路が封鎖され、劇場内に残っていたのは瀬尾を含め五人だけです。

  舞台監督の国枝美冬は「午後十時から十時二十分まで調光卓でキューを一つずつ進めていた」と話しています。客席にいた衣装担当も、十時すぎから舞台照明が台本どおり何度も切り替わるのを見ています。

  ほかに残っていたのは俳優の柊真琴、衣装担当の鳥羽香、舞台機構担当の笹井徹。照明の変化が人の操作を意味するのか、通し稽古用の自動進行が何をしていたのかを確かめてください。
floorPlan: null
facts:
  - id: kunieda-stage-manager
    statement: 国枝美冬は舞台進行と照明キュー管理を担当する舞台監督である
    kind: other
  - id: hiiragi-actor
    statement: 柊真琴は公演の主演俳優である
    kind: other
  - id: toba-costume
    statement: 鳥羽香は衣装管理と客席側からの通し確認を担当している
    kind: other
  - id: sasai-rigging
    statement: 笹井徹は舞台機構と吊り物設備を担当する技術者である
    kind: other
  - id: kunieda-falsified-overtime
    statement: 国枝美冬は存在しない外部スタッフ名義を使い、残業費の一部を架空請求していた
    kind: motive
    secret: true
  - id: seo-found-false-overtime
    statement: 瀬尾雅人は事件当日、国枝美冬の残業費請求に実在しないスタッフ名が含まれることを発見した
    kind: motive
    secret: true
  - id: seo-planned-report
    statement: 瀬尾雅人は翌朝、国枝美冬の架空請求を劇場運営会社へ報告し、公演の進行担当から外す予定だった
    kind: motive
    secret: true
  - id: cue-console-auto-mode
    statement: 調光卓には通し稽古用に、設定済みの時刻間隔で照明キューを自動進行させる機能がある
    kind: physical
  - id: kunieda-set-auto-cues
    statement: 21時57分、国枝美冬は22時00分から二十分間の照明キューを自動進行へ設定した
    kind: physical
    secret: true
  - id: cues-ran-automatically
    statement: 22時00分から22時20分まで、照明キューは調光卓への手動入力なしで設定順に自動進行した
    kind: physical
  - id: kunieda-left-console
    statement: 22時03分ごろ、国枝美冬は調光卓を離れた
    kind: truth
    secret: true
  - id: sasai-saw-kunieda-2210
    statement: 22時10分ごろ、笹井徹は演出控室へ続く舞台袖通路で国枝美冬を見た
    kind: observation
  - id: kunieda-killed-seo
    statement: 22時14分ごろ、国枝美冬は演出控室で瀬尾雅人を襲い死亡させた
    kind: truth
    secret: true
  - id: kunieda-returned-console
    statement: 22時19分ごろ、国枝美冬は調光卓へ戻った
    kind: truth
    secret: true
  - id: toba-saw-light-changes
    statement: 22時00分から22時20分の間、鳥羽香は客席から照明が台本どおり切り替わり続けるのを見た
    kind: observation
  - id: hiiragi-hid-script-leak
    statement: 柊真琴は公開前の改稿台本を知人へ送っていた
    kind: other
    secret: true
  - id: toba-hid-costume-damage
    statement: 鳥羽香は高価な衣装を傷めたことを報告せず、自分で補修して隠していた
    kind: other
    secret: true
  - id: sasai-bypassed-inspection
    statement: 笹井徹は舞台機構の定期点検を一項目省略し、実施済みとして記録していた
    kind: other
    secret: true
  - id: body-found-2236
    statement: 22時36分、柊真琴が演出控室で瀬尾雅人の死を発見した
    kind: observation

