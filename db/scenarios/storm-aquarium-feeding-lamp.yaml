solution:
  culprit: morishita
  summary: 森下は担当水槽の損失を少なく見せるため飼育記録を改ざんしており、江波に見抜かれて翌朝に館長へ報告され、担当から外される予定だった。森下は給餌装置を四分間隔の自動運転へ設定し、青い給餌灯が定期的に点く状況を作った。給餌操作台を離れ、00時02分には相良が検疫準備室側の通路で森下を目撃している。江波を襲った後に操作台へ戻った。灯りは人の操作ではなくモーターの作動に連動していた。
  method: 四分間隔の自動給餌で青い給餌灯を点かせ続け、それを在席証明に見せかけて給餌場所を離れた
  motive: 飼育記録の改ざんが発覚し、翌朝の報告で担当展示と職務上の信用を失うことを恐れたため
  requiredFacts: [morishita-falsified-records, enami-planned-report, feeder-auto-capable, feeding-lamp-motor-linked, morishita-set-auto-feeder, morishita-left-station, sagara-saw-morishita, morishita-killed-enami]
  secretKeywords:
    - 犯人は森下
    - 森下が犯人
    - 森下が江波を襲
    - 私が江波を襲
    - 自動給餌でアリバイを偽装
quality:
  expectedQuestionCount:
    min: 12
    max: 24
  requiredEvidence:
    min: 3
  redHerrings: [sakakibara-hid-stock, mikoshiba-private-camera, sagara-skipped-round]
  notes: 複数人が見られる青い給餌灯を客観証拠に見せつつ、装置の作動と人の在席を分ける。相良の独立した目撃を合わせて森下へ収束させる。
