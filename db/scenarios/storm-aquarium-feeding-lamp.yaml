schemaVersion: 1
id: storm-aquarium-feeding-lamp
meta:
  title: 暴風の水族館、午前零時の給餌灯
  synopsis: 高潮で閉館後の水族館が孤立した夜、飼育部長がバックヤードで死亡した。容疑者の一人は「深海水槽で数分おきに給餌していた」と主張し、展示側からは確かに給餌灯が何度も点いた。だが灯りは人の操作を示していたのか。
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 15
  tags: [水族館, 暴風, 自動給餌, アリバイ]
victim:
  name: 江波慎吾
  introduction: 海浜水族館飼育部長
briefing: |-
  ——事件の記録を読み上げます。

  午前零時十二分、海浜水族館の検疫準備室で、飼育部長の江波慎吾が死亡しているのが見つかりました。高潮で正面道路は通行止めとなり、防潮シャッターも閉鎖。午後十一時半以降、館内へ出入りした者はいません。

  残っていたのは、魚類担当の森下莉央、獣医師の榊原直、潜水設備担当の御子柴徹、夜間警備の相良芳江の四人です。森下は「午後十一時五十五分から零時十分まで深海水槽の給餌を続けていた」と話しています。展示通路から見える青い給餌灯も、その間に何度も点灯していました。

  検疫準備室はバックヤードの奥にあり、展示通路から直接は見えません。給餌灯が何を示すのか、各人の証言から確かめてください。
floorPlan: null
