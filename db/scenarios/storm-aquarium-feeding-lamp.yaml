    kind: truth
    secret: true
  - id: sagara-saw-morishita
    statement: 00時02分ごろ、相良芳江は検疫準備室へ続くバックヤード通路で森下莉央を見た
    kind: observation
  - id: morishita-killed-enami
    statement: 00時05分ごろ、森下莉央は検疫準備室で江波慎吾を襲い死亡させた
    kind: truth
    secret: true
  - id: morishita-returned
