  - id: enami-planned-report
    statement: 江波慎吾は翌朝、森下莉央の記録改ざんを館長へ報告し、担当から外す予定だった
    kind: motive
    secret: true
  - id: feeder-auto-capable
    statement: 深海水槽の給餌装置には設定した間隔で自動運転する機能がある
    kind: physical
  - id: feeding-lamp-motor-linked
    statement: 深海水槽の青い給餌灯は人のボタン操作ではなく、給餌装置のモーターが動作するたびに自動点灯する
    kind: physical
