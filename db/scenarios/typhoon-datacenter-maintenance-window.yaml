schemaVersion: 1
id: typhoon-datacenter-maintenance-window
meta:
  title: 冠水する湾岸データセンター
  synopsis: "午後十時十五分、湾岸データセンターの予備部品庫で、運用責任者の真田啓介が死亡しているのが見つかりました。台風による冠水で周辺道路は封鎖され、午後九時半以降に建物へ出入りした者はいません。"
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 15
  tags: [データセンター, 台風, ログ, アリバイ]
victim:
  name: 真田啓介
  introduction: 湾岸データセンター運用責任者
  foundAt: 22:15
  foundIn: 予備部品庫
  causeOfDeath: 事件性のある外傷による死亡
  findings:
    - id: victim-state
      statement: 真田啓介は予備部品庫で倒れており、その場で死亡が確認されている。
    - id: victim-motive-material
      statement: 遺体のそばには「交換部品の請求書と在庫表」に関わる資料が残されている。
briefing: |-
  ——事件の記録を読み上げます。

  湾岸に建つ大規模データセンターでは、昼夜を問わず多数のサーバーが稼働しています。普段は利用者の目に触れない施設ですが、電力、冷却、通信、警備の担当者が交代で勤務し、障害が起きれば深夜でも復旧作業が始まります。

  運用責任者の真田啓介は、システム部門と設備部門をまとめる立場でした。顧客向けサービスを止めないための判断を任され、その夜も台風への備えと発生したトラブルへの対応を指揮していました。

  真田啓介は障害時ほど冷静になる運用責任者で、手順や安全確認には厳格な人物でした。普段は口数が少ないものの、大きなトラブルでは最後まで現場に残るため、技術者たちからは頼れる上司として信頼されていました。

  台風による大雨で周辺道路が冠水し、午後九時半以降は建物への出入りができなくなりました。館内では複数の警報や復旧作業が重なり、担当者たちはそれぞれの持ち場で対応を続けていました。

  午後十時十五分、予備部品庫で真田啓介が死亡しているのが見つかります。その夜に残っていたのは、システム担当の久世秋穂、ネットワーク技術者の甲田修、電気設備担当の波多野結、警備員の真壁徹です。

  台風対応が続くデータセンターの中、真田の最後の時間に何があったのか。四人から復旧作業と館内での行動について話を聞いてください。
floorPlan: null
