solution:
  culprit: kuze
  summary: 久世は保守費の水増しを真田に見抜かれ、翌朝に本社監査へ報告される予定だった。久世は三分間隔の予約ジョブを仕込み、端末の実行記録を在席証明に見せかけて監視室を離れた。22時01分には真壁が東側廊下で久世を目撃している。搬入のため半開きだった予備部品庫へ入り、真田を襲った後に監視室へ戻った。
  method: 予約ジョブの自動実行記録を在席証明に見せかけ、カード認証なしで入れる時間帯の部品庫へ移動した
  motive: 保守費の水増しが発覚し、翌朝の監査報告で職と信用を失うことを恐れたため
  requiredFacts: [kuze-invoice-fraud, sanada-planned-report, kuze-created-scheduled-job, scheduled-jobs-ran, kuze-left-noc, makabe-saw-kuze, parts-door-propped, kuze-killed-sanada]
  secretKeywords:
    - 犯人は久世
    - 久世が犯人
    - 久世が真田を襲
    - 私が真田を襲
    - 予約ジョブでアリバイを偽装
quality:
  expectedQuestionCount:
    min: 12
    max: 24
  requiredEvidence:
    min: 3
  redHerrings: [koda-copied-config, hatano-suppressed-alarm, makabe-dozed]
  notes: 実行ログを在席から切り離し、カード認証記録も半開きの扉によって決定打ではないと崩す二段構え。真壁の独立した目撃を合わせて久世へ収束させる。
