briefing: |-
  ——事件の記録を読み上げます。

  郊外駅「夕凪駅」は、住宅地と市街地を結ぶ小さな駅です。普段なら終電が出れば一日の仕事はほぼ終わり、駅員たちは締め作業へ移ります。その夜は信号設備のトラブルが起こり、ホームには帰宅を急ぐ乗客がいつもより長く残っていました。

  駅長の藤崎正雄は、長年この駅を任されてきた人物です。運行の乱れが起きた際には現場の判断をまとめ、乗客対応と設備側への連絡の両方を指揮していました。終電が遅れたその夜も、駅務室とホームのあいだで対応に追われていました。

  藤崎正雄は実直で、長年この駅を支えてきた駅長として地域の利用客にも親しまれていました。運行や安全に関する規則には厳格でしたが、困っている乗客には自ら声をかける人柄で、駅員からも信頼されていました。

  やがて遅れていた列車が発車し、乗客の姿が消えると、駅は急に静かになります。シャッターを下ろした売店、照明の残るホーム、保守作業を待つ設備だけが残り、勤務者たちは一日の後片づけに入りました。

  午後十時二十五分、駅務室で藤崎正雄が死亡しているのが見つかりました。事情を聞けるのは、助役の有馬結衣、駅売店責任者の小森拓、設備点検員の沢田亮です。

  運行トラブルに追われた終電前後、駅の中で誰がどこにいたのか。三人からその夜の仕事と藤崎の様子を聞いてください。
