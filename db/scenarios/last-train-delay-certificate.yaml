  synopsis: "午後十時二十五分、郊外駅「夕凪駅」の駅務室で、駅長の藤崎正雄が死亡しているのが見つかりました。その夜は信号トラブルで終電が八分遅れ、ホームには普段より長く乗客が残っていました。"
