solution:
  culprit: arima
  summary: 犯人は有馬結衣。券売機の返金処理を利用した現金抜き取りを藤崎に見抜かれ、終電後すぐ本部へ報告すると告げられた。有馬は「22時02分から終電が出る22時18分までホームで遅延証明書を配っていた」と話すが、その証明書は22時20分になって初めて印刷されており、主張した時間帯には存在していない。さらに22時05分には沢田が駅務室へ向かう有馬を、22時12分には小森が駅務室側から戻る有馬を見ている。有馬は22時08分ごろ駅務室で藤崎を襲い、終電後に証明書を印刷して配布作業をアリバイへ利用しようとした。小森の帳簿外販売と沢田の無許可入室は独立した隠し事である。
  method: ホームで遅延証明書を配っていたという偽の作業アリバイを作り、駅務室で藤崎を襲った後、終電出発後に証明書を印刷した
  motive: 返金処理を利用した現金抜き取りが本部へ報告され、職と信用を失うことを恐れたため
  requiredFacts: [arima-skimmed-refunds, fujisaki-warned-arima, arima-entered-office-2205, sawada-saw-arima-2205, arima-killed-fujisaki-2208, komori-saw-arima-2212, certificates-printed-2220]
  secretKeywords:
    - 犯人は有馬
    - 有馬が犯人
    - 有馬が藤崎を襲
    - 私が藤崎を襲
    - 遅延証明書をアリバイに殺
quality:
  expectedQuestionCount:
    min: 8
    max: 18
  requiredEvidence:
    min: 2
  redHerrings: [komori-resold-expired-goods, sawada-entered-equipment-room]
  notes: 紙の存在時刻を確認することで「配布していた」という作業アリバイを崩す。沢田と小森の二方向の目撃があるため、どちらか一人への質問を逃しても有馬が駅務室へ出入りしたことへ到達できる。
