schemaVersion: 1
id: storm-planetarium-reflected-witness
meta:
  title: 嵐の天象館、ガラスの向こうの目撃者
  synopsis: 嵐で孤立した山頂の天象館で館長が死亡した。事件後の時刻に、投影室のガラス越しに館長らしい白い上着の人物が目撃されている。だが暗い室内を隔てるガラスは、向こう側だけでなく手前側の像も映す。目撃者が見た人物は本当に部屋の中にいたのか。
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 15
  tags: [天象館, 反射, 目撃証言, 死亡時刻]
briefing: |-
  ——事件の記録を読み上げます。

  午後十時、暴風で山道とロープウェイが停止した星見ヶ丘天象館で、館長の犬塚誠が投影準備室内で死亡しているのが見つかりました。館内に残っていたのは展示担当の小野寺莉香、投影技師の松田圭介、売店責任者の朝倉葉月の三人だけです。

  松田は午後九時三十五分、投影室の観察ガラス越しに、館長がよく着る白い展示用上着の人物を見たと証言しています。小野寺もその場にいて、松田が「館長、まだ中にいるんですね」と話したことを認めています。

  もし目撃が正しければ、犬塚は九時三十五分まで生きていたことになります。ところがその夜、投影室内は機器点検のため照明が落とされていました。ガラス越しの目撃が何を見たものか確かめてください。
floorPlan: null
