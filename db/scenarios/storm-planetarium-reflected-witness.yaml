briefing: |-
  ——事件の記録を読み上げます。

  山頂に建つ星見ヶ丘天象館は、昼は展示施設、夜は星空観察の拠点として使われています。大きな投影機を備えたドームと展示室、機器を扱う裏方区画があり、閉館後にも点検や番組準備のためスタッフが残ることがあります。

  館長の犬塚誠は、施設運営と展示企画を取りまとめてきた人物です。観光施設としての集客と教育施設としての役割を両立させるため、展示担当や技術者と日常的に意見を交わしていました。

  犬塚誠は星の話になると子どものように熱心になる館長で、来館者にも親しまれていました。展示の見せ方には厳格で職員を困らせることもありましたが、天文学を身近にしたいという情熱は館内の誰もが知っていました。

  夕方から山頂は暴風に包まれ、麓へ続く道路とロープウェイが相次いで停止しました。来館者は早めに下山し、天象館には夜間作業をしていた関係者だけが残ります。

  午後十時、投影準備室で犬塚誠が死亡しているのが発見されました。館内にいたのは、展示担当の小野寺莉香、投影技師の松田圭介、売店責任者の朝倉葉月です。

  嵐で孤立した山頂の施設で、閉館後に何が起きたのか。三人から犬塚の行動とその夜の館内の様子を聞いてください。
