solution:
  culprit: onodera
  summary: 犯人は小野寺莉香。21時35分に松田が観察ガラスで見た白い人物像は、投影室内の犬塚ではなかった。投影室は機器点検で暗く、廊下側が明るかったため、ガラスには松田の数歩後ろにいた小野寺が反射していた。小野寺は犬塚と同型の白い展示用上着を着ており、松田は顔を確認せず犬塚だと思い込んだ。小野寺自身はガラスの反射条件を以前から知っていたうえ、松田のすぐ後ろにいたのに「館長はまだ中にいた」と誤認を補強している。犬塚は実際には21時24分ごろ小野寺に襲われていた。翌朝、犬塚は小野寺による無断の予算振替を運営法人へ報告する予定だった。
  method: 暗い投影室の観察ガラスに廊下側の自分の姿が反射した目撃を訂正せず、同型の白い上着による誤認を犬塚の生存証明として利用した
  motive: 無断で行った展示予算の振替を犬塚が翌朝運営法人へ報告する予定で、責任問題になることを恐れたため
  requiredFacts: [white-jackets-similar, glass-reflects-dark-booth, onodera-behind-matsuda-2135, figure-was-reflection, onodera-knew-reflection, budget-report-next-day, onodera-killed-inuzuka]
  secretKeywords:
    - 犯人は小野寺
    - 小野寺が犯人
    - 小野寺が犬塚を襲
    - 私が犬塚を襲
    - 白い人物は小野寺の反射
quality:
  expectedQuestionCount:
    min: 12
    max: 24
  requiredEvidence:
    min: 3
  redHerrings: [matsuda-hid-test-failure, asakura-hid-stock-loss]
  notes: 目撃証言を「誰を見たか」ではなく「光学的にどちら側の像を見たか」へ分解する。小野寺が反射条件を知っていたことと、実際に松田の後ろにいたことを合わせて故意の利用を確定する。