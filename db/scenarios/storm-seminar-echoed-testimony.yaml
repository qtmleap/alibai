schemaVersion: 1
id: storm-seminar-echoed-testimony
meta:
  title: 嵐の研究会、増殖した目撃証言
  synopsis: 山中の研究会館が嵐で孤立し、主催者・鷺沢修が事務室で死亡した。三人の証言を並べると、二十一時二十分ごろ鷺沢は東資料室にいたように見える。しかし同じ話が三度語られていることと、三人が別々に確認したことは同じではない。
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 18
  tags: [研究会, 嵐, 証言, 情報源]
victim:
  name: 鷺沢修
  introduction: 山中の研究会館の研究会主催者
briefing: |-
  ——事件の記録を読み上げます。

  午後九時四十五分、嵐で道路が閉鎖された山中の研究会館で、主催者・鷺沢修が西側の事務室で死亡しているのが見つかりました。

  館内にいたのは研究員の久我真帆、編集者の成瀬灯、大学院生の白石慧の三人です。

  聞き取りを始めると、三人とも「九時二十分ごろ、鷺沢は東資料室にいたはずだ」と話します。複数の証言が一致するなら確かなようにも見えます。

  ただし、証言には必ず情報源があります。誰が自分の目で見たのか、誰が誰から聞いただけなのか。一致する結論ではなく、そこへ至った経路を追ってください。
floorPlan: null
facts:
  - id: kuga-researcher
    statement: 久我真帆は鷺沢修と共同研究を進めている研究員である
    kind: other
  - id: naruse-editor
    statement: 成瀬灯は研究会の論文集を担当する編集者である
    kind: other
  - id: shiraishi-student
    statement: 白石慧は研究会の運営補助をしている大学院生である
    kind: other
  - id: kuga-claimed-saw-east
    statement: 久我真帆は21時18分ごろ鷺沢修が東資料室へ向かうのを見たと主張した
    kind: testimony
    secret: true
  - id: naruse-learned-from-kuga
    statement: 成瀬灯が鷺沢修は東資料室にいると思った根拠は、久我真帆からそう聞いたことだった
    kind: testimony
  - id: shiraishi-learned-from-naruse
    statement: 白石慧が鷺沢修は東資料室にいると思った根拠は、成瀬灯からそう聞いたことだった
    kind: testimony
  - id: no-independent-east-sighting
    statement: 21時台に鷺沢修が東資料室へ入る姿を久我真帆以外に直接見た人物はいない
    kind: truth
  - id: east-room-unused
    statement: 東資料室では21時前に片付けた閲覧卓や資料箱の位置が21時40分まで変わっていなかった
    kind: physical
  - id: shiraishi-saw-kuga-west
    statement: 21時16分ごろ、白石慧は西側事務室へ続く廊下から出てくる久我真帆を見た
    kind: observation
  - id: kuga-stole-results
    statement: 久我真帆は鷺沢修の未発表分析結果を自分単独の成果として先に投稿しようとしていた
    kind: motive
    secret: true
  - id: sagisawa-found-submission
    statement: 鷺沢修は事件当日の夜、久我真帆が未発表結果を無断で投稿準備していることを知った
    kind: motive
    secret: true
  - id: sagisawa-confronted-kuga
    statement: 20時58分ごろ、鷺沢修は久我真帆に投稿を取り下げるよう求め、応じなければ共同研究から外すと告げた
    kind: motive
    secret: true
  - id: kuga-killed-sagisawa
    statement: 21時10分ごろ、久我真帆は西側事務室で鷺沢修を襲い死亡させた
    kind: truth
    secret: true
  - id: kuga-started-rumor
    statement: 21時18分ごろ、久我真帆は成瀬灯に鷺沢修が東資料室へ行ったと嘘を伝えた
    kind: truth
    secret: true
  - id: naruse-repeated-rumor
    statement: 21時22分ごろ、成瀬灯は白石慧に鷺沢修が東資料室にいると伝えた
    kind: observation
  - id: naruse-secret-embargo
    statement: 成瀬灯は公開前の論文集の内容を知人へ漏らしていた
    kind: other
    secret: true
  - id: shiraishi-secret-data
    statement: 白石慧は許可なく研究会の参加者データを自分の調査に流用していた
    kind: other
    secret: true
  - id: body-found-2145
    statement: 21時45分、成瀬灯が西側事務室で鷺沢修の死を発見した
    kind: observation
timeline:
