    facts: [kuga-claimed-saw-east, kuga-started-rumor, no-independent-east-sighting]
    description: 久我が成瀬に「鷺沢は東資料室へ行った」と伝え、存在しない目撃情報の起点を作る。
  - id: rumor-repeated
    at: "21:22"
    participants: [naruse, shiraishi]
    facts: [naruse-learned-from-kuga, naruse-repeated-rumor, shiraishi-learned-from-naruse]
    description: 成瀬が白石へ同じ話を伝え、一つの情報が複数人の証言へ増殖する。
  - id: east-room-still-unused
