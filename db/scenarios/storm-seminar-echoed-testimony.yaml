solution:
  culprit: kuga
  summary: 犯人は久我真帆。共同研究の未発表成果を単独名義で投稿しようとしたことを鷺沢に知られ、取り下げなければ共同研究から外すと告げられた。久我は西側事務室で鷺沢を襲った後、成瀬へ「鷺沢は東資料室へ行った」と嘘を伝えた。成瀬はそれを白石へ伝え、後の聞き取りでは三人とも東資料室という同じ結論を口にしたため、複数の目撃証言があるように見えた。しかし直接の目撃を主張する情報源は久我一人だけだった。東資料室は手つかずで、白石は事件直後に西側廊下から出てくる久我を見ている。証言の一致は、同じ嘘が伝言された結果だった。
  method: 鷺沢を襲った後、自分を起点に「鷺沢は東資料室にいる」という偽情報を流し、伝言で増えた一致証言を犯行時刻と場所の裏付けに見せかけた
  motive: 共同研究の未発表成果を無断で単独投稿しようとしたことが発覚し、投稿撤回と研究からの除外を恐れたため
  requiredFacts: [kuga-stole-results, sagisawa-confronted-kuga, kuga-killed-sagisawa, shiraishi-saw-kuga-west, kuga-started-rumor, naruse-learned-from-kuga, shiraishi-learned-from-naruse, no-independent-east-sighting, east-room-unused]
  secretKeywords:
    - 犯人は久我
    - 久我が鷺沢を襲
    - 久我が東資料室の嘘を流
    - 三人の証言は同じ情報源
quality:
  expectedQuestionCount:
    min: 12
    max: 26
  requiredEvidence:
    min: 3
  redHerrings: [naruse-secret-embargo, shiraishi-secret-data]
  notes: NPC会話との相性を重視した情報源追跡型。証言内容ではなく「誰から知ったか」を掘らないと、一つの嘘が三票に見える。
