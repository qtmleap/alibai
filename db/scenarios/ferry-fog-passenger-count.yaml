  - id: shibata-warning
    at: "16:48"
    participants: [kanda]
    facts: [kanda-skimmed-sales, shibata-found-shortage, shibata-warned-kanda]
    description: 柴田が神田の売上金抜き取りを指摘し、到着後の本社報告を告げる。
  - id: secret-interview
    at: "16:50"
    participants: [fujiwara]
    facts: [fujiwara-secret-interview]
    description: 藤原が上部ラウンジで柴田から内部資料を見せてもらう。
  - id: count-sheet-made
    at: "16:58"
    participants: [kanda]
    facts: [kanda-wrote-count-sheet]
    description: 神田が実際の点呼をせず、予約名簿の42人という数字を点呼表へ写す。
  - id: stair-sighting
    at: "17:03"
    participants: [kanda, ogiwara]
    facts: [ogiwara-saw-kanda-1703]
    description: 荻原が上部ラウンジへ向かう階段で神田とすれ違う。
  - id: shibata-death
    at: "17:06"
    participants: [kanda]
    facts: [kanda-killed-shibata-1706]
    description: 神田が上部ラウンジで柴田を襲い、柴田は死亡する。
  - id: kanda-returns
    at: "17:11"
    participants: [kanda]
    facts: [kanda-returned-lower-1711, count-sheet-says-42]
    description: 神田が下部客室へ戻り、17時12分の時刻を点呼表へ記入する。
  - id: discovery
    at: "17:20"
