schemaVersion: 1
id: ferry-fog-passenger-count
meta:
  title: 霧のフェリー、四十二人目の乗客
  synopsis: 濃霧の海を進む小型フェリーで、運航会社の監査役・柴田功が死亡した。事務長は「客室を回って四十二人を数えていた」とアリバイを主張する。だが、その四十二人目は出航前に船を降りていた。存在しない乗客が、一枚の点呼表を偽物に変える。
  category: 船上ミステリ
  difficulty: 3
  estimatedMinutes: 10
  tags: [フェリー, 濃霧, 点呼表]
victim:
  name: 柴田功
  introduction: 離島航路運航会社監査役
briefing: |-
  ——事件の記録を読み上げます。

  午後五時二十分、離島航路のフェリー「しおかぜ」の上部ラウンジで、運航会社の監査役・柴田功が死亡しているのが見つかりました。船は濃霧のため減速して航行中で、出航後に乗り降りした者はいません。

  船内で事情を聞けるのは三人です。事務長の神田美奈、甲板員の荻原陸、取材中の記者・藤原奈緒。神田は「午後四時五十五分から五時十五分まで下部客室を一人ずつ点呼していた」と言い、その時刻入りの点呼表もあります。荻原は「上部ラウンジには行っていない」、藤原は「柴田とは話していない」と答えています。

  点呼表には乗客四十二人と記されています。けれど、数字が合っていることと、本当に数えたことは同じではありません。出航前後の乗客記録と三人の証言を照らし合わせてください。
floorPlan: null
facts:
  - id: kanda-is-purser
    statement: 神田美奈はフェリー「しおかぜ」の事務長で、乗客管理と船内売上の集計を担当している
    kind: other
  - id: ogiwara-is-deckhand
    statement: 荻原陸は「しおかぜ」の甲板員で、船内巡回と安全確認を担当している
    kind: other
  - id: fujiwara-is-reporter
    statement: 藤原奈緒は地方紙の記者で、離島航路の経営問題を取材するため乗船していた
    kind: other
  - id: booked-passengers-42
    statement: 出航時の予約名簿には乗客42人が記載されていた
    kind: physical
  - id: passenger-left-before-departure
    statement: 予約客の一人は体調不良のため16時35分に下船し、実際に出航した乗客は41人だった
    kind: physical
  - id: kanda-skimmed-sales
    statement: 神田美奈は船内で現金販売した追加券の一部を売上から抜き、帳簿を少なく記録していた
    kind: motive
    secret: true
  - id: shibata-found-shortage
    statement: 柴田功は事件当日、追加券の控えと帳簿を照合し、神田美奈による売上金の抜き取りを把握した
    kind: motive
    secret: true
  - id: shibata-warned-kanda
    statement: 16時48分ごろ、柴田功は神田美奈に、到着後すぐ本社へ不正を報告すると告げた
    kind: motive
    secret: true
  - id: fujiwara-secret-interview
    statement: 16時50分から16時56分まで、藤原奈緒は上部ラウンジで柴田功から会社の安全管理に関する内部資料を見せてもらった
    kind: observation
    secret: true
  - id: kanda-wrote-count-sheet
    statement: 16時58分ごろ、神田美奈は予約名簿の42人という数字を写して点呼表を作成した
    kind: truth
    secret: true
  - id: ogiwara-saw-kanda-1703
    statement: 17時03分ごろ、荻原陸は上部ラウンジへ向かう階段で神田美奈とすれ違った
    kind: observation
  - id: kanda-killed-shibata-1706
    statement: 17時06分ごろ、神田美奈は上部ラウンジで柴田功を襲い死亡させた
    kind: truth
    secret: true
  - id: kanda-returned-lower-1711
    statement: 17時11分ごろ、神田美奈は下部客室へ戻った
    kind: truth
    secret: true
  - id: count-sheet-says-42
    statement: 神田美奈の点呼表には17時12分の記入時刻と乗客42人という人数が書かれていた
    kind: physical
  - id: ogiwara-let-friend-bridge
    statement: 荻原陸は出航前、知人の乗客を短時間だけ乗員通路へ入れて操舵室前から写真を撮らせていた
    kind: other
    secret: true
  - id: body-found-1720
    statement: 17時20分、荻原陸が上部ラウンジで柴田功の死を発見した
    kind: observation
