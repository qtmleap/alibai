briefing: |-
  ——事件の記録を読み上げます。

  2147年、火星エリュシオン観測基地。赤い平原の一角に築かれたこの基地では、少人数の研究者と技術者が数か月単位で生活しています。地球は空に浮かぶ遠い故郷であり、食料も空気も電力も、基地内の設備を維持することで初めて日常が成り立ちます。

  主任研究員エレナ・ヴァルガは、観測計画と研究班をまとめる責任者でした。地質データや大気観測の成果を地球側へ報告しながら、限られた人員で基地を運営する立場でもあります。その日は長期観測の節目にあたり、各担当がデータ整理を進めていました。

  エレナ・ヴァルガは火星の長期観測に人生を捧げた研究熱心な科学者です。判断基準には厳格で議論でも譲らないことがありましたが、危険な基地生活で責任を引き受ける姿勢から、隊員たちには頼られる主任でした。

  夕刻から大規模な砂嵐が基地周辺を覆いました。地表車両は運用を停止し、屋外活動も中止。通信中継用の機体も退避し、基地の住人たちは嵐が収まるまで建物内に留まることになります。

  その夜、解析室でエレナ・ヴァルガが死亡しているのが発見されました。基地にいた関係者は、副主任のノア・チェン、通信士のアミラ・サイード、整備主任のルイス・オルテガです。

  地球から遠く離れ、砂嵐に閉ざされた基地で何が起きたのか。三人からその日の勤務とエレナの最後の行動について話を聞いてください。
