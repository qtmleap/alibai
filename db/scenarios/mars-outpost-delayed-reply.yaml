solution:
  culprit: noah
  summary: 犯人はノア・チェン。予算流用をエレナに見抜かれ、翌朝地球本部へ報告されるのを恐れた。ノアは21時18分に地球へ質問を送った後、返信を待つ約20分の間に通信室を離れ、21時36分ごろ解析室でエレナを襲った。21時38分に地球から返答が届くと、それを「その時刻に地球と会話していた」証拠として利用した。しかし返信は21時18分の質問へのもので、受信時にノアが端末前にいる必要はない。さらに21時33分にはルイスが解析室側でノアを目撃している。
  method: 惑星間通信の受信時刻を現在進行の会話時刻に見せかけ、返信待ちの時間帯の行動を隠した
  motive: 予算流用が地球本部へ報告されるのを防ぐため
  requiredFacts: [earth-mars-delay, noah-sent-question-2118, earth-reply-arrived-2138, noah-budget-fraud, elena-would-report, luis-saw-noah-corridor, noah-killed-elena, noah-played-arrival-tone]
  secretKeywords:
    - 犯人はノア
    - ノアがエレナを襲
    - 返信をアリバイに
    - 私がエレナを襲
quality:
  expectedQuestionCount: { min: 10, max: 22 }
  requiredEvidence: { min: 3 }
  redHerrings: [amira-private-channel, luis-unlogged-part]
  notes: 受信パケットが存在することと、その瞬間に通信相手が端末前にいたことを分離する。通信遅延と廊下目撃の二段でアリバイを崩す。
