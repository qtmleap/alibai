    text: 21時38分に届いた地球からの返信は、その約20分前に送られた質問への返答だった。受信時刻はノアが21時38分に通信室へいた証明にならない。
    category: alibi
    subject: { type: character, id: noah }
    sources:
      - type: character
        id: amira
        revealCondition: アミラに21時38分の返信がどの送信パケットへ対応していたか尋ね、21時18分の質問への返答だと確認した。
        requires:
          revelations: []
          evidences: [packet-thread]
    relatedFacts: [earth-mars-delay, noah-sent-question-2118, earth-reply-arrived-2138]
  - id: noah-could-leave
    title: 返信を待つ間の空白
    text: ノアは21時18分に質問を送った後、返信が届く21時38分まで通信端末の前にいる必要がなかった。21時33分には解析室側で目撃されている。
    category: timeline
