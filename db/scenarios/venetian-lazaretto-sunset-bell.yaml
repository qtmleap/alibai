schemaVersion: 1
id: venetian-lazaretto-sunset-bell
meta:
  title: 検疫島、日没の鐘
  synopsis: 1796年、ヴェネツィア潟の検疫島。嵐で舟が出せない夜、監督医が死亡した。三人の滞在者は皆「日没の鐘が鳴った後」の行動を語るが、その鐘は時計ではない。隔離島に残された記録と証言から、時刻の思い込みを崩せ。
  category: 歴史クローズドサークル
  difficulty: 5
  estimatedMinutes: 15
  tags: [1796年, ヴェネツィア, 検疫島, 鐘]
briefing: |-
  1796年、ヴェネツィア潟。感染症を警戒する検疫島ラッザレットで、監督医ロレンツォ・ヴァーレが記録室で死亡しているのが見つかりました。

  嵐で渡し舟は係留され、夜間に島を出入りした者はいません。残っていたのは薬剤係マルタ・ベッリーニ、書記ニコロ・フェッリ、舟番ピエトロ・サルヴィの三人です。

  三人の証言には何度も「日没の鐘の後」という表現が出てきます。鐘が鳴った時刻を現代の時計のように扱ってよいのか。島の当直帳と鐘の運用を確かめながら聞き込みをしてください。
floorPlan: null
