solution:
  culprit: marta
  summary: 犯人はマルタ・ベッリーニ。薬剤の横流しをロレンツォに見抜かれ、翌朝本島へ報告されるのを恐れた。マルタは18時44分ごろ記録室でロレンツォを襲い、18時47分の日没の鐘の直後に薬剤庫へ戻った。その後「鐘が鳴る前から薬剤庫にいた」と語り、鐘を曖昧な時間の境界として利用した。しかし当直帳から鐘の実時刻は18時47分と分かり、ニコロは18時41分に記録室側でマルタを目撃している。鐘は毎日同じ時刻を示す時計ではないため、鐘だけを基準にした証言はアリバイにならない。
  method: 日没の鐘を固定時刻のように語って時間関係を曖昧にし、記録室へ行った事実を隠した
  motive: 薬剤の横流しが翌朝本島へ報告されるのを防ぐため
  requiredFacts: [sunset-bell-not-fixed-hour, bell-rang-1847, marta-diverted-medicine, lorenzo-confronted-marta, nicolo-saw-marta-before-bell, marta-killed-lorenzo]
  secretKeywords:
    - 犯人はマルタ
    - マルタがロレンツォを襲
    - 私がロレンツォを襲
    - 鐘を利用してアリバイ
quality:
  expectedQuestionCount: { min: 10, max: 22 }
  requiredEvidence: { min: 3 }
  redHerrings: [nicolo-altered-ration-ledger, pietro-smuggled-letter]
  notes: 現代の時計感覚を持ち込むと誤る構造。鐘の運用、当日の実時刻、ニコロの目撃を組み合わせて解く。
