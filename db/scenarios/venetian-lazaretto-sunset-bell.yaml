    name: マルタ・ベッリーニ
    role: suspect
    publicIntroduction: "実務に強く落ち着いた薬剤係。"
    personality: 実務に強く落ち着いた薬剤係。時刻を尋ねられると時計ではなく鐘を基準に話す癖がある。不足した薬剤の話題では急に言葉が硬くなる。
    goals:
      - 薬剤の横流しを隠したい
      - 日没の鐘より前は薬剤庫にいたと思わせたい
    knowledge: [marta-apothecary, sunset-bell-not-fixed-hour, bell-rang-1847, body-found-1910]
    secrets:
      - fact: marta-diverted-medicine
        disclosure: pressured
      - fact: lorenzo-found-shortage
        disclosure: pressured
      - fact: lorenzo-confronted-marta
        disclosure: pressured
      - fact: marta-killed-lorenzo
        disclosure: never
      - fact: marta-returned-after-bell
        disclosure: never
    lies:
      - id: marta-before-bell-alibi
        about: marta-returned-after-bell
        claim: 日没の鐘が鳴る前から薬剤庫にいました。鐘の後は一歩も出ていません
        strategy: maintain-until-contradicted
      - id: marta-no-shortage
        about: marta-diverted-medicine
        claim: 薬剤の不足をロレンツォさんから指摘されたことはありません
        strategy: maintain-until-contradicted
    memories:
      - id: report-threat
        about: lorenzo-confronted-marta
        detail: ロレンツォに「朝の舟で本島へ報告する」と言われた瞬間、すべて失うと思った。
    relationships:
      - character: nicolo
        relation: 同僚
        attitude: 帳簿に細かいので苦手としている
      - character: pietro
        relation: 同僚
        attitude: 鐘を鳴らす役目のため、その日の時刻を覚えていることを警戒している
  - id: nicolo
    name: ニコロ・フェッリ
    role: suspect
    publicIntroduction: "几帳面な書記。"
    personality: 几帳面な書記。紙の記録を重視し、人の記憶には懐疑的。配給帳を書き換えていたため帳簿全体を調べられるのは困るが、廊下で見たマルタについては正確に話す。
    goals:
      - 配給帳の改ざんを隠したい
      - 18時41分の目撃を正確に伝えたい
    knowledge: [nicolo-clerk, bell-rang-1847, nicolo-saw-marta-before-bell, body-found-1910]
    secrets:
      - fact: nicolo-altered-ration-ledger
        disclosure: pressured
    lies:
      - id: nicolo-clean-ledger
        about: nicolo-altered-ration-ledger
        claim: 配給帳の数字を私的な都合で変えたことはありません
        strategy: maintain-until-contradicted
    memories:
      - id: corridor-marta
        about: nicolo-saw-marta-before-bell
        detail: 鐘が鳴る少し前、記録室側へ急ぐマルタと廊下ですれ違った。
    relationships:
      - character: marta
        relation: 同僚
        attitude: 薬剤の数字を確認すると嫌な顔をするのが気になっていた
      - character: pietro
        relation: 同僚
        attitude: 規則には大雑把だが鐘の当直は正確だと思っている
  - id: pietro
    name: ピエトロ・サルヴィ
    role: witness
    publicIntroduction: "潟の天候と潮を読むことに長けた舟番。"
    personality: 潟の天候と潮を読むことに長けた舟番。時計より空の明るさや鐘で時間を捉える。私信を運んだ規則違反だけは隠したい。
    goals:
      - 私信を密かに舟へ載せたことを隠したい
      - 事件当日の鐘を鳴らした時刻を正確に説明したい
    knowledge: [pietro-boatman, sunset-bell-not-fixed-hour, bell-rang-1847, body-found-1910]
    secrets:
      - fact: pietro-smuggled-letter
        disclosure: pressured
    lies:
      - id: pietro-no-private-letter
        about: pietro-smuggled-letter
        claim: 検疫規則に反して私信を舟へ載せたことはない
        strategy: maintain-until-contradicted
    memories:
      - id: late-sunset
        about: bell-rang-1847
        detail: 雲が厚く、いつもより早く暗く感じたが、当直帳を見て18時47分に鐘を鳴らした。
    relationships:
      - character: marta
        relation: 同僚
        attitude: 鐘の直後に薬剤庫へ戻る姿を見たことを覚えている
      - character: nicolo
        relation: 同僚
        attitude: 紙の時刻ばかり気にする堅い人だと思っている
