  - id: nicolo-saw-marta-before-bell
    statement: 18時41分ごろ、ニコロ・フェッリは記録室へ向かう廊下でマルタを見た
    kind: observation
  - id: marta-killed-lorenzo
    statement: 18時44分ごろ、マルタ・ベッリーニは記録室でロレンツォを襲い死亡させた
    kind: truth
    secret: true
  - id: marta-returned-after-bell
    statement: 日没の鐘が鳴った直後、マルタ・ベッリーニは薬剤庫へ戻った
