    statement: ニコロ・フェッリは自分の親族へ余分な食料を回すため配給帳の数字を書き換えていた
    kind: other
    secret: true
  - id: pietro-smuggled-letter
    statement: ピエトロ・サルヴィは検疫規則に反して本島への私信を舟に載せていた
    kind: other
    secret: true
  - id: body-found-1910
    statement: 19時10分、ニコロ・フェッリが記録室でロレンツォの死を発見した
    kind: observation
