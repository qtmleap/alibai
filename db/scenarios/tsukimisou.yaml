solution:
  culprit: mizuki
  summary: 犯人は早坂美月。月見荘と遺産の後継者指定が覆るかもしれないという焦りから、19時50分ごろ書斎に忍び込み、旅館裏庭の薬草園にあったトリカブトの粉末をブランデーの瓶に混入した。20時に何食わぬ顔でそのブランデーを涼子に届け、20時15分ごろ涼子が口にして中毒死した。美月は「書斎に行ったのは20時の一度きり」と嘘をついているが、19時50分に廊下で桐生とすれ違っており、この目撃証言と美月自身の証言の間に矛盾が生まれる。もう一つ、深川は「19時30分に書斎で涼子と話した」と嘘の証言をしているが、桐生は19時15分から19時45分まで深川が電話ボックスにいたのを見ており、こちらも証言同士が食い違う。
  method: 旅館裏庭の薬草園にあったトリカブトの粉末をブランデーの瓶に混入し、それを本人に届けて飲ませた毒殺
  motive: 後継者指定が覆ることへの焦り
  # ここに登場人物名や「トリカブト」のような単語をそのまま入れてはいけない。
  # 美月が名乗っただけ、桐生が薬草園の研究について答えただけで返答が遮断され、
  # 正当な聞き込みが成立しなくなる（薬草園の管理記録はそもそも証拠の一つ）。
  # 秘匿すべきは単語ではなく「真相を断定する言い回し」なので、そちらを並べる。
  #
  # 長い語を足すと src/server/llm/filter.ts の holdBackLength が伸び、
  # ストリーミングの表示がその分だけ遅れることにも注意。
  secretKeywords:
    - 犯人は美月
    - 犯人は早坂
    - 美月が犯人
    - 美月が毒
    - 美月さんが毒
    - 私が毒を入れ
    - 私が毒を盛
    - トリカブトを混ぜ
    - トリカブトの粉末を混
    - ブランデーに毒
