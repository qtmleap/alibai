  introduction: 老舗旅館「月見荘」女将
  foundAt: "20:30"
  foundIn: 書斎
  foundRoom: study
  estimatedDeathAt: "20:15"
  causeOfDeath: 植物性の毒物による中毒死
  # 遺体と現場から目にできることだけを書く。誰がやったかの解釈は書かない。
  findings:
    - id: no-struggle
      statement: 争った跡が無い。着衣も髪も乱れておらず、文机の上も片付いたままになっている。
    - id: numbness-signs
      statement: 唇のまわりと指先に、しびれが出たときの跡が残っている。
    - id: single-glass
      statement: 文机に、飲みかけのグラスが一つだけ置かれている。誰かと酌み交わした跡は無い。
    # 後継者指定を知ってから読むと意味が変わる草案。順序を作るために前提を置く。
    - id: heir-draft
      statement: 硯箱の下に、書き直しかけの遺言書の草案が伏せてある。後継者の項に線が引かれ、余白に書き込みがある。
      requires:
        evidences:
          - will-record
briefing: |-
  ——事件の記録を読み上げます。

  十月十四日、午後七時。山あいの老舗旅館「月見荘」の離れに、四人の男女が集まりました。観光客で賑わう本館から少し離れたその建物で、女将の高瀬涼子が開いたのは、ごく内輪の夕食会です。

  高瀬涼子は穏やかな女将で、長く働く従業員や常連客から慕われていました。旅館のしきたりや家のことには頑固な一面もありましたが、誰かが困れば自分の仕事を後回しにして世話を焼く人物として知られていました。

  この日は、十七年前に亡くなった涼子の夫の法要を兼ねた夜でもありました。招かれた三人はいずれも月見荘や高瀬家と長い関わりを持つ人物です。昔話を交えながら食事は進み、表向きには穏やかな時間が流れていました。

  女将の高瀬涼子は、夫の死後も一人で月見荘を守り、宿を現在の形まで維持してきました。経営や家の将来について自分で判断することが多く、集まった三人とも仕事や私生活を通じて深い付き合いがありました。

  午後八時三十分ごろ、離れの書斎で涼子が倒れているのが見つかります。夕食会に招かれていたのは、税理士の深川誠也、涼子と親しい早坂美月、医師の桐生涼です。

  十七年という時間を共有してきた三人と女将のあいだで、その夜どんな会話が交わされていたのか。夕食会の始まりから書斎での発見まで、三人から話を聞いてください。
