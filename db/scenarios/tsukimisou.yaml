    name: 深川誠也
    publicIntroduction: "気弱で愛想笑いが多い税理士。"
    personality: 気弱で愛想笑いが多い税理士。人当たりは柔らかいが、追い詰められるとしどろもどろになり目が泳ぐ。涼子には昔から頭が上がらない。
    goals:
      - 横領が誰にもバレないまま今夜をやり過ごしたい
      - 自分への疑いをそらすため、19時30分に書斎で涼子と会計の話をしたと思わせたい
