# revelation は「解禁されて初めてカードになる情報」。
# 後継者への焦り（動機）は、後継者指定そのものを知り、遺言書を見つけた後でなければ出さない。
# 順番を守らせるのが requires の役目で、循環していないかはスキーマが静的に検査する。
revelations:
  - id: mizuki-is-heir
    title: 美月は月見荘の後継者
    text: 涼子は数ヶ月前、美月を月見荘の後継者・遺産の受取人に指定していた。
    category: relationship
    subject:
      type: character
      id: mizuki
    sources:
      - type: character
        id: mizuki
        revealCondition: 美月に月見荘の後継者や遺産について尋ね、美月自身が後継者・受取人に指定されていたと認めた。
        requires:
          revelations: []
          evidences: []
    relatedFacts:
      - mizuki-named-heir
  - id: heir-anxiety
    title: 後継者指定への焦り
    text: 涼子は最近、後継者の指定を考え直す可能性を口にしており、美月は指定が覆ることを恐れていた。
    category: motive
    subject:
      type: character
      id: mizuki
    sources:
      - type: character
        id: mizuki
        revealCondition: 後継者指定が見直される可能性や、美月がそれをどう受け止めたかを追及し、美月の焦りが明確に伝わった。
        requires:
          revelations:
            - mizuki-is-heir
