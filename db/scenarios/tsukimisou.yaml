# 月見荘、十七回忌の夜
#
# 事件世界で実際に起きたことは facts と timeline に一度だけ書き、人物からは ID で参照する。
# 同じ事実を人物ごとに文章でコピーしていた頃は、時刻を一箇所直すと他が古いまま残った。
#
# 被害者の高瀬涼子は characters に居ない。プレイヤーが会話できるのは容疑者3人だけで、
# characters の行はそのまま Actor のプロンプトの上限だからである。その結果
# relationships（実在の character しか指せない）では誰も涼子との関係を宣言できないので、
# 涼子への感情は各人の personality 本文に書いてある。三人どうしの関係は原作の記述に
# 無いため、ここでは宣言しない。
#
# このファイルは db/compile-scenario.ts がテーブルの行へ分解する。
# 検証を通さずに DB へ入る経路は無い。

schemaVersion: 1
id: tsukimisou-17th-anniversary
meta:
  title: "十七回忌の客"
  synopsis: "十月十四日、午後七時。老舗旅館「月見荘」の離れに、四人の男女が集まりました。女将の高瀬涼子が、十七年前に亡くなった夫の法要を兼ねて開いた、ごく内輪の夕食会です。招かれたのは、涼子と長く関わってきた三人でした。"
  category: 館もの
