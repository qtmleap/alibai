# ゲームマスターがプレイヤーに読み上げる事件の記録。段落は空行で区切り、UIが1段落ずつ開く。
#
# ここに書いてよいのは、プレイヤーが聞き込みを始める前に知っていて当然のことだけ。
# 毒物の種類・入手経路・誰がいつ書斎に入ったかは書かない。読んだ時点で犯人が
# 絞れてしまったら、この10分は聞き込みではなく答え合わせになる。
#
# solution.secretKeywords がここに混ざっていないかはスキーマが検査する。
victim:
