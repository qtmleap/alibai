solution:
  culprit: katase
  summary: 犯人は片瀬真央。架空の講師費を塚本に見抜かれ、書斎へ呼び出された片瀬はゲームの途中で談話室を離れた。間宮がその間だけ青席に座ってゲームを続けたため、青席の得点は途切れず、吉岡が後から清書した得点表にも連続した数字が残った。だが得点表は人物ではなく席を記録するものだった。藤堂は21時25分ごろ片瀬が廊下から戻ってくるところを見ており、間宮も代打を認める。得点表の連続性は片瀬の在席証明ではない。
  method: ゲーム中に自分の席を別人へ任せ、席単位で続く得点記録を人物の連続アリバイに見せかけて書斎へ向かった
  motive: 架空の外部講師費を計上した不正が発覚し、責任追及を恐れたため
  secretKeywords:
    - 犯人は片瀬
    - 片瀬が塚本を襲
    - 片瀬が青席を離れ
    - 得点表は片瀬の在席証明ではない
