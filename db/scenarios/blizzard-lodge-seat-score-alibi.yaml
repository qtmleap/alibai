briefing: |-
  ——事件の記録を読み上げます。

  山あいの研修ロッジでは、その日まで数日間にわたる小規模な研修会が開かれていました。参加者の多くは日中のうちに帰路につき、夜には翌朝の撤収や精算を担当する運営関係者だけが残っていました。談話室には使い終えた教材や飲み物が残り、長かった研修の最後の夜らしい空気が漂っていました。

  運営責任者の塚本誠は、研修全体の進行と施設側との調整を任されていた人物です。参加者が帰ったあとも書類や会計の確認が残っており、その夜は書斎を使って事務仕事を続けていました。

  塚本誠は段取りに厳しい反面、参加者や若いスタッフの面倒見がよい責任者として知られていました。急な予定変更でも最後まで現場に残ることが多く、運営側からは「困ったときに頼れる人」として慕われていました。

  夕方から降り始めた雪は夜になって吹雪へ変わり、ロッジへ続く道路は通行止めとなります。送迎車も動かせず、外部の者が新たに出入りできる状況ではありませんでした。

  午後九時四十分、書斎で塚本誠が死亡しているのが見つかります。そのときロッジに残っていた関係者は、企画担当の片瀬真央、講師の藤堂凛、事務担当の吉岡蓮、設備係の間宮葵の四人です。

  研修が終わり、気の緩み始めたはずの夜に何が起きたのか。四人から、夕食後から発見までの出来事を聞いてください。
