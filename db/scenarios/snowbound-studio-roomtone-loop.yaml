meta:
  title: "ノース・レイクに冬が来た"
  synopsis: "午後十一時十八分、山中の録音所「ノース・レイク」の編集室で、音楽監督の冬木圭介が死亡しているのが見つかりました。午後十時半から吹雪で道路が閉鎖され、館内には冬木を含め五人しかいませんでした。"
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 18
victim:
  name: 冬木圭介
  introduction: 録音所「ノース・レイク」音楽監督
  foundAt: 23:18
  foundIn: 編集室
  causeOfDeath: 事件性のある外傷による死亡
  findings:
    - id: victim-state
      statement: 冬木圭介は編集室で倒れており、その場で死亡が確認されている。
    - id: victim-motive-material
      statement: 遺体のそばには「未公開音源の複製履歴」に関わる資料が残されている。
places:
