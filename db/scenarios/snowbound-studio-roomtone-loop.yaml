  - id: makimura-damaged-microphone
    statement: 牧村葉月は高価なマイクを落として傷つけたことを報告せず、別のケースへ戻していた
    kind: other
    secret: true
  - id: body-found-2318
    statement: 23時18分、鷹野徹が編集室で冬木圭介の死を発見した
    kind: observation

