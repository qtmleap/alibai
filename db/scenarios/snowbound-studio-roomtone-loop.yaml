solution:
  culprit: manabe
  summary: 犯人は真鍋伊織。未公開音源を外部へ渡していたことを冬木に見抜かれ、翌朝に制作会社へ報告され機材アクセス権を止められる予定だった。真鍋は22時46分に四十七秒の室内音をループ素材にし、22時50分から第2ブースの録音機へ繰り返し入力した。22時53分ごろ監視席を離れ、22時58分には牧村が編集室へ続く機材廊下で真鍋を目撃している。23時02分ごろ冬木を襲い、23時08分ごろ監視席へ戻った。二十分の収録は途切れていなかったが、空調音や小さな物音まで四十七秒ごとに完全一致しており、生の収録ではなかった。
  method: 四十七秒の室内音を録音機へループ入力し、連続収録を在席証明に見せかけて監視席を離れ、編集室で冬木を襲った後に戻った
  motive: 未公開音源の無断持ち出しが発覚し、翌朝の報告で機材アクセス権と仕事上の信用を失うことを恐れたため
  requiredFacts: [manabe-copied-masters, fuyuki-planned-report, manabe-made-roomtone-loop, loop-routed-to-recorder, recording-repeats-identically, manabe-left-booth, makimura-saw-manabe, manabe-killed-fuyuki]
  secretKeywords:
    - 犯人は真鍋
    - 真鍋が犯人
    - 真鍋が冬木を襲
    - 私が冬木を襲
    - ループ音声でアリバイを偽装
quality:
  expectedQuestionCount:
    min: 13
    max: 26
  requiredEvidence:
    min: 3
  redHerrings: [shirase-broke-embargo, takano-hid-contract-change, makimura-damaged-microphone]
  notes: 「音が聞こえた」「録音が続いていた」という二重の客観性を、同じ四十七秒のループが同時に説明してしまう構造。波形の反復だけでなく牧村の目撃を合わせ、真鍋の実際の移動を確定させる。
