    kind: motive
    secret: true
  - id: manabe-made-roomtone-loop
    statement: 22時46分、真鍋伊織は第2ブースで録った四十七秒の室内音を連続再生できるループ素材にした
    kind: physical
    secret: true
  - id: loop-routed-to-recorder
    statement: 22時50分から23時10分まで、第2ブースの録音機には生マイクではなく四十七秒のループ素材が入力されていた
    kind: physical
