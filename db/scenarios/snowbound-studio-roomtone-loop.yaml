    label: 二十二時五十八分の機材廊下目撃
    description: 牧村は22時58分ごろ、編集室へ続く機材廊下で真鍋を見ている。
    reveal:
      condition: 牧村に22時50分から23時ごろ機材廊下で誰を見たか尋ねたら開示する。
    sources:
      - { type: character, id: makimura }
    supports: [makimura-saw-manabe]
    contradicts: ["lie:manabe-booth-alibi"]
  - id: master-copy-history
    label: 未公開音源の複製履歴
    description: 真鍋の作業端末から未公開マスターが外部媒体へ複製され、冬木が翌朝のアクセス停止を記したメモを残している。
    reveal:
      condition: 真鍋か鷹野に冬木が事件前に調べていた音源データの持ち出しについて尋ね、複製履歴を追及したら開示する。または遺体・現場を調べ、「未公開音源の複製履歴」に関わる資料を確認したら開示する。
    sources:
