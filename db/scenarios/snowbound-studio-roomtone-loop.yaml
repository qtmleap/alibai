    name: 第2ブース監視席
    shortName: 監視席
    introduction: 録音入力を切り替えるパッチ盤と収録端末の席
    situation: パッチ盤と収録端末の電源が残っている
    findings:
      - id: recorder-loop-route
        statement: 第2ブースの録音入力は生マイクではなく、四十七秒の音声素材を繰り返す経路へ切り替えられている。
      - id: waveform-identical
        statement: 収録波形は空調音や小さな物音まで四十七秒ごとに同じ形を繰り返している。
briefing: |-
  ——事件の記録を読み上げます。

  山中の録音所「ノース・レイク」は、外の騒音から離れて制作に集中できる環境を売りにしたスタジオです。宿泊設備も備えており、アーティストと制作スタッフが数日間こもって一枚の作品を仕上げることもあります。その夜は長時間の収録が続いた最終盤でした。

  音楽監督の冬木圭介は、作品全体の方向性を決める責任者です。演奏や歌だけでなく、録音の仕上がりや制作日程にも細かく意見を出す人物で、その日も遅くまで編集作業に立ち会っていました。

  冬木圭介は音に対して非常に厳格な音楽監督で、わずかな妥協も許さないことで評判でした。要求は高いものの演奏家の長所を見抜くことにも長け、その耳と情熱を尊敬して仕事を続けるスタッフも少なくありませんでした。

  午後十時半から吹雪が激しくなり、山道は閉鎖されます。録音所には冬木を含め五人だけが残り、全員が朝まで施設内で過ごすことになりました。

  午後十一時十八分、編集室で冬木圭介が死亡しているのが発見されます。事情を聞けるのは、録音技師の真鍋伊織、歌手の白瀬環、制作進行の鷹野徹、機材担当の牧村葉月です。

  雪の夜、収録と編集が続くスタジオで何が起きたのか。四人から制作中の出来事と冬木の様子を聞いてください。
