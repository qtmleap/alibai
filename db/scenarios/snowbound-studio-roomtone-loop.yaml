characters:
  - id: manabe
    name: 真鍋伊織
    publicIntroduction: "録音所の録音技師。"
    personality: 音の差異に異常なほど敏感で、自分の技術に強い自負を持つ録音技師。説明は専門的だが、連続した収録ファイルを在席の客観証拠として押し出し、入力経路の話になると曖昧になる。
    goals:
      - 未公開音源を外部へ渡したことを隠したい
      - 二十分の連続録音を、自分が監視席に居続けた証拠として通したい
    knowledge: [manabe-engineer, recording-repeats-identically, body-found-2318]
    secrets:
      - fact: manabe-copied-masters
        disclosure: pressured
      - fact: fuyuki-found-master-leak
        disclosure: pressured
      - fact: fuyuki-planned-report
        disclosure: pressured
      - fact: manabe-made-roomtone-loop
        disclosure: pressured
      - fact: loop-routed-to-recorder
        disclosure: pressured
      - fact: manabe-left-booth
        disclosure: never
      - fact: manabe-killed-fuyuki
        disclosure: never
      - fact: manabe-returned-booth
        disclosure: never
    lies:
      - id: manabe-booth-alibi
        about: manabe-left-booth
        claim: 22時50分から23時10分まで第2ブースの監視席を離れていません。録音が二十分連続しているのが証拠です
        strategy: maintain-until-contradicted
      - id: manabe-live-input
        about: loop-routed-to-recorder
        claim: あの収録はずっと第2ブースの生マイク入力でした。ループ素材を録音機へ回してはいません
        strategy: maintain-until-contradicted
    memories:
      - id: access-stop-threat
        detail: 冬木に「朝になったら会社へ報告して、君のアクセス権を止める」と言われ、過去の持ち出しまで全部調べられると思った。
    relationships:
      - character: makimura
        relation: 機材管理の同僚
        attitude: 配線には詳しいので、自分の入力経路を見抜かれるのを警戒している
      - character: takano
        relation: 制作進行
        attitude: 金の処理ばかり気にして音を理解しない人だと思っている
  - id: shirase
    name: 白瀬環
    publicIntroduction: "感覚的に物事を捉える歌手。"
    personality: 感覚的に物事を捉える歌手。公開前情報を知人へ話したことを隠したいが、廊下で聞いた音については率直に答える。音が聞こえたため最初は真鍋が中にいると思い込んでいる。
    goals:
      - 新曲情報を知人へ漏らしたことを隠したい
      - 22時56分ごろ第2ブースから音が聞こえたことは正確に話したい
    knowledge: [shirase-singer, shirase-heard-loop, body-found-2318]
    secrets:
      - fact: shirase-broke-embargo
        disclosure: pressured
    lies:
      - id: shirase-no-leak
        about: shirase-broke-embargo
        claim: 公開前の曲について外の人に話したことはありません
        strategy: maintain-until-contradicted
    memories:
      - id: booth-sound-memory
        detail: 22時56分ごろ、ブース前を通ったとき空調の低い音と椅子が小さく鳴るような音が続いていて、収録中だと思って静かに通り過ぎた。
    relationships:
      - character: manabe
        relation: 録音担当
        attitude: 技術は信頼しているが、音源データの扱いには神経質すぎると感じている
  - id: takano
    name: 鷹野徹
    publicIntroduction: "録音所の制作進行。"
    personality: 現実的で数字に強い制作進行。契約処理の付け替えが露見するのを恐れているため冬木との事務的な衝突を小さく見せるが、音響機器の細部には疎い。
    goals:
      - 制作費の付け替えを隠したい
      - 冬木と契約処理で揉めていたことを事件と結びつけられたくない
    knowledge: [takano-production, body-found-2318]
    secrets:
      - fact: takano-hid-contract-change
        disclosure: pressured
    lies:
      - id: takano-no-cost-shift
        about: takano-hid-contract-change
        claim: 制作費の項目を承認前に付け替えたことはありません
        strategy: maintain-until-contradicted
    memories:
      - id: fuyuki-angry-at-manabe
        detail: 事件前、冬木が真鍋に「これは技術の問題じゃなく信用の問題だ」と低い声で言っているのを聞いた。
    relationships:
      - character: shirase
        relation: 出演者と制作進行
        attitude: 情報管理が甘いところを心配している
  - id: makimura
    name: 牧村葉月
    publicIntroduction: "配線と機材配置を記憶するのが得意な機材担当。"
    personality: 配線と機材配置を記憶するのが得意な機材担当。高価なマイクを傷つけたことを隠したいが、パッチ盤の入力経路と廊下で見た真鍋については正確に話せる。
    goals:
      - マイクを落として傷つけたことを隠したい
      - 22時58分の真鍋の目撃と入力経路は正確に説明したい
    knowledge: [makimura-equipment, makimura-saw-manabe, recording-repeats-identically, body-found-2318]
    secrets:
      - fact: makimura-damaged-microphone
        disclosure: pressured
    lies:
      - id: makimura-no-damage
        about: makimura-damaged-microphone
        claim: 今夜、機材を落としたり傷つけたりしていません
        strategy: maintain-until-contradicted
    memories:
      - id: patch-bay-route
        detail: 事件後に第2ブースのパッチ盤を見ると、生マイクではなく編集機側の再生出力が録音機へ戻されていたのが気になった。
    relationships: []

