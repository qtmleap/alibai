    name: 白瀬環
    role: witness
    publicIntroduction: "感覚的に物事を捉える歌手。"
    personality: 感覚的に物事を捉える歌手。公開前情報を知人へ話したことを隠したいが、廊下で聞いた音については率直に答える。音が聞こえたため最初は真鍋が中にいると思い込んでいる。
