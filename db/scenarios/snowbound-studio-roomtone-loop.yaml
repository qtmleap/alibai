    reveal:
      condition: 真鍋か牧村に収録ファイルが本当に生マイク入力だったか、波形の反復と入力経路を含めて尋ねたら開示する。または第2ブースの監視席を調べ、録音入力と波形の反復を確認したら開示する。
    sources:
      - { type: character, id: manabe }
      - { type: character, id: makimura }
      - { type: location, id: patch-bay }
    supports: [manabe-made-roomtone-loop, loop-routed-to-recorder, recording-repeats-identically]
    contradicts: ["lie:manabe-booth-alibi", "lie:manabe-live-input"]
