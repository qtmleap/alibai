schemaVersion: 1
id: snowbound-studio-roomtone-loop
meta:
  title: 雪籠りの録音所、四十七秒の無音
  synopsis: 吹雪で孤立した山中の録音スタジオで音楽監督が死亡した。録音技師は「事件時刻には防音ブースで連続収録を監視していた」といい、記録には確かに二十分途切れない音声が残る。だが無音に近い部屋の響きまで、四十七秒ごとに同じ形を繰り返していた。
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 18
  tags: [録音スタジオ, 吹雪, 音声, ループ]
briefing: |-
  ——事件の記録を読み上げます。

  午後十一時十八分、山中の録音所「ノース・レイク」の編集室で、音楽監督の冬木圭介が死亡しているのが見つかりました。午後十時半から吹雪で道路が閉鎖され、館内には冬木を含め五人しかいませんでした。

  録音技師の真鍋伊織は「午後十時五十分から十一時十分まで第2ブースの連続録音を監視していた」と話しています。収録ファイルはその二十分間、一度も止まっていません。歌手の白瀬は廊下でブースから音が流れていたのを聞いたとも証言しています。

  ほかに残っていたのは、歌手の白瀬環、制作進行の鷹野徹、機材担当の牧村葉月。音が残っていることと、その音を誰かがその場で生み続けていたことは同じなのか。録音所の中だけで答えを探してください。
floorPlan: null
