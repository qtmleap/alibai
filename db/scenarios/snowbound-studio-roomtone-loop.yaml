    role: witness
    publicIntroduction: "配線と機材配置を記憶するのが得意な機材担当。"
    personality: 配線と機材配置を記憶するのが得意な機材担当。高価なマイクを傷つけたことを隠したいが、パッチ盤の入力経路と廊下で見た真鍋については正確に話せる。
    goals:
      - マイクを落として傷つけたことを隠したい
      - 22時58分の真鍋の目撃と入力経路は正確に説明したい
    knowledge: [makimura-equipment, makimura-saw-manabe, recording-repeats-identically, body-found-2318]
    secrets:
      - fact: makimura-damaged-microphone
        disclosure: pressured
    lies:
