        disclosure: pressured
      - fact: fuyuki-found-master-leak
        disclosure: pressured
      - fact: fuyuki-planned-report
        disclosure: pressured
      - fact: manabe-made-roomtone-loop
        disclosure: pressured
      - fact: loop-routed-to-recorder
        disclosure: pressured
      - fact: manabe-left-booth
        disclosure: never
      - fact: manabe-killed-fuyuki
        disclosure: never
      - fact: manabe-returned-booth
        disclosure: never
    lies:
