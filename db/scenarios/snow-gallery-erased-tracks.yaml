meta:
  title: 白庭彫刻館、雪の夜
  synopsis: "午後八時五十分、吹雪で山道が閉ざされた白庭彫刻館の離れ展示室で、館長の青沼卓が死亡しているのが見つかりました。館内に残っていたのは学芸員の倉田真帆、施設員の安西雄、彫刻家の江波涼の三人だけです。"
  category: クローズドサークル
  difficulty: 4
  estimatedMinutes: 15
  tags: [雪, 美術館, 足跡, 時系列]
victim:
  name: 青沼卓
  introduction: 白庭彫刻館館長
briefing: |-
  ——事件の記録を読み上げます。

  白庭彫刻館は、山林の中に建つ小さな私設美術館です。母屋の展示棟とは別に、庭を挟んだ離れ展示室があり、大型作品や企画展示に使われています。雪の季節には来館者が少なく、閉館後の館内は職員と作家だけになることもあります。

  館長の青沼卓は、展示方針を決めるだけでなく、作家との交渉や作品の搬入にも自ら関わってきました。その日は新しい展示の準備が続いており、閉館後も関係者が館内に残っていました。

  青沼卓は寡黙で、作品そのものに語らせることを好む館長として知られていました。展示や保存には厳格でしたが、作家の制作時間を尊重する姿勢は一貫しており、彫刻家や職員からは信頼される人物でした。

  夕方から雪が強まり、夜には山道が通行できなくなります。敷地内の移動にも雪への注意が必要となり、外部から新たに人が訪れる状況ではありませんでした。

  午後八時五十分、離れ展示室で青沼卓が死亡しているのが見つかりました。その夜に残っていたのは、学芸員の倉田真帆、施設員の安西雄、彫刻家の江波涼です。

  雪に包まれた彫刻館で、閉館後の三人は何をしていたのか。青沼とのやり取りと、発見までの出来事を聞いてください。
