solution:
  culprit: kurata
  summary: 犯人は倉田真帆。発見時に足跡がなかったことは、20時10分の降雪開始以降ずっと誰も離れへ渡っていない証明ではない。倉田は20時17分ごろ離れへ渡り、20時20分ごろ青沼を襲った。その後20時26分、安西が排水口確認のため通路の雪を一度掃き直したため、それ以前の足跡は雪面ごと消えた。さらに降雪が続き、発見時には除雪後の通路にも新しい雪が積もっていた。20時31分には安西が母屋裏口で倉田を目撃している。青沼は倉田による作品来歴記録の書き換えを翌日の理事会で報告する予定だった。無足跡という証拠の「保存開始時刻」を見誤らないことが核心である。
  method: 降雪中に離れへ渡った後、施設員の除雪作業によってそれ以前の足跡が失われたことを利用し、発見時の無傷の雪面を自分の不在証明として主張した
  motive: 作品来歴記録の不適切な書き換えを翌日の理事会で公にされ、学芸員としての信用と職を失うことを恐れたため
  requiredFacts: [kurata-crossed-2017, anzai-cleared-path-2026, snow-covered-after-clearing, anzai-saw-kurata-2031, provenance-forgery-found, board-report-next-day, kurata-killed-aoonuma]
  secretKeywords:
    - 犯人は倉田
    - 倉田が犯人
    - 倉田が青沼を襲
    - 私が青沼を襲
    - 除雪で足跡が消え
quality:
  expectedQuestionCount:
    min: 11
    max: 22
  requiredEvidence:
    min: 3
  redHerrings: [anzai-broke-sensor, enami-damaged-model]
  notes: 古典的な無足跡問題を、特殊な移動手段ではなく証拠保存の時間窓で解く。発見時の状態が犯行時から連続していたという思い込みを崩す。
