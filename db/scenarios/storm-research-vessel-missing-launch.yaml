briefing: |-
  ——事件の記録を読み上げます。

  海洋調査船「みなも」は、沿岸から離れた海域で地質や海水の観測を行う研究船です。航海中は研究者と乗組員が同じ船内で生活し、天候が悪化しても簡単には陸へ戻れません。その航海では数日間の調査を終え、観測データの整理が始まっていました。

  主任研究者の瀬尾俊は、今回の調査計画を率いる人物でした。採取した試料や観測結果をまとめる責任を持ち、研究員だけでなく船の運航担当とも日常的に連携していました。

  瀬尾俊は海上調査に長く携わった研究熱心な主任で、荒天時の判断には厳格な人物でした。研究者にも船員にも同じ基準を求めましたが、危険な作業では自分も現場に立つため、船内では頼られる存在でした。

  夕方から海が荒れ、みなもは調査を中止して退避航行に入ります。暴風海域では他船との接触もなく、甲板作業も必要最小限に制限されました。乗船者は船内で天候の回復を待つ状態です。

  午後八時四十分、解析室で瀬尾俊が死亡しているのが発見されます。事情を聞ける主な関係者は、研究員の狩谷琴音、機関担当の水城明、通信担当の野々村岳です。

  揺れる船内で、調査中止から発見までに何が起きたのか。三人から瀬尾の最後の仕事と船内の出来事を聞いてください。
