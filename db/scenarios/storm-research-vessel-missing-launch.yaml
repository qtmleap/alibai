solution:
  culprit: kariya
  summary: 犯人は狩谷琴音。発見時に小型作業艇がなかったため、事件後に外部犯人が艇で逃げたように見えるが、艇は19時42分に既に失われていた。19時48分の甲板異常メモには狩谷自身の署名があり、狩谷は事件前から作業艇がないことを知っていた。その後19時56分には野々村が瀬尾本人と通話しているため、作業艇消失は瀬尾の死より前である。20時22分には水城が解析室側から戻る狩谷を目撃している。瀬尾は狩谷による共同研究データの不適切な外部提出を次の寄港後に報告する予定だった。狩谷が知っているはずの時系列を隠して外部犯人説を強調したことが重要な矛盾となる。
  method: 事件前から失われていた作業艇を事件後の逃走手段だったように扱い、船内三人以外の犯人が存在する可能性を作ったうえで、自分の解析室への出入りを隠した
  motive: 共同研究データを単独成果として外部提出しようとした件を、瀬尾が次の寄港後に所属機関へ報告する予定だったため
  requiredFacts: [launch-lost-1942, kariya-saw-launch-loss, launch-note-signed, seo-alive-1956, launch-gone-before-death, mizuki-saw-kariya-2022, seo-report-next-port, kariya-killed-seo]
  secretKeywords:
    - 犯人は狩谷
    - 狩谷が犯人
    - 狩谷が瀬尾を襲
    - 私が瀬尾を襲
    - 作業艇で外部犯人を偽装
quality:
  expectedQuestionCount:
    min: 11
    max: 22
  requiredEvidence:
    min: 3
  redHerrings: [mizuki-hid-maintenance-delay, nonomura-private-message]
  notes: 漂流船の歴史的ミステリに見られる「欠けた小舟が人の移動を意味する」という連想を反転。消失物の時刻を確定し、容疑者がその時刻を知っていた点まで追う。
