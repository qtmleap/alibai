briefing: |-
  ——事件の記録を読み上げます。

  沖合の小島に立つ夕凪灯台では、少人数の職員が交代で設備を守っています。自動化が進んだ現在でも、荒天時の点検や通信、発電設備の確認には人の手が必要です。補給船が来ない日は、島にいる者だけで一日の仕事を回さなければなりません。

  主任灯台守の倉橋徹は、長年この灯台に勤めてきた責任者でした。海況の変化や設備の癖を熟知し、若い職員への指導も担当していました。その日も天候悪化に備え、通常より念入りな確認を進めていました。

  倉橋徹は寡黙で実直な灯台守として知られ、荒天時にも慌てない人物でした。仕事の手順には厳格でしたが、若い補助員の失敗を黙って支える一面があり、島では頼られる主任として信頼されていました。

  夕方から風雨が強まり、補給船は接岸を断念しました。波は防波堤を越えるほど高くなり、島外との往来は止まります。灯台に残った者たちは、翌朝まで勤務を続ける予定でした。

  午後八時五十分、整備室で倉橋徹が死亡しているのが発見されます。島にいた関係者は、当直員の鳥越玲、通信担当の橋場圭、補助員の森下透です。

  暴風の夜、限られた人数で灯台を守る中で何が起きたのか。三人からその日の当直と倉橋の様子を聞いてください。
