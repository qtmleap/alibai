    statement: 鳥越玲は20時24分ごろ整備室で倉橋徹を襲い死亡させた
    kind: truth
    secret: true
  - id: fuel-report-next-day
    statement: 倉橋徹は翌日の補給報告で、燃料在庫の不自然な不足を本部へ報告する予定だった
    kind: motive
    secret: true
  - id: torigoe-hid-fuel-shortage
    statement: 鳥越玲は自分の記録ミスによる燃料在庫の不足を帳簿上で先送りしていた
    kind: motive
    secret: true
  - id: hashiba-private-channel
    statement: 橋場圭は勤務中、規定外の個人的な無線受信をしていた
    kind: other
    secret: true
  - id: morishita-slept-on-duty
    statement: 森下透は発電室当番中に短時間眠っていた
    kind: other
    secret: true
  - id: body-found-2050
    statement: 20時50分、森下透が整備室で倉橋徹の死を発見した
    kind: observation
