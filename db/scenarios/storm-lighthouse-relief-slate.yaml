schemaVersion: 1
id: storm-lighthouse-relief-slate
meta:
  title: 暴風の灯台、濡れた外套と当直板
  synopsis: 補給船が来られない暴風の孤島灯台で主任灯台守が死亡した。当直員は「西側の設備を点検していた」と主張し、濡れた外套と点検時刻の書かれた当直板まで残っている。だが、記録された時刻が本当に作業時刻を意味するとは限らない。三人だけの灯台で、記録と目撃のずれを追え。
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 15
  tags: [灯台, 暴風, 記録, 時刻]
victim:
  name: 倉橋徹
  introduction: 夕凪灯台主任灯台守
briefing: |-
  ——事件の記録を読み上げます。

  午後八時五十分、暴風で補給船の接岸が不可能となった夕凪灯台の整備室で、主任灯台守の倉橋徹が死亡しているのが見つかりました。島にいるのは当直員の鳥越玲、通信担当の橋場圭、補助員の森下透の三人だけです。

  鳥越は午後八時十分から三十五分まで西側設備の点検に出ていたと話しています。当直板には「20:12 西設備確認」という記載があり、鳥越の外套も雨で濡れていました。

  橋場はその時間帯に通信室、森下は発電室にいたと主張しています。暴風の灯台では、誰がどの記録をいつ書いたのかが重要です。
floorPlan: null
facts:
  - id: torigoe-duty-keeper
    statement: 鳥越玲は事件夜の設備当直を担当する灯台守である
    kind: other
  - id: hashiba-radio
    statement: 橋場圭は灯台の通信と気象連絡を担当している
    kind: other
  - id: morishita-assistant
    statement: 森下透は発電設備と備品管理を補助する職員である
    kind: other
  - id: west-gate-sealed
    statement: 18時40分、暴風警戒のため西側設備へ続く外扉は封鎖確認され、翌朝まで開けない運用になった
    kind: physical
  - id: west-seal-intact
    statement: 事件発見後も西側外扉の封鎖確認票は切れておらず、20時台に扉が開いた形跡はない
    kind: physical
  - id: slate-entry-2012
    statement: 当直板には「20:12 西設備確認、異常なし」と記載されている
    kind: physical
  - id: slate-written-after-round
    statement: 夕凪灯台では巡回中に当直板へ書かず、巡回後に制御室で時刻と内容をまとめて転記する運用である
    kind: truth
  - id: torigoe-copied-panel-reading
    statement: 鳥越玲は当直板の西設備欄に、制御盤に残っていた20時12分の自動計測値を転記した
    kind: truth
    secret: true
  - id: torigoe-coat-wet-before
    statement: 鳥越玲の外套は19時台の東側巡回で既に濡れていた
    kind: truth
    secret: true
  - id: hashiba-saw-torigoe-2021
    statement: 20時21分ごろ、橋場圭は整備室近くの内階段で鳥越玲とすれ違った
    kind: observation
  - id: kurahashi-death-2024
    statement: 20時24分ごろ、倉橋徹は整備室で襲われ死亡した
    kind: truth
    secret: true
