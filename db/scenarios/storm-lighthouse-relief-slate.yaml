    facts: [kurahashi-death-2024, torigoe-killed-kurahashi]
    description: 鳥越が整備室で倉橋を襲い、倉橋は死亡する。
  - id: discovery
    at: "20:50"
    participants: [morishita, torigoe, hashiba]
    facts: [body-found-2050, west-seal-intact]
    description: 森下が倉橋の死を発見し、西側外扉の封鎖も保たれていることが確認される。
characters:
