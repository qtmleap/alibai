solution:
  culprit: torigoe
  summary: 犯人は鳥越玲。当直板の「20:12 西設備確認」は現場でその時刻に書かれた記録ではなく、巡回後に制御盤の自動計測値などをまとめて転記する運用だった。しかも西側外扉の封鎖確認票は事件後も切れておらず、鳥越が20時台に西側へ出たという説明は成立しない。濡れた外套も19時台の東側巡回で既に濡れていた。20時21分には橋場が整備室近くの内階段で鳥越を目撃しており、鳥越は20時24分ごろ倉橋を襲った。倉橋は翌日、鳥越が先送りしていた燃料在庫の不足を本部へ報告する予定だった。当直板、外套、時刻という三つの一見独立した証拠が、実際にはどれも鳥越の西側滞在を証明していないことが核心である。
  method: 制御盤の過去の計測時刻を当直板へ転記し、以前から濡れていた外套も利用して西側巡回のアリバイを作ったうえで、整備室で倉橋を襲った
  motive: 翌日の本部報告で、自分が先送りしていた燃料在庫の不足と記録ミスが明るみに出るのを恐れたため
  secretKeywords:
    - 犯人は鳥越
    - 鳥越が犯人
    - 鳥越が倉橋を襲
    - 私が倉橋を襲
    - 当直板でアリバイを偽装
