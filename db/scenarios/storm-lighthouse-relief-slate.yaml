meta:
  title: "夕凪という名の嵐"
  synopsis: "午後八時五十分、暴風で補給船の接岸が不可能となった夕凪灯台の整備室で、主任灯台守の倉橋徹が死亡しているのが見つかりました。島にいるのは当直員の鳥越玲、通信担当の橋場圭、補助員の森下透の三人だけです。"
  category: クローズドサークル
  difficulty: 5
