          evidences: [slate-procedure]
      - type: character
        id: morishita
        revealCondition: 森下に西側外扉の封鎖状態と当直板の運用を確認し、鳥越の巡回説明と両立しないことを指摘した。
        requires:
          revelations: []
          evidences: [west-door-seal]
    relatedFacts: [slate-written-after-round, west-gate-sealed, west-seal-intact, torigoe-copied-panel-reading]
