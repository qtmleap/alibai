schemaVersion: 1
id: snowbound-farm-morning-chores
meta:
  title: 雪籠り農園、朝支度の痕跡
  synopsis: 猛吹雪で孤立した高原農園で、経営者・佐久間隆志が事務室で死亡しているのが見つかった。朝には台所の灯りがつき、家畜の世話も済んでいたため、皆は佐久間が夜を越して生きていたと思っている。だが「朝の仕事が済んでいる」ことと「佐久間が朝まで生きていた」ことは同じではない。
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 15
  tags: [雪, 農園, 時系列, 生活痕]
briefing: |-
  ——事件の記録を読み上げます。

  午前七時十分、雪に閉ざされた高原農園の事務室で、経営者の佐久間隆志が死亡しているのが発見されました。夜半から猛吹雪となり、農園へ通じる一本道は完全に塞がれています。

  農園にいたのは三人。農場主任の冬木紬、佐久間の姪で経理を手伝う佐久間希、設備担当の久世圭太です。

  奇妙なのは朝の痕跡です。六時前には台所の灯りがつき、家畜の朝飼いも終わっていました。佐久間は毎朝誰より早く起きてその作業をする人物でした。三人はそのため、少なくとも明け方までは佐久間が生きていたと考えています。

  ただし、誰もその朝に佐久間本人と会話をしてはいません。誰が何を見て、何を勝手に補ったのかを切り分けてください。
