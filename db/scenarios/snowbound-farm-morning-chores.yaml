solution:
  culprit: fuyuki
  summary: 冬木紬は出荷代金の流用を佐久間に見抜かれ、翌朝に帳簿を再確認されることを恐れた。前夜22時台に事務室へ向かい佐久間を襲った後、明け方に佐久間が毎朝行っていた家畜の世話を代わりに済ませ、台所にも人が起きているような痕跡を残した。希は灯りを見ただけで佐久間本人を確認しておらず、朝飼いの作業板にも佐久間が毎朝残す時刻の記入がない。さらに六時すぎの冬木の長靴には外へ出た直後の雪解け水と飼料庫の藁が付いており、「朝まで部屋にいた」という説明と矛盾する。朝の生活痕は佐久間の生存証明ではなく、犯行時刻を遅く見せるための偽装だった。
  method: 前夜に事務室で佐久間を襲った後、明け方に本人の朝の習慣を代行して生活痕を残し、死亡時刻を朝方だと思わせた
  motive: 出荷代金の流用が発覚し、翌朝の帳簿再確認で不正が確定することを恐れたため
  requiredFacts: [fuyuki-diverted-sales, sakuma-confronted-fuyuki, kuze-saw-fuyuki-office-side, fuyuki-killed-sakuma, fuyuki-did-morning-chores, feed-board-magnet-moved, fuyuki-boots-wet-straw]
  secretKeywords:
    - 犯人は冬木
    - 冬木が佐久間を襲
    - 冬木が朝の世話を代行
    - 朝支度で死亡時刻を偽装
quality:
  expectedQuestionCount:
    min: 10
    max: 22
  requiredEvidence:
    min: 3
  redHerrings: [nozomi-hid-debt, kuze-generator-secret]
  notes: 朝の生活痕を生存証明とみなす思い込みを崩す事件。朝の痕跡だけでは冬木を特定できず、22時台の目撃、長靴、帳簿の動機を合わせて犯人を絞る。