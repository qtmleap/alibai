solution:
  culprit: mizuki
  summary: 犯人は水城奈央。修復費の架空請求を高瀬に見つけられ、翌朝までの説明を求められたことから高瀬を襲った。その後、水城は自分が設計した仮設試験線を利用し、21時20分に塔へ入らず鐘を鳴らした。三人は毎晩の習慣から高瀬本人が鐘を鳴らしたと解釈したが、誰もその時刻の高瀬を見ていない。工事系統図と聖歌席裏に残ったタグから、鐘は鍵なしでも鳴らせたと分かる。鐘の音は時刻の手掛かりではあっても、高瀬の生存証明ではなかった。
  method: 高瀬を襲った後、修復工事用の仮設試験線で定刻の鐘を鳴らし、犯行時刻を九時二十分以後だと思わせた
  motive: 修復費の架空請求が発覚し、翌朝の説明と責任追及を恐れたため
  requiredFacts: [mizuki-overbilled, takase-confronted-mizuki, temporary-test-line-exists, mizuki-knew-test-line, mizuki-killed-takase, mizuki-rang-bell-remotely, no-one-saw-takase-bell]
  secretKeywords:
    - 犯人は水城
    - 水城が高瀬を襲
    - 水城が試験線で鐘
    - 鐘で死亡時刻を偽装
quality:
  expectedQuestionCount:
    min: 10
    max: 22
  requiredEvidence:
    min: 3
  redHerrings: [kurokawa-secret-photo, genda-secret-key-copy]
  notes: 「鍵を持つ者しか鐘を鳴らせない」という前提を、工事中の例外で崩す。予備鍵は意図的なミスリードであり、真相の操作経路とは結びつかない。
