briefing: |-
  ——事件の記録を読み上げます。

  山上に建つ古い修道院は、現在では礼拝の場としてだけでなく、地域に残る文書や宗教美術を収蔵する資料館としても使われています。石造りの建物には長い年月の傷みがあり、この冬は一部を閉鎖して修復工事が進められていました。

  館長の高瀬静一は、資料の保存と修道院の公開を長年取り仕切ってきた人物です。古い建物を守りながら一般公開を続けるため、研究者や設計者、管理人との調整に追われていました。その日も閉館後まで館内に残り、修復計画に関する仕事を続けていました。

  高瀬静一は古い文書や建物の保存に熱心で、資料館を長く守ってきた人物です。規則には厳格でしたが、研究者や修復担当の相談には時間を惜しまないことで知られ、山上の施設を支える中心人物として信頼されていました。

  夕方から降り続いた雪は夜になってさらに激しくなり、麓へ続く一本道で雪崩が発生しました。道路は完全に塞がれ、山上の施設は外部から切り離されます。館内に残った者たちは、朝までそこで過ごすほかありませんでした。

  午後九時四十分、館長の高瀬静一が館内で死亡しているのが発見されます。その夜に残っていた関係者は、修復設計士の水城奈央、宗教史研究者の黒川玲、長年この施設に勤める管理人の玄田修です。

  古い修道院と、その保存に関わってきた三人。雪に閉ざされた夜、高瀬の身に何が起きたのか。それぞれから話を聞き、事件までの流れを明らかにしてください。
