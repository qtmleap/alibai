  estimatedDeathAt: "23:48"
  causeOfDeath: 事件性のある外傷による死亡
  findings:
    - id: victim-state
      statement: 大門修一は第2ブースで倒れており、その場で死亡が確認されている。
    - id: victim-motive-material
      statement: 遺体のそばには「大門が保存したスポンサー報告の比較メモ」に関わる資料が残されている。
places:
