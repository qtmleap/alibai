    name: 自動送出室
    shortName: 送出室
    introduction: 収録音源と深夜番組の放送順を管理する送出卓
    situation: 送出卓のモニターと操作盤が待機状態になっている
    findings:
      - id: midnight-queued-audio
        statement: 午前零時の番組冒頭には、事前収録された音声ファイルが自動送出対象として登録されている。
      - id: playout-execution-log
        statement: 実行ログでは、午前零時の音声は人のマイク操作ではなく送出卓から自動再生されている。
briefing: |-
  ——事件の記録を読み上げます。

  FMラジオ局「レイライン」は、深夜帯のトーク番組で多くの固定リスナーを持つ放送局です。日付が変わるころになると昼間のスタッフの大半は帰宅し、局内には放送を支える少人数の制作陣だけが残ります。スタジオの外は静かでも、放送設備は夜通し動き続けています。

  人気パーソナリティの大門修一は、長年この局の看板番組を担当してきました。独特の語り口で知られ、番組内容だけでなくスポンサーや制作方針にも強い影響力を持つ人物でした。その夜も深夜放送のため局に入っていました。

  大門修一は気さくな語り口で長年リスナーに愛されてきたパーソナリティでした。放送中の空気づくりにはこだわりが強く、仕事には厳格な一面もありましたが、局内では番組を背負う中心人物として信頼されていました。

  午前零時を過ぎるころ、局内に残っていたのはごく限られた関係者だけです。番組制作、音響、スポンサー対応と、それぞれ異なる仕事を抱えたまま夜の放送が続いていました。

  午前零時十二分、第二収録ブースで大門修一が死亡しているのが発見されます。事情を聞けるのは、番組プロデューサーの美濃部沙耶、音響技師の久世直人、スポンサー会社の担当者・夏目亮介です。

  日付が変わった直後の放送局で、大門は最後に誰と何を話していたのか。三人から番組前後の出来事を聞いてください。
