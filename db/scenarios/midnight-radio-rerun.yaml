  synopsis: "午前零時十二分、FMラジオ局「レイライン」の第二収録ブースで、人気パーソナリティの大門修一が死亡しているのが見つかりました。局内に残って\
    いたのは、番組プロデューサーの美濃部沙耶、音響技師の久世直人、スポンサー会社の担当者・夏目亮介の三人です。"
  category: 放送局ミステリ
  difficulty: 3
  estimatedMinutes: 10
