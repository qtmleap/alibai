solution:
  culprit: makino
  summary: 犯人は牧野千尋。高額な初版本を複製本とすり替えて本物を転売しようとしていたが、18時37分ごろ水野に見抜かれた。牧野は18時50分ごろ店の奥で水野を襲い、18時56分に発送用の小包を持って店を出た。その後19時08分に郵便窓口で発送し、このレシートを「18時35分から郵便局にいた」証拠のように見せた。しかし黒田は18時47分に店内の牧野を見ており、瀬名も18時56分に店を出る牧野を目撃している。二つの独立した目撃が牧野のアリバイと衝突する。黒田の裏取引提案と瀬名の借金は疑わしいが、殺害時刻の矛盾には繋がらない。
  method: 閉店後の店内で水野を襲い、殺害後に小包を発送して郵便局の時刻をアリバイへ利用した
  motive: 初版本のすり替えが発覚し、警察と業界へ知られることを恐れたため
  requiredFacts: [makino-swapped-book, mizuno-discovered-swap, kuroda-saw-makino-1847, makino-killed-mizuno-1850, makino-left-1856, sena-saw-makino-leave, post-receipt-1908]
  secretKeywords:
    - 犯人は牧野
    - 牧野が犯人
    - 牧野が水野を襲
    - 私が水野を襲
    - すり替え発覚で殺
quality:
  expectedQuestionCount:
    min: 8
    max: 18
  requiredEvidence:
    min: 2
  redHerrings: [kuroda-secret-offer, sena-owed-money]
  notes: レシートを時刻の点の証拠として扱わせ、そこから「待っていた時間」まで勝手に拡張しないことが核心。黒田と瀬名の別方向の目撃を用意し、どちらか一人への質問を逃しても牧野の嘘へ到達できる。
