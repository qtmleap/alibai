briefing: |-
  ——事件の記録を読み上げます。

  商店街の一角にある古書店「青雨堂」は、一般的な文庫本から希少な初版本まで扱う小さな店です。店主の目利きを頼りに遠方から訪れる収集家もおり、ときには閉店後に個別の商談が続くこともありました。その日も高価な本を巡る話し合いが予定されていました。

  店主の水野英治は、長年この土地で古書を扱ってきた人物です。商売には厳しい一方で、本の来歴や以前の持ち主についてよく覚えており、常連客との付き合いも深いことで知られていました。

  水野英治は気難しい古書店主として評判でしたが、本の話になると客と何時間でも語る人物でした。値付けや保存には頑固なほど厳格で、その知識と本への誠実さから、長年の常連には親しまれていました。

  夕方から商店街には激しい雨が降り続きました。午後六時半に店は通常どおり閉店しましたが、商談や片づけのため関係者の一部はその後も店内や周辺に残っていました。

  午後七時十五分、店の奥で水野英治が死亡しているのが発見されます。事情を聞けるのは、店員の牧野千尋、常連の収集家・黒田征司、向かいの喫茶店主・瀬名真琴です。

  雨音に包まれた閉店後の商店街で、水野は誰と会っていたのか。三人から夕方以降の出来事を聞いてください。
