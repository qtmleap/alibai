schemaVersion: 1
id: coldcase-lodge-borrowed-memory
meta:
  title: 1979年、雪山荘の借り物の記憶
  synopsis: 2026年、47年前に未解決となった雪山荘の死亡事件が再調査される。当時の生存者三人は「午後十時半、被害者が暖炉前にいた」と揃って語る。しかし事件直後の聴取記録では、その目撃をした人物は一人しかいなかった。長い年月で混ざった記憶から、元の事件を再構成せよ。
  category: 未解決事件再調査
  difficulty: 5
  estimatedMinutes: 20
  tags: [1979年, 2026年, コールドケース, 回想]
briefing: |-
  2026年。47年前、雪崩で孤立した山荘「白樺館」で起きた未解決事件を再調査します。

  1979年2月17日の夜、山荘主・野上修一が書斎で死亡しました。当時館内にいた若者三人——現在は六十代となった高瀬真紀、藤村達也、倉田恵——はいま揃って「22時30分ごろ、野上が暖炉前で新聞を読んでいた」と記憶しています。

  ところが整理された旧捜査資料には、事件翌朝に取られた三人それぞれの供述調書も残っていました。47年間繰り返された話と、最初の一日だけに存在した記憶。どちらが誰自身の体験だったのかを確かめてください。
floorPlan: null
