solution:
  culprit: megumi
  summary: 犯人は倉田恵。1979年、仕入れ代の水増しを野上に見抜かれ、22時05分ごろ書斎で野上を襲った。22時30分に野上が暖炉前で生きていたという長年の定説は、真紀が自分の現金窃盗を隠すために作った虚偽の目撃が源だった。事件後の新聞がそれを「三人の目撃」と誤って報じ、47年間の回想で藤村と倉田の記憶にも混ざった。最初の供述へ戻ると、真紀は22時08分に書斎側から出てくる倉田を見ており、倉田には帳簿不正が発覚する動機もあった。
  method: 事件後に別人が作った虚偽の生存目撃が長年の共通記憶へ変化したことを利用し、実際の事件時刻を遅く見せ続けた
  motive: 仕入れ代の水増しが発覚し、翌朝警察へ相談されるのを防ぐため
  requiredFacts: [original-only-maki-claimed-sighting, tatsuya-originally-heard-from-maki, newspaper-published-fireplace-story, maki-lied-fireplace, maki-saw-megumi-study, megumi-forged-expenses, nogami-found-megumi-fraud, megumi-killed-nogami]
  secretKeywords:
    - 犯人は倉田
    - 倉田が野上を襲
    - 真紀の目撃は嘘
    - 暖炉前の目撃は嘘
quality:
  expectedQuestionCount: { min: 12, max: 26 }
  requiredEvidence: { min: 4 }
  redHerrings: [maki-stole-cash, tatsuya-secret-affair]
  notes: 現在の証言ではなく事件翌朝の一次資料へ戻るコールドケース型。誤報と反復で記憶が収束した構造を崩した後、当時の目撃と動機へ戻る。
