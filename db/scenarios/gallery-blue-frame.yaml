solution:
  culprit: sakaki
  summary: 犯人は榊玲。作品のすり替えを鳥羽に見抜かれ、翌朝館長と警察へ報告すると告げられた。榊は18時35分に紫外線検査を始めたが、18時37分に装置を止めて修復室を離れた。18時44分には榎本が収蔵庫前で榊を見ており、18時46分ごろ鳥羽を襲った後、18時50分ごろ修復室へ戻って18時51分に検査装置を再起動した。「ずっと検査をしていた」という榊のアリバイは機器の電源履歴と榎本の目撃の二方向から崩れる。御堂の不適切な謝礼提案と榎本の居眠りは、事件と切り離された秘密である。
  method: 紫外線検査装置を一度停止して修復室を離れ、収蔵庫前で鳥羽を襲った後に戻って検査を再開し、連続作業に見せかけた
  motive: 絵画のすり替えと本物の持ち出しが翌朝発覚し、職業上の立場を失うことを恐れたため
  secretKeywords:
    - 犯人は榊
    - 榊が犯人
    - 榊が鳥羽を襲
    - 私が鳥羽を襲
    - 贋作発覚で殺
