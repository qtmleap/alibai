briefing: |-
  ——事件の記録を読み上げます。

  市立青環美術館では、翌日から始まる企画展の準備が大詰めを迎えていました。その夜は関係者向けの内覧会が開かれ、展示室には招待客や美術関係者が集まっていました。閉館後の美術館には、展示替えを終えたばかりの作品と、片づけを続けるスタッフが残っています。

  主任学芸員の鳥羽薫は、今回の企画展を中心となって準備してきた人物です。作品の選定、借用先との交渉、展示状態の確認まで多くの業務を抱え、内覧会が終わったあとも館内で仕事を続けていました。

  鳥羽薫は作品の扱いに厳格な学芸員で、展示の質を下げる妥協を嫌うことで知られていました。口調は辛口でも若手の育成には熱心で、作品を見る目と仕事への誠実さを尊敬する関係者は少なくありませんでした。

  一般の招待客が帰ったあとは正面入口が閉じられ、残ったのは翌日の開幕に関わる少数の関係者だけでした。静かになった館内では、展示室や修復室、収蔵区画でそれぞれの片づけが進められていました。

  午後六時五十五分、収蔵庫前で鳥羽薫が死亡しているのが発見されます。館内に残っていた関係者は、絵画修復士の榊玲、画商の御堂和也、警備員の榎本駿です。

  華やかな内覧会が終わった直後、美術館の裏側で何が起きたのか。三人から閉館前後の出来事を聞いてください。
