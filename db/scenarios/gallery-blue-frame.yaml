schemaVersion: 1
id: gallery-blue-frame
meta:
  title: 青い額縁は修復室にない
  synopsis: 小さな現代美術館の内覧会で、学芸員・鳥羽薫が収蔵庫前で死亡した。修復士は「紫外線検査を続けていた」と主張するが、機器の電源記録は別の時間を示す。贋作疑惑、秘密の買収話、居眠りを隠す警備員——三つの嘘から事件に繋がる一つを選べ。
  category: 美術館ミステリ
  difficulty: 3
  estimatedMinutes: 10
  tags: [美術館, 贋作, 記録]
victim:
  name: 鳥羽薫
  introduction: 市立青環美術館主任学芸員
briefing: |-
  ——事件の記録を読み上げます。

  午後六時五十五分、市立青環美術館の収蔵庫前で、主任学芸員の鳥羽薫が死亡しているのが見つかりました。その夜は翌日から始まる企画展の内覧会で、一般客が帰った後も数人の関係者が館内に残っていました。

  調査対象は三人です。絵画修復士の榊玲、画商の御堂和也、警備員の榎本駿。榊は「六時半から六時五十五分まで修復室で作品の紫外線検査をしていた」と言い、御堂は「鳥羽とは挨拶しかしていない」、榎本は「巡回中ずっと警備端末を見ていた」と話します。

  館内の機器は人より正確に稼働時刻を残します。ただし、記録に残る小さな規則違反が殺人と関係するとは限りません。誰の嘘が鳥羽の死と結びつくのかを見極めてください。
floorPlan: null
facts:
  - id: sakaki-is-restorer
    statement: 榊玲は企画展に出品される絵画の状態確認を担当する修復士である
    kind: other
  - id: mido-is-dealer
    statement: 御堂和也は企画展の主要作品を仲介した画商である
    kind: other
  - id: enomoto-is-guard
    statement: 榎本駿は閉館後の館内巡回を担当する警備員である
    kind: other
  - id: sakaki-made-forgery
    statement: 榊玲は数か月前、修復を任された作品の一枚を精巧な贋作と入れ替え、本物を外部へ流そうとしていた
    kind: motive
    secret: true
  - id: toba-found-forgery
    statement: 鳥羽薫は事件当日の18時25分ごろ、額装と絵具層の違いから作品のすり替えに気づいた
    kind: motive
    secret: true
  - id: toba-confronted-sakaki
    statement: 18時29分ごろ、鳥羽薫は榊玲に贋作の件を問いただし、翌朝館長と警察へ報告すると告げた
    kind: motive
    secret: true
  - id: mido-offered-bribe
    statement: 18時32分ごろ、御堂和也は別作品の評価額を高く見せるため、鳥羽薫へ謝礼を持ちかけて拒否された
    kind: motive
    secret: true
  - id: uv-test-started
    statement: 18時35分、榊玲は修復室の紫外線検査装置を起動した
    kind: physical
  - id: uv-lamp-off-1837
    statement: 18時37分から18時51分まで、修復室の紫外線検査装置は電源が切れていた
    kind: physical
    secret: true
  - id: sakaki-left-restoration
    statement: 18時38分ごろ、榊玲は修復室を離れて収蔵庫側へ向かった
    kind: truth
    secret: true
  - id: enomoto-saw-sakaki-1844
    statement: 18時44分ごろ、榎本駿は収蔵庫前の通路で榊玲を見た
    kind: observation
  - id: sakaki-killed-toba-1846
    statement: 18時46分ごろ、榊玲は収蔵庫前で鳥羽薫を襲い死亡させた
    kind: truth
    secret: true
  - id: sakaki-returned-1850
    statement: 18時50分ごろ、榊玲は修復室へ戻った
    kind: truth
    secret: true
  - id: uv-test-resumed
    statement: 18時51分、修復室の紫外線検査装置が再び起動した
    kind: physical
  - id: enomoto-dozed
    statement: 榎本駿は18時35分から18時42分ごろまで警備控室で短時間居眠りしていた
    kind: other
    secret: true
  - id: body-found-1855
    statement: 18時55分、御堂和也が収蔵庫前で鳥羽薫の死を発見した
    kind: observation
  - id: genuine-painting-hidden
    statement: すり替えられた本物の絵画は、榊玲が契約していた外部保管庫から後に見つかった
    kind: physical
    secret: true
timeline:
  - id: forgery-discovered
    at: "18:25"
    participants: [sakaki]
    facts: [toba-found-forgery]
    description: 鳥羽が作品のすり替えに気づく。
  - id: sakaki-confronted
    at: "18:29"
    participants: [sakaki]
    facts: [toba-confronted-sakaki]
    description: 鳥羽が榊へ贋作の件を問いただし、翌朝の報告を告げる。
  - id: mido-bribe
    at: "18:32"
    participants: [mido]
    facts: [mido-offered-bribe]
    description: 御堂が作品評価を巡る謝礼を鳥羽へ持ちかけ、拒否される。
  - id: uv-test-start
    at: "18:35"
    participants: [sakaki]
    facts: [uv-test-started]
    description: 榊が修復室で紫外線検査装置を起動する。
  - id: sakaki-leaves
    at: "18:38"
    participants: [sakaki]
    facts: [uv-lamp-off-1837, sakaki-left-restoration]
    description: 装置の電源が切れた後、榊が修復室を離れて収蔵庫側へ向かう。
  - id: enomoto-sighting
    at: "18:44"
    participants: [sakaki, enomoto]
    facts: [enomoto-saw-sakaki-1844]
    description: 榎本が収蔵庫前の通路で榊を目撃する。
  - id: toba-death
    at: "18:46"
    participants: [sakaki]
    facts: [sakaki-killed-toba-1846]
    description: 榊が収蔵庫前で鳥羽を襲い、鳥羽は死亡する。
  - id: sakaki-returns
    at: "18:50"
    participants: [sakaki]
    facts: [sakaki-returned-1850, uv-test-resumed]
    description: 榊が修復室へ戻り、ほどなく紫外線検査を再開する。
  - id: discovery
    at: "18:55"
    participants: [mido, sakaki, enomoto]
    facts: [body-found-1855]
    description: 御堂が収蔵庫前で鳥羽の死を発見する。
characters:
  - id: sakaki
    name: 榊玲
    role: suspect
    publicIntroduction: "物静かで職人気質の修復士。"
    personality: 物静かで職人気質の修復士。作品の状態については細部まで説明するが、自分の判断を疑われることを極端に嫌う。鳥羽には技術を評価されていた一方、管理の厳しさを窮屈に感じていた。
    goals:
      - 作品のすり替えを隠したい
      - 紫外線検査を続けていたため修復室を離れられなかったと思わせたい
    knowledge: [sakaki-is-restorer, uv-test-started, uv-test-resumed, body-found-1855]
    secrets:
      - fact: sakaki-made-forgery
        disclosure: never
      - fact: toba-found-forgery
        disclosure: pressured
      - fact: toba-confronted-sakaki
        disclosure: pressured
      - fact: uv-lamp-off-1837
        disclosure: never
      - fact: sakaki-left-restoration
        disclosure: never
      - fact: sakaki-killed-toba-1846
        disclosure: never
      - fact: genuine-painting-hidden
        disclosure: never
    lies:
      - id: sakaki-uv-alibi
        about: sakaki-left-restoration
        claim: 18時35分から発見まで修復室で紫外線検査を続けていた。途中で装置を止める理由も、部屋を出る理由もない
        strategy: maintain-until-contradicted
    memories:
      - id: forgery-confrontation
        about: toba-confronted-sakaki
        detail: 鳥羽が額縁を机に置き「明日の朝、館長にも警察にも話す」と言ったとき、手が冷たくなったのを覚えている。
    relationships:
      - character: enomoto
        relation: 館内勤務の顔見知り
        attitude: 警備の目は細かいので少し苦手
  - id: mido
    name: 御堂和也
    role: suspect
    publicIntroduction: "洗練された物腰の画商。"
    personality: 洗練された物腰の画商。作品の価値と人間関係を同じように交渉材料として見る癖がある。鳥羽に不適切な提案を拒絶されたため、その面会自体を消したがっている。
    goals:
      - 鳥羽へ謝礼を持ちかけたことを隠したい
      - 贋作疑惑が自分の扱う作品全体へ波及するのを避けたい
    knowledge: [mido-is-dealer, body-found-1855]
    secrets:
      - fact: mido-offered-bribe
        disclosure: pressured
    lies:
      - id: mido-only-greeting
        about: mido-offered-bribe
        claim: 鳥羽さんとは内覧会の終わりに挨拶しただけで、作品の評価や金の話はしていない
        strategy: maintain-until-contradicted
    memories:
      - id: rejected-bribe
        about: mido-offered-bribe
        detail: 鳥羽に封筒を押し返され「作品の値段はあなたが決めるものじゃない」と言われた屈辱を覚えている。
    relationships: []
  - id: enomoto
    name: 榎本駿
    role: witness
    publicIntroduction: "口数の少ない警備員。"
    personality: 口数の少ない警備員。巡回経路と時刻はよく覚えているが、短時間居眠りしたことを処分の対象にされるのを恐れている。見た人物を必要以上に断定しない慎重さがある。
    goals:
      - 居眠りを隠したい
      - 18時44分の目撃については正確に話したい
    knowledge: [enomoto-is-guard, enomoto-saw-sakaki-1844, body-found-1855]
    secrets:
      - fact: enomoto-dozed
        disclosure: pressured
    lies:
      - id: enomoto-no-doze
        about: enomoto-dozed
        claim: 閉館後はずっと巡回か警備端末の確認をしていて、控室で寝たりはしていない
        strategy: maintain-until-contradicted
    memories:
      - id: blue-frame-corridor
        about: enomoto-saw-sakaki-1844
        detail: 収蔵庫前で、青い保護枠を抱えた榊とすれ違った。修復室にいるはずだと思っていたので時刻まで覚えている。
    relationships:
      - character: sakaki
        relation: 館内勤務の顔見知り
        attitude: 作業中は周囲が見えなくなる人だと思っている
revelations:
  - id: uv-alibi-collapses
    title: 紫外線検査は十四分止まっていた
    text: 修復室の紫外線検査装置は18時37分から18時51分まで停止しており、榊がその時間ずっと検査を続けていたという説明は成立しない。
    category: alibi
    subject:
      type: character
      id: sakaki
    sources:
      - type: character
        id: sakaki
        revealCondition: 榊に紫外線検査を中断した時間がなかったか具体的に尋ね、装置の電源記録と説明を比較した。
        requires:
          revelations: []
          evidences: [uv-power-log]
    relatedFacts: [uv-lamp-off-1837, sakaki-left-restoration, uv-test-resumed]
  - id: forgery-motive
    title: 鳥羽が見抜いた贋作
    text: 榊は本物の絵画を贋作とすり替えており、鳥羽は事件直前にその事実を見抜いて翌朝の報告を告げていた。
    category: motive
    subject:
      type: character
      id: sakaki
    sources:
      - type: character
        id: sakaki
        revealCondition: 榊に作品の真贋と鳥羽から18時29分に告げられた内容を追及し、すり替えの発覚が明確になった。
        requires:
          revelations: [uv-alibi-collapses]
          evidences: [frame-inspection-note]
    relatedFacts: [sakaki-made-forgery, toba-found-forgery, toba-confronted-sakaki, genuine-painting-hidden]
evidences:
  - id: uv-power-log
    label: 紫外線検査装置の電源履歴
    description: 装置は18時35分に起動したが、18時37分から18時51分まで停止している。
    reveal:
      mode: conversation
      condition: 榊に検査を続けていた時間帯を尋ねるか、榎本に修復室の機器ログを確認できないか尋ねたら開示する。
    sources:
      - type: character
        id: sakaki
      - type: character
        id: enomoto
    supports: [uv-test-started, uv-lamp-off-1837, uv-test-resumed]
    contradicts: ["lie:sakaki-uv-alibi"]
  - id: enomoto-sighting
    label: 十八時四十四分の収蔵庫前の目撃
    description: 榎本は18時44分ごろ、収蔵庫前の通路で榊を見ている。
    reveal:
      mode: conversation
      condition: 榎本に18時40分台の巡回で誰とすれ違ったか尋ね、榊の姿を見たと答えたら開示する。
    sources:
      - type: character
        id: enomoto
    supports: [enomoto-saw-sakaki-1844]
    contradicts: ["lie:sakaki-uv-alibi"]
  - id: frame-inspection-note
    label: 鳥羽の額装検査メモ
    description: 展示予定作品の額装と絵具層が過去の記録と一致せず、鳥羽が「原画ではない可能性」と書き残している。
    reveal:
      mode: conversation
      condition: 榊か御堂に鳥羽が事件前に作品の真贋を調べていなかったか尋ね、額装の違いへ話が及んだら開示する。
    sources:
      - type: character
        id: sakaki
      - type: character
        id: mido
    supports: [toba-found-forgery, sakaki-made-forgery]
    contradicts: []
  - id: mido-envelope
    label: 御堂の謝礼額を書いたメモ
    description: 御堂が鳥羽へ提示した謝礼額のメモ。拒否されたことは分かるが、事件時刻の行動とは結びつかない。
    reveal:
      mode: conversation
      condition: 御堂に鳥羽との会話内容を問い、金銭の話を否定したため商談資料を確認したら開示する。
    sources:
      - type: character
        id: mido
    supports: [mido-offered-bribe]
    contradicts: ["lie:mido-only-greeting"]
  - id: guard-break-log
    label: 警備控室端末の無操作記録
    description: 18時35分から18時42分ごろまで榎本の端末操作がなく、本人も短時間の居眠りを認めるが、18時44分の目撃とは両立する。
    reveal:
      mode: conversation
      condition: 榎本に巡回が途切れた時間がないか確認し、端末操作の空白を示したら開示する。
    sources:
      - type: character
        id: enomoto
    supports: [enomoto-dozed]
    contradicts: ["lie:enomoto-no-doze"]
solution:
  culprit: sakaki
  summary: 犯人は榊玲。作品のすり替えを鳥羽に見抜かれ、翌朝館長と警察へ報告すると告げられた。榊は18時35分に紫外線検査を始めたが、18時37分に装置を止めて修復室を離れた。18時44分には榎本が収蔵庫前で榊を見ており、18時46分ごろ鳥羽を襲った後、18時50分ごろ修復室へ戻って18時51分に検査装置を再起動した。「ずっと検査をしていた」という榊のアリバイは機器の電源履歴と榎本の目撃の二方向から崩れる。御堂の不適切な謝礼提案と榎本の居眠りは、事件と切り離された秘密である。
  method: 紫外線検査装置を一度停止して修復室を離れ、収蔵庫前で鳥羽を襲った後に戻って検査を再開し、連続作業に見せかけた
  motive: 絵画のすり替えと本物の持ち出しが翌朝発覚し、職業上の立場を失うことを恐れたため
  requiredFacts: [sakaki-made-forgery, toba-confronted-sakaki, uv-lamp-off-1837, sakaki-left-restoration, enomoto-saw-sakaki-1844, sakaki-killed-toba-1846, sakaki-returned-1850]
  secretKeywords:
    - 犯人は榊
    - 榊が犯人
    - 榊が鳥羽を襲
    - 私が鳥羽を襲
    - 贋作発覚で殺
quality:
  expectedQuestionCount:
    min: 8
    max: 18
  requiredEvidence:
    min: 2
  redHerrings: [mido-offered-bribe, enomoto-dozed]
  notes: 主経路は装置の停止記録と榎本の目撃で榊の「連続検査」アリバイを崩すこと。御堂と榎本の嘘も証拠で崩れるが、どちらも殺害時刻へは繋げない。
