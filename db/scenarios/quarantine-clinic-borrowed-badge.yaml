meta:
  title: "白嶺診療所は本日休診"
  synopsis: "午後九時四十分、感染対策のため一時閉鎖中の白嶺診療所で、事務長の星名悟が事務室内で死亡しているのが見つかりました。外扉は午後八時以降封鎖され、館内にいたのは看護主任の世良美冬、検査技師の久我夏樹、警備担当の相原誠の三人だけです。"
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 15
