solution:
  culprit: sera
  summary: 犯人は世良美冬。21時18分の認証記録は星名本人の生存証明ではない。その時刻に橙色バッジを着けて検査廊下を通ったのは、20時55分に星名からバッジを借りた久我だった。防護服姿の顔を見分けられなかった相原は、バッジの色だけで星名だと思い込んだ。さらに世良はバッジ貸与をその場で了承しており、使用者が久我であり得ることを知りながら、21時18分の記録を星名の生存根拠として説明していた。星名は実際には21時08分ごろ事務室で世良に襲われている。翌朝、世良が独断変更した同意書管理手順が本部へ報告される予定だったことが動機となった。
  method: 星名の管理バッジが一時的に久我へ貸与されていることを知りながら、その後のバッジ通過を星名本人の生存証明だと誤認させ、より早い時刻の犯行を隠した
  motive: 独断で変更した同意書管理手順を星名が翌朝本部へ正式報告する予定で、自分の責任問題になることを恐れたため
  secretKeywords:
    - 犯人は世良
    - 世良が犯人
    - 世良が星名を襲
    - 私が星名を襲
    - バッジを生存証明に偽装
