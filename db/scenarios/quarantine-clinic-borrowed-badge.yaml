briefing: |-
  ——事件の記録を読み上げます。

  山間の白嶺診療所では、感染症への対応のため一時的な隔離運用が行われていました。通常の外来は停止され、限られた職員だけが館内に残り、検査や物資管理、施設の維持に当たっています。普段なら人の出入りが多い廊下も、その夜は静まり返っていました。

  事務長の星名悟は、診療所の運営と物資、職員配置を管理する責任者です。医療行為そのものには関わらなくても、隔離期間中の勤務体制や備品の手配には欠かせない立場で、その夜も事務室で作業を続けていました。

  星名悟は几帳面な事務長で、診療所の物資や人員の手配を一手に引き受けていました。規則には厳格でしたが、現場が困れば自分で調整に走る人物でもあり、医療職からは裏方を支える頼れる存在として見られていました。

  午後八時以降、外扉は感染対策のため封鎖されました。必要な職員は全員館内におり、新たに人が入る予定もありません。外部との連絡は取れるものの、人の往来は止まっています。

  午後九時四十分、事務室で星名悟が死亡しているのが発見されました。館内にいた主な関係者は、看護主任の世良美冬、検査技師の久我夏樹、警備担当の相原誠です。

  隔離された診療所の夜、三人はそれぞれどの仕事をしていたのか。星名とのやり取りを含め、事件前後の様子を聞いてください。
