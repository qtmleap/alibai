solution:
  culprit: akiwa
  summary: 犯人は秋庭澄。仕入れ業者から謝礼を受けていたことを桐谷に見抜かれ、翌朝の契約見直しを告げられたため桐谷を襲った。秋庭は桐谷の杖を厨房脇へ持ち出し、旧階段の中空壁へ金属部分を当てて特徴的な音を作った。森崎は長年聞き慣れた音だったため二階を桐谷が歩いていると思ったが、実際には足音も声も確認していない。杖が厨房脇で見つかったこと、旧階段に新しい打痕があること、建物の構造上そこから二階へ硬い音が伝わることを合わせると、九時二十五分の音は桐谷の生存証明ではない。
  method: 桐谷を襲った後、愛用の杖と建物の音の伝わり方を利用して二階を歩く杖音を装い、死亡時刻を遅く見せた
  motive: 業者からの不正な謝礼と割高な仕入れが発覚し、契約見直しで不正が表面化することを恐れたため
  requiredFacts: [supplier-kickback, kiritani-confronted-akiwa, akiwa-killed-kiritani, akiwa-took-cane, old-partition-transmits, morisaki-heard-no-steps, akiwa-made-tapping, rail-fresh-marks]
  secretKeywords:
    - 犯人は秋庭
    - 秋庭が桐谷を襲
    - 秋庭が杖の音を作
    - 杖音で死亡時刻を偽装
quality:
  expectedQuestionCount:
    min: 10
    max: 22
  requiredEvidence:
    min: 3
  redHerrings: [morisaki-secret-unpaid, sakakibara-secret-materials]
  notes: 特徴的な音を人物識別に使う危うさを問う。録音や電子機器ではなく、建物の音響と物品の移動を組み合わせる。