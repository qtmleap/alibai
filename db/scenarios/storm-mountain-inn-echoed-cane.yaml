schemaVersion: 1
id: storm-mountain-inn-echoed-cane
meta:
  title: 嵐の山宿、二階を歩く杖
  synopsis: 暴風雨で孤立した古い山宿で、主人・桐谷宗介が帳場奥で死亡した。二十一時二十五分には宿泊客が二階廊下から桐谷愛用の杖の音を聞いており、そこまで生きていたと思われた。だが証人が聞いたのは足音ではなく、古い建物を伝ってきた金属音だった。
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 15
  tags: [山宿, 暴風雨, 音, 目撃錯誤]
briefing: |-
  ——事件の記録を読み上げます。

  午後九時五十分、暴風雨で孤立した山宿「梢庵」で、主人・桐谷宗介が帳場奥の事務室で死亡しているのが見つかりました。

  宿にいたのは料理長の秋庭澄、常連客の森崎透、修繕を請け負う大工の榊原蓮です。

  森崎は午後九時二十五分ごろ、二階客室で桐谷の杖らしい「コツ、コツ」という音を聞きました。桐谷は金属の石突きが付いた古い杖を使っており、廊下を歩くと独特の音がすることで知られています。

  ただし森崎は桐谷の姿を見ていません。古い木造の山宿では、音がした場所と、音が生まれた場所が同じとは限りません。
