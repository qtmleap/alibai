characters:
  - id: hiiragi
    name: 柊木慧
    role: suspect
    publicIntroduction: "機器の性能を熟知し、点検記録を客観的な証拠として扱う技師。"
    personality: 機器の性能を熟知し、点検記録を客観的な証拠として扱う技師。自分の作業効率に自信があり、不正を「現場の合理化」と言い換えがち。飛行軌跡と写真を自分の在席証明として押し出す。
    goals:
      - 過去写真を使った点検不正を隠したい
      - 十八分間の飛行記録を、自分が屋上で操縦し続けた証拠として通したい
    knowledge: [hiiragi-inspector, drone-repeat-route-capable, drone-flew-auto, route-has-no-manual-input, body-found-0129]
    secrets:
      - fact: hiiragi-falsified-inspections
        disclosure: pressured
      - fact: haga-found-false-inspections
        disclosure: pressured
      - fact: haga-planned-report
        disclosure: pressured
      - fact: hiiragi-loaded-auto-route
        disclosure: pressured
      - fact: hiiragi-left-roof
        disclosure: never
      - fact: hiiragi-killed-haga
        disclosure: never
      - fact: hiiragi-returned-roof
        disclosure: never
    lies:
      - id: hiiragi-roof-alibi
        about: hiiragi-left-roof
        claim: 01時から18分まで屋上の操縦席を離れていません。飛行軌跡と連続写真が全部残っています
        strategy: maintain-until-contradicted
      - id: hiiragi-manual-flight
        about: hiiragi-loaded-auto-route
        claim: 今夜の点検飛行は最初から最後まで手動操縦で、反復点検機能は使っていません
        strategy: maintain-until-contradicted
    memories:
      - id: qualification-threat
        about: haga-planned-report
        detail: 芳賀に「朝には安全部へ出す。ドローン運用からも外す」と言われ、過去の点検まで全部洗われると思った。
    relationships:
      - character: saegusa
        relation: 設備点検の同僚
        attitude: 通路の移動をよく見ているので警戒している
      - character: nami
        relation: 気象判断の協力者
        attitude: 風のデータに細かすぎて融通が利かないと思っている
  - id: saegusa
    name: 三枝千尋
    role: witness
    publicIntroduction: "保護装置の理屈に厳しい電気主任。"
    personality: 保護装置の理屈に厳しい電気主任。無断リセットを隠したいが、01時08分に連絡階段で柊木を見た記憶は明確。ドローンが自動運転できることも知っている。
    goals:
      - 保護装置を無断リセットしたことを隠したい
      - 01時08分の柊木の目撃は正確に話したい
    knowledge: [saegusa-electrician, saegusa-saw-hiiragi-0108, drone-repeat-route-capable, body-found-0129]
    secrets:
      - fact: saegusa-unauthorized-reset
        disclosure: pressured
    lies:
      - id: saegusa-no-reset
        about: saegusa-unauthorized-reset
        claim: 保護装置を正式承認なしでリセットしたことはありません
        strategy: maintain-until-contradicted
    memories:
      - id: stairs-hiiragi
        about: saegusa-saw-hiiragi-0108
        detail: 01時08分ごろ、屋上で操縦中のはずの柊木が会議室側の連絡階段を下りてきたので驚いた。
    relationships: []
  - id: nami
    name: 波木恵
    role: suspect
    publicIntroduction: "数字に慎重な気象担当。"
    personality: 数字に慎重な気象担当。風速記録の書き直しを隠したいが、点検ドローンが事前経路を自律飛行する運用は日常的に見ている。
    goals:
      - 風速の手書き記録を後から修正したことを隠したい
      - 自律飛行機能の存在は必要なら正確に説明する
    knowledge: [nami-weather, drone-repeat-route-capable, route-has-no-manual-input, body-found-0129]
    secrets:
      - fact: nami-edited-weather-note
        disclosure: pressured
    lies:
      - id: nami-no-edit
        about: nami-edited-weather-note
        claim: 今夜の風速記録を後から書き直したことはありません
        strategy: maintain-until-contradicted
    memories:
      - id: repeat-route-memory
        about: drone-repeat-route-capable
        detail: 定型点検では一度経路を読み込めば自動で写真まで撮れるので、操縦者は常時スティックを触る必要がないと知っている。
    relationships:
      - character: hiiragi
        relation: 点検業務の同僚
        attitude: 悪天候でも無理に飛ばしたがるところを危険だと思っている
  - id: kokubu
    name: 国分透
    role: suspect
    publicIntroduction: "在庫と数字に敏感な資材担当。"
    personality: 在庫と数字に敏感な資材担当。棚卸し不足を隠すため部品の付け替えをしており、芳賀に追及されていた。事件を自分の不正と結びつけられたくない。
    goals:
      - 予備部品の在庫付け替えを隠したい
      - 芳賀との在庫の口論を殺意と誤解されたくない
    knowledge: [kokubu-logistics, body-found-0129]
    secrets:
      - fact: kokubu-hid-spare-parts
        disclosure: pressured
    lies:
      - id: kokubu-no-stock-shift
        about: kokubu-hid-spare-parts
        claim: 別案件の部品を在庫へ付け替えたことはありません
        strategy: maintain-until-contradicted
    memories:
      - id: drone-no-operator-sound
        about: drone-flew-auto
        detail: 01時すぎに屋上付近を通ったとき、機体の音は聞こえたが操縦席から人の声や無線応答は聞こえなかった。
    relationships: []

revelations:
