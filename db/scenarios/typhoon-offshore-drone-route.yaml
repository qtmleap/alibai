    title: 飛行軌跡は操縦者の在席証明ではない
    text: 点検ドローンは登録済みの経路を自律飛行し、写真も自動撮影できる。十八分の飛行記録があっても柊木が屋上に居続けたことは証明しない。
    category: alibi
    subject: { type: character, id: hiiragi }
    sources:
      - type: character
        id: nami
        revealCondition: 波木に定型点検の飛行方式を尋ね、登録経路なら無人操作で写真まで撮れることを確認した。
        requires:
          revelations: []
          evidences: [flight-mode-log]
      - type: character
        id: hiiragi
        revealCondition: 柊木に飛行中の手動入力がないことと反復点検機能を突きつけ、手動操縦だという説明を崩した。
        requires:
          revelations: []
          evidences: [flight-mode-log]
    relatedFacts: [drone-repeat-route-capable, hiiragi-loaded-auto-route, drone-flew-auto, route-has-no-manual-input, hiiragi-left-roof]
  - id: hiiragi-stairs-contradiction
    title: 操縦中のはずの連絡階段
    text: 01時08分ごろ、三枝は会議室へ続く連絡階段で柊木を目撃しており、屋上の操縦席に居続けたという説明と両立しない。
    category: timeline
    subject: { type: event, id: saegusa-sighting }
    sources:
      - type: character
        id: saegusa
        revealCondition: 三枝に01時前後の連絡階段で誰を見たか尋ね、柊木の目撃時刻を具体化した。
        requires:
          revelations: [drone-flight-not-presence]
          evidences: [stairs-sighting]
    relatedFacts: [hiiragi-left-roof, saegusa-saw-hiiragi-0108]
  - id: hiiragi-inspection-motive
    title: 停止されるドローン運用資格
    text: 芳賀は柊木の点検写真使い回しを発見し、翌朝に本社安全部へ報告して柊木のドローン運用資格を停止する予定だった。
    category: motive
    subject: { type: character, id: hiiragi }
    sources:
      - type: character
        id: hiiragi
        revealCondition: 柊木に芳賀が照合していた点検写真と翌朝の資格停止予定を追及し、失職への恐れを明確にした。
        requires:
          revelations: [hiiragi-stairs-contradiction]
          evidences: [inspection-photo-duplicate]
      - type: character
        id: saegusa
        revealCondition: 三枝に芳賀が問題視していた点検報告を尋ね、過去写真との重複へ話をつなげた。
        requires:
          revelations: []
          evidences: [inspection-photo-duplicate]
    relatedFacts: [hiiragi-falsified-inspections, haga-found-false-inspections, haga-planned-report]

