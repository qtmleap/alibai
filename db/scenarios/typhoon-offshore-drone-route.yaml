schemaVersion: 1
id: typhoon-offshore-drone-route
meta:
  title: 台風圏の洋上基地、自律飛行の十八分
  synopsis: 台風で船もヘリも近づけない洋上風力基地で安全責任者が死亡した。点検技師は「事件時刻は屋上でドローンを操縦していた」といい、十八分間の飛行軌跡と連続写真も残る。だが同じ経路を繰り返す点検飛行は、人が操縦し続けなければ成立しないのか。
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 18
  tags: [洋上基地, 台風, ドローン, 自律飛行]
briefing: |-
  ——事件の記録を読み上げます。

  午前一時二十九分、沖合風力発電基地の会議室で、安全責任者の芳賀俊介が死亡しているのが見つかりました。台風接近で保守船は午後十一時に退避し、ヘリポートも閉鎖。基地には芳賀を含め五人だけが残っています。

  点検技師の柊木慧は「午前一時から一時十八分まで屋上の操縦席で点検ドローンを飛ばしていた」と話しています。ドローンには十八分間の飛行軌跡と、各設備を撮影した連続写真が残っています。

  ほかにいたのは、電気主任の三枝千尋、気象担当の波木恵、資材担当の国分透。基地内の移動は限られています。飛んでいた機体と、それを操作していた人を同一視してよいのか確かめてください。
floorPlan: null
facts:
  - id: hiiragi-inspector
    statement: 柊木慧は風車設備の外観点検とドローン運用を担当する技師である
    kind: other
  - id: saegusa-electrician
    statement: 三枝千尋は基地内の電気設備を担当する主任である
    kind: other
  - id: nami-weather
    statement: 波木恵は風況と気象観測を担当している
    kind: other
  - id: kokubu-logistics
    statement: 国分透は交換部品と資材の管理を担当している
    kind: other
  - id: hiiragi-falsified-inspections
    statement: 柊木慧は実施していない一部の外観点検を過去データの転用で実施済みとして報告していた
    kind: motive
    secret: true
  - id: haga-found-false-inspections
    statement: 芳賀俊介は事件当日、柊木慧の点検写真に過去データの使い回しがあることを見抜いた
    kind: motive
    secret: true
  - id: haga-planned-report
    statement: 芳賀俊介は翌朝、柊木慧の点検不正を本社安全部へ報告し、ドローン運用資格を停止する予定だった
    kind: motive
    secret: true
  - id: drone-repeat-route-capable
    statement: 点検ドローンには事前登録した経路を自動で飛び、指定地点で自動撮影する反復点検機能がある
    kind: physical
  - id: hiiragi-loaded-auto-route
    statement: 00時57分、柊木慧は十八分間の反復点検ルートをドローンへ読み込ませた
    kind: physical
    secret: true
  - id: drone-flew-auto
    statement: 01時00分から01時18分まで、点検ドローンは反復点検機能で自律飛行し、指定地点の写真を自動撮影した
    kind: physical
  - id: hiiragi-left-roof
    statement: 01時02分ごろ、柊木慧は屋上の操縦席を離れた
    kind: truth
    secret: true
  - id: saegusa-saw-hiiragi-0108
    statement: 01時08分ごろ、三枝千尋は会議室へ続く連絡階段で柊木慧を見た
    kind: observation
  - id: hiiragi-killed-haga
    statement: 01時12分ごろ、柊木慧は会議室で芳賀俊介を襲い死亡させた
    kind: truth
    secret: true
  - id: hiiragi-returned-roof
    statement: 01時17分ごろ、柊木慧は屋上の操縦席へ戻った
    kind: truth
    secret: true
  - id: route-has-no-manual-input
    statement: 01時00分から01時16分までの飛行記録には手動操縦入力がなく、自律飛行状態が続いていた
    kind: physical
  - id: saegusa-unauthorized-reset
    statement: 三枝千尋は設備停止を避けるため、保護装置の警報を正式承認なく一度リセットしていた
    kind: other
    secret: true
  - id: nami-edited-weather-note
    statement: 波木恵は観測入力のミスを隠すため、風速の手書き記録を後から修正していた
    kind: other
    secret: true
  - id: kokubu-hid-spare-parts
    statement: 国分透は棚卸し不足を隠すため、別案件の予備部品を一時的に在庫へ付け替えていた
    kind: other
    secret: true
  - id: body-found-0129
    statement: 01時29分、国分透が会議室で芳賀俊介の死を発見した
    kind: observation

