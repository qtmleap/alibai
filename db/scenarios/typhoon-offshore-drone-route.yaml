solution:
  culprit: hiiragi
  summary: 犯人は柊木慧。実施していない外観点検を過去写真の転用で済ませていたことを芳賀に見抜かれ、翌朝に本社安全部へ報告されドローン運用資格を停止される予定だった。柊木は00時57分に十八分間の反復点検ルートを機体へ読み込ませ、01時から自律飛行させた。飛行中は指定地点の写真も自動で撮影され、01時16分まで手動入力はない。柊木本人は01時02分ごろ屋上を離れ、01時08分には三枝が会議室側の連絡階段で目撃している。01時12分ごろ芳賀を襲い、01時17分ごろ操縦席へ戻った。
  method: 点検ドローンを登録済み経路で自律飛行させ、飛行軌跡と自動撮影写真を在席証明に見せかけて会議室へ移動した
  motive: 点検不正が発覚し、翌朝の報告でドローン運用資格と仕事上の信用を失うことを恐れたため
  requiredFacts: [hiiragi-falsified-inspections, haga-planned-report, drone-repeat-route-capable, hiiragi-loaded-auto-route, drone-flew-auto, route-has-no-manual-input, hiiragi-left-roof, saegusa-saw-hiiragi-0108, hiiragi-killed-haga]
  secretKeywords:
    - 犯人は柊木
    - 柊木が犯人
    - 柊木が芳賀を襲
    - 私が芳賀を襲
    - 自律飛行でアリバイを偽装
quality:
  expectedQuestionCount:
    min: 13
    max: 26
  requiredEvidence:
    min: 3
  redHerrings: [saegusa-unauthorized-reset, nami-edited-weather-note, kokubu-hid-spare-parts]
  notes: 飛行軌跡と連続写真という二種類の客観記録を、一つの自律飛行機能で同時に無効化する。手動入力の欠如と三枝の独立目撃を合わせ、単に『自動操縦も可能』という可能性だけで終わらせない。
