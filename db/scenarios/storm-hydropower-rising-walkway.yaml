schemaVersion: 1
id: storm-hydropower-rising-walkway
meta:
  title: 山中水力発電所、豪雨の夜
  synopsis: "午後九時十分、豪雨で孤立した山中の水力発電所。その旧制御室で所長・峰岸達也が死亡しているのが発見されました。"
  category: 不可能犯罪
  difficulty: 5
  estimatedMinutes: 18
  tags: [発電所, 豪雨, 密室, 水位]
victim:
  name: 峰岸達也
  introduction: 山中の水力発電所所長
briefing: |-
  ——事件の記録を読み上げます。

  山中の渓谷に建つ水力発電所は、周辺地域へ電力を送り続けるため昼夜を問わず運転されています。新しい中央制御設備の裏には、建設当初から使われてきた古い区画も残っており、保守や点検の際には今でも人が出入りします。

  所長の峰岸達也は、発電所全体の運転と安全管理を預かる責任者でした。長く現場に勤め、設備の更新計画にも関わってきた人物で、その夜も豪雨への対応を指揮するため施設に残っていました。

  峰岸達也は安全を最優先にする実直な所長で、古い設備でも無理な運転を認めない人物として知られていました。判断には厳格でしたが、非常時には真っ先に現場へ出るため、運転員や保守担当から頼られていました。

  夕方から雨量が増え、川の水位は急速に上昇しました。周辺道路は危険のため閉鎖され、発電所の職員たちは外へ出ずに設備の監視を続けます。建物の外では濁流の音が響き、通常とは異なる緊張の中で勤務が続いていました。

  午後九時十分、旧制御室で峰岸達也が死亡しているのが発見されます。その夜に発電所内にいた主な関係者は、保守主任の城戸真琴、安全監査員の西園寺悠、運転員の谷口航です。

  豪雨対応に追われる発電所で、峰岸の最後の時間に何が起きたのか。三人からその夜の作業と所内の様子を聞いてください。
floorPlan: null
