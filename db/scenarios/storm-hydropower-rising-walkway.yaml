solution:
  culprit: kido
  summary: 犯人は城戸真琴。未実施点検の記録改ざんを峰岸に見抜かれ、旧制御室へ呼び出された。城戸は正面扉ではなく、その時点ではまだ通行できた古い保守歩廊を使って旧制御室へ入り、峰岸を襲った後、増水前に同じ経路から戻った。その後の豪雨で歩廊が通れなくなり、発見時には正面扉が内側から施錠された「不可能な部屋」が出来上がった。水位記録は20時15分には歩廊が使え、20時40分ごろに初めて遮断されたことを示す。城戸の靴に旧歩廊特有の泥が付いていることも、その経路の使用を裏付ける。
  method: 通行可能なうちに古い保守歩廊から旧制御室へ出入りし、犯行後の増水によって経路が失われた状態を密室だと思わせた
  motive: 未実施の点検を実施済みとした記録改ざんが発覚し、責任追及を恐れたため
  requiredFacts: [kido-falsified-inspection, minegishi-called-kido, walkway-passable-2015, kido-used-walkway, kido-killed-minegishi, kido-left-before-rise, walkway-closed-2040, kido-boot-silt]
  secretKeywords:
    - 犯人は城戸
    - 城戸が峰岸を襲
    - 城戸が旧歩廊を使
    - 増水後に密室が完成
quality:
  expectedQuestionCount:
    min: 11
    max: 24
  requiredEvidence:
    min: 3
  redHerrings: [saionji-secret-draft, taniguchi-secret-bypass]
  notes: 密室が犯行前から存在したという暗黙の前提を崩す。発見時の静止画ではなく、環境が変化する時系列を追わせる事件。
