meta:
  title: 落雷停止、霧岳山頂駅
  synopsis: "午後九時三十八分、霧岳ロープウェイ山頂駅の運行事務室で、駅長の高瀬修司が死亡しているのが見つかりました。落雷で本線索道は停止し、山道も土砂流入で通行できません。午後八時五十分以降、山頂駅へ出入りした者はいません。"
  category: クローズドサークル
  difficulty: 4
  estimatedMinutes: 15
  tags: [山頂駅, 雷雨, 重量センサー, アリバイ]
victim:
  name: 高瀬修司
  introduction: 霧岳ロープウェイ山頂駅駅長
  foundAt: 21:38
  foundIn: 運行事務室
  causeOfDeath: 事件性のある外傷による死亡
  findings:
    - id: victim-state
      statement: 高瀬修司は運行事務室で倒れており、その場で死亡が確認されている。
    - id: victim-motive-material
      statement: 遺体のそばには「制動点検記録と作業履歴の不一致」に関わる資料が残されている。
briefing: |-
  ——事件の記録を読み上げます。

  霧岳ロープウェイの山頂駅は、観光客を山上へ運ぶ交通施設であると同時に、索道設備を管理する作業拠点でもあります。営業終了後には運転設備の確認や翌日の準備が行われ、職員が遅くまで残ることがあります。

  駅長の高瀬修司は、山頂駅の運営と索道の安全管理を預かる責任者でした。天候判断や運休の決定にも関わり、設備担当や運転主任をまとめる立場にありました。

  高瀬修司は安全規程に厳格な駅長で、悪天候では運行を止める判断をためらわない人物として知られていました。観光客には堅い印象を持たれがちでしたが、職員からは山頂駅を守る実直な責任者として信頼されていました。

  その夜、山頂付近で落雷が相次ぎ、本線の索道は停止しました。山道にも土砂が流れ込み、午後八時五十分以降、山頂駅へ新たに出入りした者はいません。残った者たちは復旧確認をしながら駅内で待機していました。

  午後九時三十八分、運行事務室で高瀬修司が死亡しているのが発見されます。駅にいた関係者は、運転主任の須藤拓海、案内係の榎本澄、設備担当の長峰礼、山岳写真家の折原壮です。

  雷雲の中に取り残された山頂駅で、営業終了後に何が起きたのか。四人からその夜の行動を聞いてください。
