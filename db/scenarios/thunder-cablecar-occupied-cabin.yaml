solution:
  culprit: sudo
  summary: 犯人は須藤拓海。実施していない制動点検を実施済みとして記録していたことを高瀬に見抜かれ、翌朝から運転業務を外され安全管理部へ報告される予定だった。須藤は21時09分ごろ、非常用搬器の点検席へ重い工具ケースを置いた。座席下のセンサーは人物を識別せず一定以上の荷重だけで『乗員1』を表示するため、監視盤には21時10分から30分まで一人が乗っているように見えた。須藤本人は21時12分ごろ搬器前を離れ、21時18分には榎本が職員通路で目撃している。21時22分ごろ高瀬を襲った後、21時28分ごろ搬器前へ戻った。
  method: 重い工具ケースで非常用搬器の重量センサーを反応させ、『乗員1』表示を在席証明に見せかけて運行事務室へ移動した
  motive: 制動点検記録の虚偽が発覚し、翌朝から運転業務を外され安全管理部へ報告されることを恐れたため
  requiredFacts: [sudo-falsified-brake-tests, takase-planned-suspension, cabin-display-weight-based, tool-case-heavy-enough, sudo-left-tool-case, occupancy-display-on, sudo-left-cabin-area, enomoto-saw-sudo-2118, sudo-killed-takase]
  secretKeywords:
    - 犯人は須藤
    - 須藤が犯人
    - 須藤が高瀬を襲
    - 私が高瀬を襲
    - 工具ケースで乗員表示を偽装
quality:
  expectedQuestionCount:
    min: 11
    max: 23
  requiredEvidence:
    min: 3
  redHerrings: [enomoto-kept-lost-wallet, nagamine-bypassed-heater, orihara-entered-restricted-deck]
  notes: 監視盤の『乗員1』という自然言語表示が、人を認識した記録だと誤読させる。長峰の仕様説明、折原の工具ケース目撃、榎本の通路目撃を別々の入口にして、単独の証言に依存しない。
