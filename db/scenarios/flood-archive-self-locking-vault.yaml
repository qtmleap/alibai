schemaVersion: 1
id: flood-archive-self-locking-vault
meta:
  title: 高潮の文書館、閉館後の夜
  synopsis: "午後九時四十分、海辺歴史文書館の希少資料庫で、館長の今泉孝臣が死亡しているのが見つかりました。高潮で防潮扉が閉じ、午後八時半以降に館外へ出入りした者はいません。"
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 18
  tags: [文書館, 高潮, 密室, 自動施錠]
victim:
  name: 今泉孝臣
  introduction: 海辺歴史文書館館長
briefing: |-
  ——事件の記録を読み上げます。

  海沿いに建つ歴史文書館には、地域の古文書や写真、行政資料などが保管されています。一般閲覧室の奥には温湿度を厳しく管理する収蔵区画があり、閉館後も修復や整理のため職員が残ることがあります。その夜も、いくつかの資料を巡る作業が続いていました。

  館長の今泉孝臣は、収蔵資料の管理と公開方針を決める責任者でした。館内の資料だけでなく、外部から持ち込まれた鑑定案件にも目を通し、関係者の調整を行っていました。

  今泉孝臣は資料保存に熱心で、古い記録を「町の記憶」と呼んで大切にしていた館長です。管理には厳格でしたが、若い学芸員や修復士の提案もよく聞き、文書館を育ててきた人物として職員から信頼されていました。

  夕方から海が荒れ、高潮への警戒が強まります。午後八時半には防潮設備が作動し、文書館は外部との出入りを停止しました。館内に残った人々は、安全が確認されるまで建物の中で待機することになります。

  午後九時四十分、希少資料庫で今泉孝臣が死亡しているのが発見されました。その夜に残っていたのは、修復士の八神琴子、学芸員の久我遼、警備担当の戸塚誠、外部鑑定人の真島香苗です。

  海水の音が近づく閉館後の文書館で、館長の最後の時間に何があったのか。四人からそれぞれの作業と行動を聞いてください。
floorPlan: null
