solution:
  culprit: yagami
  summary: 犯人は八神琴子。修復失敗を隠すため処置記録を改ざんしていたことを今泉に見抜かれ、翌朝から重要資料の修復を外され外部委員へ記録を出される予定だった。21時09分、今泉が搬入のため希少資料庫を開け、扉は21時22分まで開いたままだった。八神は21時14分ごろ、その開いた扉から鍵を使わず資料庫へ入り、久我が目撃している。21時17分ごろ今泉も入り、鍵を自分のポケットへ戻した。八神は21時20分ごろ今泉を襲い、21時22分に廊下へ出て扉を閉めた。資料庫は閉めるだけで自動施錠されるため、開錠鍵を持っていなくても外から密室状況を作れた。鍵が今泉のポケットに残っていたことは、誰も出なかった証明ではない。
  method: 搬入中に開いたままの資料庫へ鍵なしで入り、退出時は扉を閉めるだけで自動施錠される仕組みを利用して、鍵が被害者のポケットに残る密室状況を作った
  motive: 修復処置記録の改ざんが発覚し、翌朝から重要資料の担当を外され外部委員へ報告されることを恐れたため
  requiredFacts: [yagami-forged-restoration-record, imaizumi-planned-review, vault-key-only-opens, vault-self-locks, vault-open-2109, vault-stayed-open, yagami-entered-vault-2114, kuga-saw-yagami-2114, yagami-killed-imaizumi, yagami-left-vault-2122, key-found-on-imaizumi]
  secretKeywords:
