solution:
  culprit: kosaka
  summary: 犯人は香坂澪。修復報告の水増しを荻原に見抜かれ、額装作業室へ呼び出された香坂はそこで荻原を襲った。その後、夜間環境管理が始まる前に作品搬送台車で荻原を保存庫へ移し、自分は21時23分ごろに保存庫を出た。21時30分になると保存庫が自動的に閉鎖状態となり、発見時には「中で事件が起きたのに誰も出られない」ように見えた。しかし台紙片、台車の再使用跡、香坂の作業着の粉は額装作業室を実際の事件現場として示している。密室を解く鍵は扉の開け方ではなく、事件現場の前提を疑うことだった。
  method: 額装作業室で荻原を襲い、閉鎖前に保存庫へ移したうえで、夜間環境管理によって後から成立した密室を事件現場だと思わせた
  motive: 修復工程と材料費の水増しが発覚し、館長から責任追及されることを恐れたため
  requiredFacts: [forged-restoration-report, ogiwara-called-kosaka, kosaka-killed-ogiwara-framing, kosaka-moved-ogiwara, kosaka-left-vault-before-lock, vault-closed-2130, framing-paper-fibers, cart-used-after-cleaning]
  secretKeywords:
    - 犯人は香坂
    - 香坂が荻原を襲
    - 香坂が保存庫へ移
    - 保存庫は事件現場ではない
quality:
  expectedQuestionCount:
    min: 11
    max: 24
  requiredEvidence:
    min: 3
  redHerrings: [asakura-secret-private-loan, tada-secret-unlogged-break]
  notes: 密室の開閉方法を探すのではなく、発見場所が事件現場だという前提を外すタイプ。既存の自動施錠ものとの差別化として、主眼を物の搬送痕と現場誤認に置く。
