briefing: |-
  ——事件の記録を読み上げます。

  私設画廊「白環館」は、山間の別荘地に建てられた現代美術の展示施設です。展示室のほかに作品保存庫と修復区画を持ち、一般公開のない日にも学芸員や修復士が作品の入れ替えを行っています。その夜も翌日の展示準備が続いていました。

  館長の荻原直哉は、収蔵作品の選定と企画展を任されてきた人物です。作家や所有者との交渉にも直接関わり、閉館後まで館内に残って仕事をすることも珍しくありませんでした。

  荻原直哉は作品の保存と展示に厳格な館長で、細かな扱いにも口を出す人物として知られていました。その一方で若い作家を紹介する企画には熱心で、画廊を育ててきた功績を尊敬する関係者も多くいました。

  夕方から大雪となり、白環館へ続く道路は夜には通行できなくなりました。館内にいる者はそのまま宿直することとなり、外部からの訪問もありません。

  午後十時五分、作品保存庫の中で荻原直哉が死亡しているのが発見されます。その夜に残っていたのは、修復士の香坂澪、学芸員の朝倉凪、警備担当の多田圭です。

  雪に閉ざされた画廊で、展示準備をしていた三人と荻原のあいだに何があったのか。閉館後の行動について話を聞いてください。
