briefing: |-
  ——事件の記録を読み上げます。

  1928年、上海。外国商社、倉庫、船会社が集まる河岸では、昼夜を問わず多くの荷が行き交っていました。輸出倉庫では船の出港時刻に合わせて書類が作られ、人足たちは雨の中でも荷の積み替えを続けます。商いの速さがそのまま利益につながる時代でした。

  貿易商の周文海は、複数の取引先を持ち、倉庫から出る貨物の手配にも深く関わっていました。その夜も翌朝の船積みに向けて事務所に残り、帳簿や搬出書類の確認をしていたとされています。

  周文海は決断の速い豪胆な商人として河岸一帯で評判の人物でした。商売には厳格で強引な面もありましたが、古くから働く者の家族まで気にかける面倒見のよさも知られ、倉庫では大きな存在感を持っていました。

  日が暮れるころから暴風雨が強まり、河岸の道路には水があふれ始めました。やがて外部から倉庫へ近づくことは難しくなり、作業を終えた者たちも建物の中で雨脚が弱まるのを待っていました。

  その夜、輸出倉庫の事務室で周文海が死亡しているのが見つかります。倉庫内に残っていた主な関係者は、番頭の林雪梅、通関書記の陳伯安、荷役監督の王世傑です。

  暴風雨の上海埠頭で、周文海の仕事はどこまで進み、誰と接触していたのか。三人からその夜の倉庫の様子を聞いてください。
