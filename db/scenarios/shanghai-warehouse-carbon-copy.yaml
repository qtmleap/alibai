solution:
  culprit: lin
  summary: 犯人は林雪梅。帳簿外の絹荷を周に見抜かれ、21時52分ごろ事務室で周を襲った。周はその前に翌朝の搬出用として時刻欄が空白の伝票へ署名していたため、林は22時05分になって上紙へ時刻だけを書き足し、周がその時刻まで生きていたように見せた。だが三枚綴りの複写伝票では、同時に書かれた文字なら控えにも写る。署名は三枚にあるのに時刻は上紙だけで、陳も21時40分に時刻欄が空白だったと記録している。
  method: 事件前に署名された複写伝票の上紙へ後から時刻だけを書き足し、被害者の生存時刻を偽装した
  motive: 帳簿外の絹荷取引が発覚するのを防ぐため
  secretKeywords:
    - 犯人は林
    - 林が周を襲
    - 林が時刻を書き足
    - 私が時刻を書き足
