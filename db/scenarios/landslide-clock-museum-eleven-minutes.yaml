solution:
  culprit: shiba
  summary: 犯人は志波沙月。展示時計の来歴を偽ったことを倉橋に見抜かれ、翌朝に展示を外され理事会へ報告される予定だった。館内の親時計は十一分進んでおり、20時30分の鐘が鳴った実時刻は20時19分だった。志波が倉橋と話したのはその直後の20時20分ごろで、志波の「20時31分ごろにも倉橋は生きていた」という説明は十一分ずれている。志波は20時22分ごろ西回廊を離れ、20時24分には朝倉が修復室側の北廊下で志波を目撃している。20時28分ごろ倉橋を襲った後、20時34分ごろ展示準備室へ戻った。館内時計の表示を正しい時刻だと思い込むと、最後の目撃が十一分後ろへずれて犯行時間そのものを誤る仕掛けだった。
  method: 十一分進んだ館内時計と時報を基準に最後の目撃時刻を遅く見せ、実際にはその後の空白時間に修復室へ移動して倉橋を襲った
  motive: 展示時計の来歴改ざんが発覚し、翌朝の展示撤去と理事会報告で修復技師としての信用を失うことを恐れたため
  requiredFacts: [shiba-faked-provenance, kurahashi-planned-withdrawal, master-clock-fast-eleven, security-clock-accurate, half-past-chime-actual-2019, shiba-spoke-kurahashi-2020, shiba-left-west-corridor, asakura-saw-shiba-2024, shiba-killed-kurahashi]
  secretKeywords:
    - 犯人は志波
    - 志波が犯人
    - 志波が倉橋を襲
    - 私が倉橋を襲
    - 十一分ずれで犯行時刻を偽装
quality:
  expectedQuestionCount:
    min: 14
    max: 28
  requiredEvidence:
    min: 3
  redHerrings: [hoshina-sold-catalog-images, asakura-hid-cash-error, kido-caused-clock-offset]
  notes: 数字の時刻を直接聞くだけでは全員が同じ誤った時計を参照するため混乱する。鐘からの相対時間と別系統の防災端末を組み合わせて十一分を補正し、志波の最後の目撃と朝倉の目撃を実時刻へ戻すのが主経路。
