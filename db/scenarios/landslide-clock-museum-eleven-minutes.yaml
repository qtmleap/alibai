schemaVersion: 1
id: landslide-clock-museum-eleven-minutes
meta:
  title: 崩落の時計博物館、十一分早い八時半
  synopsis: 山道の崩落で孤立した時計博物館で学芸員長が死亡した。館内の証言は「八時半の大時計が鳴った直後」を基準にきれいに並ぶ。だが、その夜の館内時計は正しい時刻を示していたのか。十一分のずれを直すと、最後の目撃とアリバイの順番が入れ替わる。
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 18
  tags: [時計博物館, 崩落, 時刻錯誤, 最後の目撃]
briefing: |-
  ——事件の記録を読み上げます。

  午後八時四十二分、山間の私設時計博物館の修復室で、学芸員長の倉橋宗一が死亡しているのが見つかりました。午後七時すぎの土砂崩れで唯一の山道は通行不能となり、館内には倉橋を含め五人しか残っていませんでした。

  聞き込みが始まると、全員が時刻の基準として中央ホールの大時計を挙げます。修復技師の志波沙月は「八時半の鐘が鳴った直後、倉橋さんと西回廊で話した」といい、受付責任者の朝倉は「鐘の五分後に志波を修復室側の廊下で見た」と話しています。

  館内の展示時計は中央の親時計に同期しています。一方、防災設備と警備端末は別系統です。閉ざされた博物館で、同じ『八時半』が本当に同じ時刻なのか確かめてください。
floorPlan: null
