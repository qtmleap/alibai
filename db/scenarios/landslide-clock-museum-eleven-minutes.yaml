    kind: motive
    secret: true
  - id: kurahashi-planned-withdrawal
    statement: 倉橋宗一は翌朝、問題の時計を展示から外し、志波沙月の記録改ざんを理事会へ報告する予定だった
    kind: motive
    secret: true
  - id: master-clock-fast-eleven
    statement: 事件当夜、中央ホールの親時計は正しい時刻より十一分進んでいた
    kind: physical
  - id: gallery-clocks-follow-master
    statement: 館内の展示時計と時報は中央ホールの親時計に同期しており、親時計と同じく十一分進んでいた
    kind: physical
  - id: security-clock-accurate
    statement: 防災設備と警備端末の時刻は館内の親時計とは別系統で、正しい時刻を記録していた
    kind: physical
  - id: half-past-chime-actual-2019
