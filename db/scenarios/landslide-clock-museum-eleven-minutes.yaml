    kind: truth
  - id: shiba-spoke-kurahashi-2020
    statement: 20時20分ごろ、志波沙月は西回廊で倉橋宗一と短く話した
    kind: observation
  - id: shiba-left-west-corridor
    statement: 20時22分ごろ、志波沙月は西回廊を離れて修復室側へ向かった
    kind: truth
    secret: true
  - id: asakura-saw-shiba-2024
    statement: 20時24分ごろ、朝倉真紀は修復室へ続く北廊下で志波沙月を見た
    kind: observation
  - id: shiba-killed-kurahashi
    statement: 20時28分ごろ、志波沙月は修復室で倉橋宗一を襲い死亡させた
    kind: truth
    secret: true
  - id: shiba-returned-gallery
    statement: 20時34分ごろ、志波沙月は展示準備室へ戻った
    kind: truth
    secret: true
  - id: hoshina-sold-catalog-images
    statement: 保科悠人は未公開収蔵品の写真を許可なく外部の収集家へ送っていた
    kind: other
    secret: true
  - id: asakura-hid-cash-error
    statement: 朝倉真紀は当日の売上金の不足を自分の集計ミスだと知りながら報告を先延ばしにしていた
    kind: other
    secret: true
  - id: kido-caused-clock-offset
    statement: 城戸篤は夕方の同期試験で親時計の補正値を誤り、十一分進んだ状態のまま復旧完了とした
    kind: other
    secret: true
  - id: body-found-2042
    statement: 20時42分、保科悠人が修復室で倉橋宗一の死を発見した
    kind: observation

