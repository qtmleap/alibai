    kind: other
  - id: hoshina-curator
    statement: 保科悠人は資料整理を担当する若手学芸員である
    kind: other
  - id: kido-electrician
    statement: 城戸篤は館内時計と電気設備の保守を担当する外部技術者である
    kind: other
  - id: shiba-faked-provenance
    statement: 志波沙月は修復実績を上げるため、由来が不確かな時計を著名工房の作品として展示記録に登録していた
    kind: motive
