characters:
  - id: shiba
    name: 志波沙月
    role: suspect
    publicIntroduction: "古時計への知識と誇りが強い修復技師。"
    personality: 古時計への知識と誇りが強い修復技師。細部をよく覚えているように話すが、時刻については館内の鐘を意図的に基準にする。倉橋に記録改ざんを見抜かれたことを隠したい。
    goals:
      - 展示時計の来歴を偽ったことを隠したい
      - 「八時半の鐘の直後に倉橋と話した」という表現で、倉橋が実際の20時30分以降も生きていたように思わせたい
    knowledge: [shiba-restorer, master-clock-fast-eleven, gallery-clocks-follow-master, half-past-chime-actual-2019, shiba-spoke-kurahashi-2020, body-found-2042]
    secrets:
      - fact: shiba-faked-provenance
        disclosure: pressured
      - fact: kurahashi-found-provenance-fraud
        disclosure: pressured
      - fact: kurahashi-planned-withdrawal
        disclosure: pressured
      - fact: shiba-left-west-corridor
        disclosure: never
      - fact: shiba-killed-kurahashi
        disclosure: never
      - fact: shiba-returned-gallery
        disclosure: never
    lies:
      - id: shiba-late-last-seen
        about: shiba-spoke-kurahashi-2020
        claim: 20時30分の鐘が鳴った直後、20時31分か32分ごろに西回廊で倉橋さんと話しました。その時は間違いなく元気でした
        strategy: maintain-until-contradicted
      - id: shiba-stayed-west
        about: shiba-left-west-corridor
        claim: 倉橋さんと別れた後も20時40分ごろまで西側の展示準備室から離れていません
        strategy: maintain-until-contradicted
    memories:
      - id: board-report-threat
        about: kurahashi-planned-withdrawal
        detail: 倉橋に「明日、時計を展示から外して理事会にも記録を出す」と言われ、修復技師としての評価が終わると思った。
    relationships:
      - character: kido
        relation: 時計設備の保守担当
        attitude: 電気制御には強いが古時計そのものへの理解は浅いと見下している
      - character: hoshina
        relation: 同僚学芸員
        attitude: 収蔵品を軽く扱うところが嫌い
  - id: asakura
    name: 朝倉真紀
    role: witness
    publicIntroduction: "事務処理に強い受付責任者。"
    personality: 事務処理に強い受付責任者。売上金の集計ミスを隠したいので閉館後の帳簿作業を曖昧にするが、人とすれ違った順番はよく覚えている。時刻は大時計の鐘を信用していた。
    goals:
      - 売上金不足が自分の集計ミスだったことを隠したい
      - 鐘の五分後に北廊下で志波を見たことは正確に話したい
    knowledge: [asakura-reception, asakura-saw-shiba-2024, gallery-clocks-follow-master, body-found-2042]
    secrets:
      - fact: asakura-hid-cash-error
        disclosure: pressured
    lies:
      - id: asakura-no-cash-error
        about: asakura-hid-cash-error
        claim: 売上金の不足はまだ原因不明で、私の集計ミスではありません
        strategy: maintain-until-contradicted
    memories:
      - id: five-minutes-after-bell
        about: asakura-saw-shiba-2024
        detail: 半時の鐘が鳴ってから五分ほど後、北廊下で修復室の方から来る志波を見た。館内時計では20時35分近くだと思っていた。
    relationships:
      - character: kido
        relation: 設備業者
        attitude: 夕方から時計の同期試験でもたついていたのを覚えている
  - id: hoshina
    name: 保科悠人
    role: suspect
    publicIntroduction: "研究熱心だが承認欲求の強い若手学芸員。"
    personality: 研究熱心だが承認欲求の強い若手学芸員。未公開写真を外部へ送ったことが露見するのを恐れ、収蔵庫周辺の行動を隠す。倉橋とは展示方針で衝突していた。
    goals:
      - 未公開収蔵品の写真を外部へ送ったことを隠したい
      - 倉橋との口論だけで犯人扱いされたくない
    knowledge: [hoshina-curator, body-found-2042]
    secrets:
      - fact: hoshina-sold-catalog-images
        disclosure: pressured
    lies:
      - id: hoshina-no-image-leak
        about: hoshina-sold-catalog-images
        claim: 未公開収蔵品の画像を外部へ送ったことはありません
        strategy: maintain-until-contradicted
    memories:
      - id: master-clock-looked-odd
        about: master-clock-fast-eleven
        detail: 20時台に自分の腕時計と中央ホールの時計を見比べ、館内時計の方がかなり進んでいる気がしたが、作業中で深く考えなかった。
    relationships:
      - character: shiba
        relation: 同僚
        attitude: 技術は尊敬しているが、作品の価値を自分の手柄として語りすぎると思っている
  - id: kido
    name: 城戸篤
    role: suspect
    publicIntroduction: "機器の仕組みを平易に説明できる設備技術者。"
    personality: 機器の仕組みを平易に説明できる設備技術者。夕方の同期試験ミスを隠したいので最初は時計の精度に問題はなかったと言い張るが、防災端末と親時計が別系統であることは知っている。
    goals:
      - 親時計を十一分進ませたままにした作業ミスを隠したい
      - 防災端末の時刻が正しいことは必要なら説明する
    knowledge: [kido-electrician, master-clock-fast-eleven, gallery-clocks-follow-master, security-clock-accurate, body-found-2042]
    secrets:
      - fact: kido-caused-clock-offset
        disclosure: pressured
    lies:
      - id: kido-clock-accurate
        about: kido-caused-clock-offset
        claim: 夕方の同期試験は正常に終わりました。館内時計に大きな時刻ずれはなかったはずです
        strategy: maintain-until-contradicted
    memories:
      - id: offset-screen
        about: master-clock-fast-eleven
        detail: 同期試験の最後に補正値を一桁見間違えたかもしれないと気づいたが、崩落対応で呼ばれて確認を後回しにした。
    relationships: []

