    reveal:
      mode: conversation
      condition: 城戸か保科に館内時計の精度と、防災端末など別系統の時計との比較を尋ねたら開示する。
    sources:
      - { type: character, id: kido }
      - { type: character, id: hoshina }
    supports: [master-clock-fast-eleven, gallery-clocks-follow-master, security-clock-accurate, half-past-chime-actual-2019]
