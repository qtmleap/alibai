        about: sawatari-saw-shinomiya-real-2220
        claim: 22時20分から40分の間は通信区画にいました。端末、入室履歴、観測ログ、壁時計の四つが一致している以上、沢渡さんの目撃時刻のほうが間違っています
        strategy: maintain-until-contradicted
    memories:
      - id: knew-clock-dependence
        about: four-times-not-independent
        detail: 通信区画の端末も入室履歴も観測表示も壁時計も、同じ中央時刻系を参照していることは日常業務で知っている。
      - id: research-meeting-fear
        about: disclosure-next-morning
        detail: 牧瀬から「明日の会議で除外処理の理由を全員に説明してもらう」と告げられ、これまでの研究が崩れると感じた。
    relationships:
      - character: higuchi
        relation: 通信担当
        attitude: 同期障害の詳細を話されることを恐れている
      - character: sawatari
        relation: 整備員
        attitude: 携帯時計で時刻を確認する癖を軽視していた
  - id: higuchi
    name: 樋口海
    role: witness
    publicIntroduction: "神経質な通信担当。"
    personality: 神経質な通信担当。システム障害を自分の失態と考え、最初は同期ずれを小さく見せようとする。技術仕様については正確に説明できる。
    goals:
      - 同期障害の共有が遅れたことを隠したい
      - 四種類の記録が同じ時刻源を使っていたことは正確に伝えたい
    knowledge: [higuchi-comms, terminal-uses-central-clock, access-uses-central-clock, observation-log-central-clock, wall-clock-synced, four-times-not-independent, body-found-2310]
    secrets:
      - fact: central-clock-offset
        disclosure: pressured
      - fact: higuchi-hid-sync-failure
        disclosure: pressured
    lies:
      - id: higuchi-no-serious-offset
        about: central-clock-offset
        claim: 同期系には小さな警告が出ただけで、事件に影響するほどの時刻ずれはありませんでした
        strategy: maintain-until-contradicted
    memories:
      - id: seven-minute-offset
