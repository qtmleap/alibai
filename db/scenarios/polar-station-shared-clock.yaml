        detail: 障害確認時に中央時計が七分進んでいるのを見つけたが、対応の遅れを知られたくなくて全員への連絡を後回しにした。
    relationships:
      - character: shinomiya
        relation: 同僚
        attitude: システムに詳しい篠宮なら四記録が独立していないことを知っているはずだと思っている
  - id: sawatari
    name: 沢渡直人
    role: witness
    publicIntroduction: "現場感覚を重視する整備員。"
    personality: 現場感覚を重視する整備員。基地システムとは別の携帯時計を使う習慣があり、自分の見た時刻に自信がある。私物機器の無断使用だけは隠したい。
    goals:
      - 私物機器の無断使用を隠したい
      - 22時20分の篠宮の目撃時刻が独立した時計によるものだと説明したい
    knowledge: [sawatari-maintenance, handheld-clock-correct, sawatari-saw-shinomiya-real-2220, displayed-time-was-2227, body-found-2310]
    secrets:
