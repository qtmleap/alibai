schemaVersion: 1
id: polar-station-shared-clock
meta:
  title: 極夜基地、四つの時計が示した同じ嘘
  synopsis: 吹雪で孤立した極地観測基地で主任研究員が死亡した。容疑者のアリバイは、通信端末・入室履歴・観測ログ・壁時計という複数の時刻記録に支えられている。四つの証拠が一致しているなら確実に見える。だが、それらが本当に四つの独立した時計とは限らない。
  category: クローズドサークル
  difficulty: 5
  estimatedMinutes: 15
  tags: [極地基地, 時計, 時刻, 相関した証拠]
briefing: |-
  ——事件の記録を読み上げます。

  午後十一時十分、吹雪で完全に孤立した白夜第六観測基地の解析室で、主任研究員の牧瀬航が死亡しているのが見つかりました。基地内にいたのは観測員の篠宮怜、通信担当の樋口海、整備担当の沢渡直人の三人だけです。

  篠宮は午後十時二十分から四十分まで通信区画にいたと主張しています。通信端末の操作履歴、区画の入室履歴、観測ログ、廊下の壁時計はいずれも篠宮の説明と矛盾しない時刻を示しています。

  一方で吹雪の直前、基地の時刻同期系には障害が起きていました。複数の記録が一致することと、複数の独立した証拠があることは同じでしょうか。
floorPlan: null
facts:
  - id: shinomiya-observer
    statement: 篠宮怜は気象観測とデータ解析を担当する研究員である
    kind: other
  - id: higuchi-comms
    statement: 樋口海は基地の通信設備と時刻同期系を担当している
    kind: other
  - id: sawatari-maintenance
    statement: 沢渡直人は発電設備と居住区設備を担当する整備員である
    kind: other
  - id: central-clock-offset
    statement: 21時50分の同期障害以降、基地の中央時刻系は実際の時刻より七分進んだ状態で固定されていた
    kind: physical
    secret: true
  - id: terminal-uses-central-clock
    statement: 通信端末の操作履歴は基地の中央時刻系を参照している
    kind: physical
  - id: access-uses-central-clock
    statement: 通信区画の入室履歴は基地の中央時刻系を参照している
    kind: physical
  - id: observation-log-central-clock
    statement: 自動観測ログの時刻表示は基地の中央時刻系を参照している
    kind: physical
  - id: wall-clock-synced
    statement: 通信区画前の壁時計は中央時刻系から自動補正を受ける型である
    kind: physical
  - id: four-times-not-independent
    statement: 通信端末・入室履歴・自動観測ログ・通信区画前の壁時計は、すべて同じ中央時刻系の七分のずれを共有していた
    kind: truth
  - id: handheld-clock-correct
    statement: 沢渡直人の整備用携帯時計は中央時刻系と同期せず、実際の時刻を示していた
    kind: physical
  - id: sawatari-saw-shinomiya-real-2220
    statement: 実際の22時20分ごろ、沢渡直人は解析室側の通路で篠宮怜を見た
    kind: observation
  - id: displayed-time-was-2227
    statement: 沢渡直人が篠宮怜を見た実際の22時20分、中央時刻系では22時27分と表示されていた
    kind: truth
  - id: makise-death-real-2223
    statement: 実際の22時23分ごろ、牧瀬航は解析室で襲われ死亡した
    kind: truth
    secret: true
  - id: shinomiya-killed-makise
    statement: 篠宮怜は実際の22時23分ごろ解析室で牧瀬航を襲い死亡させた
    kind: truth
    secret: true
  - id: data-manipulation-found
    statement: 牧瀬航は篠宮怜が観測結果の一部を恣意的に除外していたことに気づいた
    kind: motive
    secret: true
  - id: disclosure-next-morning
    statement: 牧瀬航は翌朝の研究会議で篠宮怜の不適切なデータ除外を報告する予定だった
    kind: motive
    secret: true
  - id: higuchi-hid-sync-failure
    statement: 樋口海は同期障害の初動対応が遅れたことを責められるのを恐れ、障害発生時刻をすぐ共有しなかった
    kind: other
    secret: true
  - id: sawatari-used-extra-power
    statement: 沢渡直人は許可なく私物機器を基地電源へ接続していた
    kind: other
    secret: true
  - id: body-found-2310
    statement: 23時10分、樋口海が解析室で牧瀬航の死を発見した
    kind: observation
timeline:
