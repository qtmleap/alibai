solution:
  culprit: shinomiya
  summary: 犯人は篠宮怜。篠宮のアリバイを支える四つの時刻記録は独立していなかった。通信端末、入室履歴、自動観測ログ、壁時計はいずれも同じ中央時刻系を参照し、その中央時計は21時50分以降、実際より七分進んでいた。したがって四記録の一致は一つの誤差を共有した結果にすぎない。基地時刻と同期しない携帯時計を使う沢渡は、実際の22時20分に解析室側の通路で篠宮を目撃している。篠宮は22時23分ごろ解析室で牧瀬を襲った。牧瀬は篠宮による恣意的なデータ除外を翌朝の研究会議で取り上げる予定だった。複数証拠の数ではなく、それらの独立性を確かめることが解決の鍵となる。
  method: 同じ中央時計を参照する複数の記録を独立した時刻証拠のように見せ、七分の同期ずれによって実際の行動時刻をずらして説明した
  motive: 恣意的なデータ除外を翌朝の研究会議で公にされ、研究成果と立場を失うことを恐れたため
  requiredFacts: [central-clock-offset, four-times-not-independent, handheld-clock-correct, sawatari-saw-shinomiya-real-2220, makise-death-real-2223, disclosure-next-morning, shinomiya-killed-makise]
  secretKeywords:
    - 犯人は篠宮
    - 篠宮が犯人
    - 篠宮が牧瀬を襲
    - 私が牧瀬を襲
    - 四つの時計は同じ時刻源
quality:
  expectedQuestionCount:
    min: 12
    max: 24
  requiredEvidence:
    min: 3
  redHerrings: [higuchi-hid-sync-failure, sawatari-used-extra-power]
  notes: 複数時計で補強されたアリバイという古典的発想を、「証拠の相関」に置き換えたもの。四つの一致より一本の独立時計のほうが強い、という推理を要求する。
