      condition: 沢渡に22時20分の目撃時刻を何で確認したか尋ねたら開示する。
    sources:
      - type: character
        id: sawatari
    supports: [handheld-clock-correct, sawatari-saw-shinomiya-real-2220, displayed-time-was-2227]
    contradicts: ["lie:shinomiya-four-clock-alibi"]
  - id: meeting-agenda
    label: 翌朝の研究会議議題
    description: 牧瀬の会議メモに、篠宮によるデータ除外の妥当性を全員の前で確認する予定が記されている。
    reveal:
      mode: conversation
      condition: 篠宮か樋口に翌朝の研究会議で牧瀬が扱う予定だった議題を尋ねたら開示する。
    sources:
      - type: character
        id: shinomiya
      - type: character
        id: higuchi
