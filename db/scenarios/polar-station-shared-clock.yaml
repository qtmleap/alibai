    title: 四つの記録、ひとつの時計
    text: 篠宮のアリバイを支える通信端末・入室履歴・観測ログ・壁時計はすべて同じ中央時刻系を参照していた。中央時計が七分進んでいたため、四つの一致は独立した確認ではなく、一つの誤差を四回見ているだけだった。
    category: timeline
    subject:
      type: event
      id: sync-failure
    sources:
      - type: character
        id: higuchi
        revealCondition: 樋口に四種類の時刻記録がそれぞれ何を時刻源にしているかと、同期障害のずれ幅を追及した。
        requires:
          revelations: []
          evidences: [clock-source-diagram]
      - type: character
        id: sawatari
        revealCondition: 沢渡に携帯時計が基地時刻と同期しているか尋ね、22時20分の目撃が独立した時計に基づくと確認した。
        requires:
          revelations: []
          evidences: [handheld-watch-note]
    relatedFacts: [central-clock-offset, four-times-not-independent, handheld-clock-correct, sawatari-saw-shinomiya-real-2220]
