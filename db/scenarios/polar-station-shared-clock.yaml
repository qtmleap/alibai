    at: "21:50"
    participants: [higuchi]
    facts: [central-clock-offset, higuchi-hid-sync-failure]
    description: 時刻同期系に障害が起き、基地の中央時刻系が実際より七分進んだ状態になる。
  - id: false-alibi-window
    at: "22:13"
    participants: [shinomiya]
    facts: [terminal-uses-central-clock, access-uses-central-clock, observation-log-central-clock, wall-clock-synced, four-times-not-independent]
    description: 中央時刻系のずれを共有する複数の記録が、篠宮の通信区画滞在を実際より七分遅い時刻として残す。
  - id: real-corridor-sighting
    at: "22:20"
    participants: [shinomiya, sawatari]
    facts: [handheld-clock-correct, sawatari-saw-shinomiya-real-2220, displayed-time-was-2227]
    description: 沢渡が独立した携帯時計で22時20分を確認し、解析室側の通路にいる篠宮を目撃する。
  - id: makise-death
    at: "22:23"
    participants: [shinomiya]
    facts: [makise-death-real-2223, shinomiya-killed-makise]
    description: 篠宮が解析室で牧瀬を襲い、牧瀬は死亡する。
  - id: discovery
    at: "23:10"
    participants: [higuchi, shinomiya, sawatari]
    facts: [body-found-2310]
    description: 樋口が解析室で牧瀬の死を発見する。
characters:
  - id: shinomiya
    name: 篠宮怜
    role: suspect
    publicIntroduction: "理詰めで話す観測員。"
    personality: 理詰めで話す観測員。記録が複数一致していることを強く主張し、個人の目撃よりシステムログを信用すべきだと言う。研究成果を失うことへの焦りが強い。
    goals:
      - 四種類の時刻記録を独立したアリバイ証拠に見せたい
      - 観測データを恣意的に除外していたことを隠したい
    knowledge: [shinomiya-observer, terminal-uses-central-clock, access-uses-central-clock, observation-log-central-clock, wall-clock-synced, body-found-2310]
    secrets:
