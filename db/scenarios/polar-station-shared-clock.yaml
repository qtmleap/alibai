  - id: sync-error-record
    label: 七分の同期ずれ記録
    description: 21時50分以降、中央時刻系が実際より七分進んだ状態だったことが保守記録から確認できる。
    reveal:
      mode: conversation
      condition: 樋口に同期障害の実際のずれ幅と発生時刻を追及したら開示する。
    sources:
      - type: character
        id: higuchi
    supports: [central-clock-offset]
