schemaVersion: 1
id: generation-ship-staggered-dawn
meta:
  title: 世代船、三つの夜明け
  synopsis: 2312年、恒星間世代船の居住リングで生態系主任が死亡した。容疑者たちは皆「人工夜明けの後」の行動を語るが、船内では電力負荷を平準化するため区画ごとに昼夜周期がずらされている。同じ“六時”が同じ瞬間とは限らない。
  category: SFクローズドサークル
  difficulty: 5
  estimatedMinutes: 15
  tags: [2312年, 世代船, 人工昼夜, 時刻]
briefing: |-
  2312年、恒星間世代船《アステリア》。外部航行中のため、居住リングから船外へ出ることはできません。

  生態系主任ミラ・ヴォスが種子保管区で死亡しました。聞き込み対象は三人。農業区画主任セラ・イワノフ、電力管制官ダリオ・ケイン、医療技師ユナ・パクです。

  三人とも「人工夜明け」「六時台」を基準に行動を説明します。しかし《アステリア》では全区画が同時に朝を迎えるわけではありません。農業区、中央区、医療区の照明周期を一つの時計へ変換してから証言を並べてください。
floorPlan: null
