timeline:
  - id: mira-confronts-sera
    at: "05:45"
    participants: [sera]
    facts: [sera-seed-diversion, mira-found-diversion, mira-would-audit]
    description: ミラが希少種子の流用をセラへ突きつけ、中央評議会への報告を告げる。
  - id: dario-sees-sera
    at: "05:52"
    participants: [sera, dario]
    facts: [dario-saw-sera-0552]
    description: ダリオが種子保管区へ向かう連絡路でセラを見かける。
  - id: mira-death
    at: "05:57"
    participants: [sera]
    facts: [sera-killed-mira]
    description: セラが種子保管区でミラを襲う。
  - id: agriculture-six
    at: "06:00"
    participants: [sera]
    facts: [agriculture-dawn-0600-local, sera-claimed-after-six]
    description: 船内標準時ではすでに06時00分だが、セラは農業区の人工06時05分を基準に自分の行動を説明する。
  - id: medical-six
    at: "06:20"
    participants: [yuna]
