    kind: observation
  - id: tozuka-killed-kamiya-2023
    statement: 20時23分ごろ、戸塚岳は祭具倉庫内で神谷宗一を襲い死亡させた
    kind: truth
    secret: true
  - id: tozuka-returned-2025
    statement: 20時25分ごろ、戸塚岳は照明操作卓へ戻った
    kind: truth
    secret: true
  - id: lights-restored-2026
    statement: 20時26分、自動復旧シーケンスが完了して提灯と舞台照明が再点灯した
