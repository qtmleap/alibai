solution:
  culprit: tozuka
  summary: 犯人は戸塚岳。照明設備の発注水増しと謝礼の受領を神谷に知られ、祭り終了後に公表されると告げられていた。20時18分に照明トラブルが起きると、実際には制御盤が自動復旧を始めていたにもかかわらず「操作卓で手動復旧していた」とアリバイを作り、20時20分ごろその場を離れた。20時22分には相原が祭具倉庫方向へ急ぐ戸塚を見ており、戸塚は予備鍵の暗証番号も知っていた。20時23分ごろ倉庫内で神谷を襲い、20時25分に操作卓へ戻る。20時26分に照明が自動で復旧したため、外からは戸塚がずっと対応していたように見えた。真壁の寄付金流用と相原の出店問題は独立した隠し事である。
  method: 停電中の自動復旧を利用して操作卓を離れ、祭具倉庫で神谷を襲った後に操作卓へ戻った
  motive: 発注不正と謝礼の受領が祭り終了後に公表されることを恐れたため
  requiredFacts: [kamiya-found-kickbacks, kamiya-warned-tozuka, lighting-preset-ran, tozuka-left-console-2020, aihara-saw-tozuka-2022, tozuka-killed-kamiya-2023, spare-key-borrowed]
  secretKeywords:
    - 犯人は戸塚
    - 戸塚が犯人
    - 戸塚が神谷を襲
    - 私が神谷を襲
    - 停電をアリバイに殺
quality:
  expectedQuestionCount:
    min: 9
    max: 19
  requiredEvidence:
    min: 2
  redHerrings: [makabe-used-donations, aihara-unlicensed-stall]
  notes: 核心は「停電復旧はその場に人が必要」という思い込みを制御ログで外し、相原の目撃と戸塚の操作卓アリバイを衝突させること。鍵の入手可能性は補強であり、単独で犯人を決める証拠にはしない。
