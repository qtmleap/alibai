    statement: 20時35分、真壁聡が祭具倉庫で神谷宗一の死を発見した
    kind: observation
  - id: spare-key-borrowed
    statement: 戸塚岳は祭り準備中に配線確認を理由として祭具倉庫の予備鍵を借りた経験があり、鍵箱の暗証番号を知っていた
