    kind: motive
    secret: true
  - id: makabe-used-donations
    statement: 真壁聡は神社の修繕費を補うため、祭りの寄付金から一時的に金を流用していた
    kind: motive
    secret: true
  - id: aihara-unlicensed-stall
    statement: 相原夏帆は知人の屋台一軒を正式な申請前に出店させており、神谷宗一から注意を受けていた
    kind: other
    secret: true
