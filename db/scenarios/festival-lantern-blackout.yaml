schemaVersion: 1
id: festival-lantern-blackout
meta:
  title: 消えた提灯、八分間の暗闇
  synopsis: 夏祭りの最中、実行委員長・神谷宗一が神社の祭具倉庫で死亡しているのが見つかった。直前には会場一帯の提灯が八分間だけ消えている。停電対応に追われていたはずの三人のうち、一人だけが「その場にいなければできない仕事」をしていなかった。
  category: 祭りの夜
  difficulty: 3
  estimatedMinutes: 10
  tags: [夏祭り, 停電, アリバイ]
briefing: |-
  ——事件の記録を読み上げます。

  午後八時三十五分、八坂野神社の夏祭りで、実行委員長の神谷宗一が祭具倉庫の中で死亡しているのが見つかりました。会場には多くの客がいましたが、事件の直前、午後八時十八分から八時二十六分まで提灯と舞台照明が一斉に消えるトラブルが起きています。

  調査対象は三人です。照明設備を担当していた電気技師の戸塚岳、神社の禰宜・真壁聡、屋台会をまとめる相原夏帆。戸塚は「停電中ずっと操作卓で復旧作業をしていた」と言い、真壁は「倉庫へは近づいていない」と話し、相原は「暗くて誰の姿も見ていない」と答えています。

  停電の八分間、会場の設備は何を自動で動かし、誰が実際にその場所へいなければならなかったのか。三人の証言から、暗闇の使われ方を明らかにしてください。
floorPlan: null
facts:
  - id: tozuka-is-electrician
    statement: 戸塚岳は夏祭りの提灯と舞台照明の電気設備を担当する技師である
    kind: other
  - id: makabe-is-priest
    statement: 真壁聡は八坂野神社の禰宜で、祭具倉庫の鍵を管理している
    kind: other
  - id: aihara-leads-stalls
    statement: 相原夏帆は屋台会の取りまとめ役で、祭り本部と各屋台の連絡を担当している
    kind: other
  - id: kamiya-found-kickbacks
