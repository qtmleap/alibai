briefing: |-
  ——事件の記録を読み上げます。

  1863年、ロンドン。

  蒸気機関車が地下を走るという、少し前までなら冗談のように聞こえた鉄道が開業したばかりの年です。煤煙と蒸気に包まれた街では、その新しい交通網をさらに延ばすため、夜になって旅客列車が止まったあとも各所で工事が続けられていました。

  事件が起きたのは、そんな地下鉄に隣接する夜間工事区画です。地上には二つの立坑が設けられ、その下を掘削中の坑道が結んでいました。日中は大勢の作業員が出入りする現場でしたが、その夜は翌朝の検査に備えた確認作業だけが残され、ほとんどの者はすでに帰宅していました。

  主任技師エドワード・ヘイルも現場に残った一人でした。ヘイルは延伸工事の工程を取りまとめる責任者で、現場の作業だけでなく、資材の受け入れや工事記録の確認にも目を通していました。翌朝には上役による視察が予定されており、その晩も遅くまで立坑と事務区画を行き来していたとされています。

  エドワード・ヘイルは工事の安全と工程に厳格な主任技師でした。職人の名前をよく覚え、若い技師の質問にも自分の手を止めて答えることで知られており、口数は多くなくても現場では慕われる人物でした。

  夜が更けるにつれ、ロンドンを激しい雨が襲いました。低い道路には水がたまり、馬車の往来も次第に難しくなります。工事区画の周囲でも浸水を警戒して地上の入口が閉じられ、午後九時半を過ぎるころには、新たに現場へ入った者も、そこから帰った者もいませんでした。

  その後、主任技師エドワード・ヘイルが工事区画内で死亡しているのが発見されます。その時まで現場に残っていた関係者は、施工監督のアーサー・ベル、電信係のクララ・ウェッブ、機関助手のトーマス・リードの三人です。

  雨音と蒸気機関の響く地下で、その夜、何が起きていたのか。三人から話を聞き、ヘイルが死亡するまでの出来事を明らかにしてください。
